&lt;body&gt;
&lt;div class=&quot;intro&quot; id=&quot;intro&quot;&gt;

&lt;main class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;mast&quot;&gt;
    &lt;h1&gt;&lt;span class=&quot;ttl&quot;&gt;진심 신당&lt;/span&gt;&lt;small&gt;四柱八字 · 절기·진태양시 기준&lt;/small&gt;&lt;/h1&gt;
    &lt;div class=&quot;mast-r&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;gear&quot; id=&quot;gear&quot; aria-label=&quot;설정&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;3.2&quot;/&gt;&lt;path d=&quot;M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7&quot;/&gt;&lt;/svg&gt;&lt;/button&gt;&lt;div class=&quot;seal&quot; aria-hidden=&quot;true&quot;&gt;神&lt;br&gt;堂&lt;/div&gt;&lt;/div&gt;

\uD604\uC740 \uC11C\uD234\uC9C0\uB9CC \uD55C\uACB0\uAC19\uACE0, \uC0C1\uB300\uC5D0\uAC8C \uBBFF\uC74C\uC9C1\uD55C \uC6B8\uD0C0\uB9AC\uAC00 \uB418\uC5B4 \uC90D\uB2C8\uB2E4.&quot;,stress:&quot;\uC790\uAE30 \uB73B\uB300\uB85C \uC77C\uC774 \uAD74\uB7EC\uAC00\uC9C0 \uC54A\uC744 \uB54C \uAC00\uC7A5 \uD798\uB4ED\uB2C8\uB2E4. \uC232\uAE38 \uAC77\uAE30, \uB4F1\uC0B0\uCC98\uB7FC \uBAB8\uC744 \uC4F0\uBA70 \uC704\uB85C \uBED7\uB294 \uD65C\uB3D9\uC774 \uD68C\uBCF5\uC5D0 \uC88B\uC2B5\uB2C8\uB2E4.&quot;,tip:&quot;\uBD80\uB7EC\uC9C0\uC9C0 \uC54A\uC73C\uB824\uBA74 \uAC00\uB054\uC740 \uD718\uC5B4\uC838\uB3C4 \uAD1C\uCC2E\uC2B5\uB2C8\uB2E4. \uB3C4\uC6C0\uC744 \uCCAD\uD558\uB294 \uAC83\uB3C4 \uB9AC\uB354\uC758 \uB2A5\uB825\uC785\uB2C8\uB2E4.&quot;},{kw:[&quot;\uC801\uC751\uB825&quot;,&quot;\uCE5C\uD654\uB825&quot;,&quot;\uC12C\uC138\uD568&quot;,&quot;\uC0DD\uD65C\uB825&quot;,&quot;\uB048\uAE30&quot;],core:&quot;\uBC14\uB78C\uC5D0 \uB215\uB418 \uAEBE\uC774\uC9C0 \uC54A\uB294 \uD480\uACFC \uB369\uAD74\uCC98\uB7FC \uC720\uC5F0\uD569\uB2C8\uB2E4. \uD658\uACBD\uC5D0 \uB9DE\uCDB0 \uBAA8\uC2B5\uC744 \uBC14\uAFB8\uBA74\uC11C\uB3C4 \uACB0\uAD6D \uC6D0\uD558\uB294 \uACF3\uAE4C\uC9C0 \uBED7\uC5B4 \uAC00\uB294 \uC0DD\uBA85\uB825\uACFC \uD604\uC2E4 \uAC10\uAC01\uC774 \uB6F0\uC5B4\uB0A9\uB2C8\uB2E4.&quot;,good:[&quot;\uC5B4\uB5A4 \uD658\uACBD\uC5D0\uC11C\uB3C4 \uAE08\uBC29 \uC790\uB9AC\uB97C \uC7A1\uB294 \uC801\uC751\uB825&quot;,&quot;\uC0AC\uB78C \uC0AC\uC774\uB97C \uBD80\uB4DC\uB7FD\uAC8C \uC787\uB294 \uCE5C\uD654\uB825&quot;,&quot;\uBCF4\uAE30\uBCF4\uB2E4 \uC9C8\uAE34 \uB048\uAE30\uC640 \uC0DD\uD65C\uB825&quot;],bad:[&quot;\uAC08\uB4F1\uC744 \uD53C\uD558\uB824\uB2E4 \uC18D\uB9C8\uC74C\uC744 \uAC10\uCDA4&quot;,&quot;\uACB0\uC815\uC744 \uBBF8\uB8E8\uAC70\uB098 \uC8FC\uBCC0\uC5D0 \uAE30\uB300\uB294 \uC2B5\uAD00&quot;,&quot;\uAC89\uC73C\uB85C \uC6C3\uC73C\uBA70 \uC18D\uC73C\uB85C \uACC4\uC0B0\uC774 \uB9CE\uC544 \uBCF4\uC77C \uC218 \uC788\uC74C&quot;],people:&quot;\uBD84\uC704\uAE30\uB97C \uC77D\uACE0 \uC0C1\uB300\uC5D0\uAC8C \uB9DE\uCDB0 \uC8FC\uB294 \uB2A5\uB825\uC774 \uD0C1\uC6D4\uD574 \uC5B4\uB514\uC11C\uB098 \uD638\uAC10\uC744 \uC5BB\uC2B5\uB2C8\uB2E4. \uC778\uB9E5\uC744 \uD1B5\uD574 \uAE30\uD68C\uB97C \uB9CC\uB4DC\uB294 \uC7AC\uC8FC\uAC00 \uC788\uC2B5\uB2C8\uB2E4.&quot;,work:&quot;\uD611\uC5C5, \uC870\uC728, \uB514\uC790\uC778, \uC11C\uBE44\uC2A4\uCC98\uB7FC \uC0AC\uB78C\uACFC \uAC10\uAC01\uC744 \uB2E4\uB8E8\uB294 \uC77C\uC5D0 \uAC15\uD569\uB2C8\uB2E4. \uD070 \uB098\uBB34(\uC870\uC9C1)\uB97C \uD0C0\uACE0 \uC624\uB974\uBA74 \uD63C\uC790\uBCF4\uB2E4 \uD6E8\uC52C \uB192\uC774 \uAC11\uB2C8\uB2E4.&quot;,love:&quot;\uB2E4\uC815\uD558\uACE0 \uC138\uC2EC\uD55C \uC5F0\uC560\uB97C \uD569\uB2C8\uB2E4. \uC791\uC740 \uAE30\uB150\uC77C\uB3C4 \uCC59\uAE30\uC9C0\uB9CC \uC0C1\uB300\uC758 \uB9C8\uC74C\uC744 \uD655\uC778\uBC1B\uACE0 \uC2F6\uC5B4 \uD558\uB294 \uB9C8\uC74C\uB3C4 \uD07D\uB2C8\uB2E4.&quot;,stress:&quot;\uAD00\uACC4\uAC00 \uD2C0\uC5B4\uC84C\uC744 \uB54C \uD06C\uAC8C \uD754\uB4E4\uB9BD\uB2C8\uB2E4. \uC2DD\uBB3C \uAC00\uAFB8\uAE30, \uAF43\uC2DC\uC7A5 \uC0B0\uCC45, \uC218\uB2E4\uCC98\uB7FC \uAC00\uBCCD\uAC8C \uAE30\uBD84\uC744 \uD658\uAE30\uD558\uB294 \uD65C\uB3D9\uC774 \uC798 \uB9DE\uC2B5\uB2C8\uB2E4.&quot;,tip:&quot;\uBAA8\uB450\uC5D0\uAC8C \uB9DE\uCD94\uC9C0 \uC54A\uC544\uB3C4 \uB429\uB2C8\uB2E4. \uB0B4 \uC758\uACAC\uC744 \uD55C \uBB38\uC7A5\uC73C\uB85C \uBA3C\uC800 \uB9D0\uD558\uB294 \uC5F0\uC2B5\uC774 \uC6B4\uC744 \uD0A4\uC6C1\uB2C8\uB2E4.&quot;},{kw:[&quot;\uC5F4\uC815&quot;,&quot;\uB099\uCC9C&quot;,&quot;\uD45C\uD604\uB825&quot;,&quot;\uACF5\uC815\uD568&quot;,&quot;\uC874\uC7AC\uAC10&quot;],core:&quot;\uD55C\uB0AE\uC758 \uD0DC\uC591\uCC98\uB7FC \uBC1D\uACE0 \uB728\uAC81\uC2B5\uB2C8\uB2E4. \uC228\uAE40\uC774 \uC5C6\uACE0 \uC194\uC9C1\uD558\uBA70, \uADF8 \uC790\uB9AC\uC5D0 \uC788\uB294 \uAC83\uB9CC\uC73C\uB85C \uBD84\uC704\uAE30\uB97C \uD658\uD558\uAC8C \uB9CC\uB4DC\uB294 \uC874\uC7AC\uAC10\uC774 \uC788\uC2B5\uB2C8\uB2E4. \uBAA8\uB450\uC5D0\uAC8C \uACE0\uB974\uAC8C \uBE5B\uC744 \uB098\uB204\uB824\uB294 \uACF5\uC815\uD568\uB3C4 \uAC16\uCDC4\uC2B5\uB2C8\uB2E4.&quot;,good:[&quot;\uC0AC\uB78C\uB4E4\uC5D0\uAC8C \uC5D0\uB108\uC9C0\uB97C \uC8FC\uB294 \uBC1D\uC740 \uAE30\uC6B4&quot;,&quot;\uC0DD\uAC01\uC744 \uC2DC\uC6D0\uD558\uAC8C \uB9D0\uB85C \uD480\uC5B4\uB0B4\uB294 \uD45C\uD604\uB825&quot;,&quot;\uB4A4\uB05D \uC5C6\uC774 \uD138\uC5B4 \uBC84\uB9AC\uB294 \uB300\uBC94\uD568&quot;],bad:[&quot;\uC2DC\uC791\uC740 \uD654\uB824\uD558\uC9C0\uB9CC \uB9C8\uBB34\uB9AC\uAC00 \uC57D\uD574\uC9C0\uAE30 \uC26C\uC6C0&quot;,&quot;\uAC10\uC815\uC774 \uC5BC\uAD74\uC5D0 \uADF8\uB300\uB85C \uB4DC\uB7EC\uB0A8&quot;,&quot;\uAE09\uD55C \uC131\uACA9\uC5D0 \uC2E4\uC218\uAC00 \uC0DD\uAE40&quot;],people:&quot;\uCC98\uC74C \uB9CC\uB09C \uC0AC\uB78C\uACFC\uB3C4 \uC27D\uAC8C \uCE5C\uD574\uC9C0\uB294 \uC778\uAE30\uC778\uC785\uB2C8\uB2E4. \uB2E4\uB9CC \uBAA8\uB450\uC5D0\uAC8C \uCE5C\uC808\uD558\uB2E4 \uBCF4\uB2C8 \uAE4A\uC740 \uAD00\uACC4\uB97C \uC6D0\uD558\uB294 \uC0AC\uB78C\uC740 \uC11C\uC6B4\uD574\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.&quot;,work:&quot;\uBC1C\uD45C, \uD64D\uBCF4, \uC601\uC5C5, \uAD50\uC721, \uBB34\uB300\uCC98\uB7FC \uC55E\uC5D0 \uC11C\uC11C \uBCF4\uC5EC \uC8FC\uB294 \uC77C\uC5D0\uC11C \uC2E4\uB825\uC774 \uBC30\uB85C \uB098\uC635\uB2C8\uB2E4. \uAF3C\uAF3C\uD55C \uD30C\uD2B8\uB108\uC640 \uC9DD\uC744 \uC774\uB8E8\uBA74 \uC644\uC131\uB3C4\uAC00 \uC62C\uB77C\uAC11\uB2C8\uB2E4.&quot;,love:&quot;\uC88B\uC544\uD558\uBA74 \uC228\uAE30\uC9C0 \uBABB\uD558\uACE0 \uC801\uADF9\uC801\uC73C\uB85C \uB2E4\uAC00\uAC11\uB2C8\uB2E4. \uD654\uB048\uD558\uACE0 \uB0AD\uB9CC\uC801\uC774\uC9C0\uB9CC \uC5F4\uC815\uC774 \uC2DD\uC73C\uBA74 \uD45C\uAC00 \uB0A9\uB2C8\uB2E4.&quot;,stress:&quot;\uC778\uC815\uBC1B\uC9C0 \uBABB\uD558\uAC70\uB098 \uAC07\uD600 \uC788\uC744 \uB54C \uAE30\uC6B4\uC774 \uAEBE\uC785\uB2C8\uB2E4. \uD587\uBCD5 \uC544\uB798 \uC6B4\uB3D9, \uC5EC\uD589, \uC0AC\uB78C \uB9CE\uC740 \uACF3\uC5D0\uC11C \uC5D0\uB108\uC9C0\uB97C \uB2E4\uC2DC \uCC44\uC6C1\uB2C8\uB2E4.&quot;,tip:&quot;\uD574\uAC00 \uC9C0\uB294 \uAC83\uB3C4 \uD558\uB8E8\uC758 \uC77C\uBD80\uC785\uB2C8\uB2E4. \uD558\uB098\uB97C \uB05D\uAE4C\uC9C0 \uB9C8\uBB34\uB9AC\uD558\uB294 \uC2B5\uAD00\uC774 \uBE5B\uC744 \uC624\uB798 \uAC00\uAC8C \uD569\uB2C8\uB2E4.&quot;},{kw:[&quot;\uC9D1\uC911\uB825&quot;,&quot;\uBC30\uB824&quot;,&quot;\uD1B5\uCC30&quot;,&quot;\uC628\uAE30&quot;,&quot;\uD5CC\uC2E0&quot;],core:&quot;\uC5B4\uB460 \uC18D\uC758 \uCD1B\uBD88\uCC98\uB7FC \uC870\uC6A9\uD558\uC9C0\uB9CC \uAEBC\uC9C0\uC9C0 \uC54A\uB294 \uBE5B\uC785\uB2C8\uB2E4. \uB113\uAC8C \uD37C\uC9C0\uAE30\uBCF4\uB2E4 \uD55C \uACF3\uC744 \uAE4A\uC774 \uBC1D\uD788\uBA70, \uC8FC\uBCC0 \uC0AC\uB78C\uC744 \uC138\uC2EC\uD558\uAC8C \uC0B4\uD53C\uACE0 \uB530\uB73B\uD558\uAC8C \uB370\uC6CC \uC90D\uB2C8\uB2E4.&quot;,good:[&quot;\uD55C \uBD84\uC57C\uB97C \uAE4A\uC774 \uD30C\uACE0\uB4DC\uB294 \uC9D1\uC911\uB825&quot;,&quot;\uC0C1\uB300\uC758 \uB9C8\uC74C\uC744 \uBA3C\uC800 \uC54C\uC544\uCC44\uB294 \uC12C\uC138\uD55C \uBC30\uB824&quot;,&quot;\uAC89\uC73C\uB85C \uB4DC\uB7EC\uB098\uC9C0 \uC54A\uB294 \uB2E8\uB2E8\uD55C \uB0B4\uBA74\uC758 \uBD88\uC528&quot;],bad:[&quot;\uC11C\uC6B4\uD55C \uAC10\uC815\uC744 \uC18D\uC73C\uB85C \uC313\uC544 \uB460&quot;,&quot;\uC608\uBBFC\uD574\uC11C \uC791\uC740 \uC77C\uC5D0\uB3C4 \uB9C8\uC74C\uC774 \uD754\uB4E4\uB9BC&quot;,&quot;\uD55C\uBC88 \uC0C1\uCC98\uBC1B\uC73C\uBA74 \uB9C8\uC74C\uC744 \uB2E4\uC2DC \uC5F4\uAE30 \uC5B4\uB824\uC6C0&quot;],people:&quot;\uB113\uC740 \uC778\uB9E5\uBCF4\uB2E4 \uC18C\uC218\uC758 \uAE4A\uC740 \uAD00\uACC4\uB97C \uC120\uD638\uD569\uB2C8\uB2E4. \uD55C\uBC88 \uB9C8\uC74C\uC744 \uC900 \uC0AC\uB78C\uC5D0\uAC8C\uB294 \uD5CC\uC2E0\uC801\uC774\uACE0 \uC624\uB798 \uAC11\uB2C8\uB2E4.&quot;,work:&quot;\uC5F0\uAD6C, \uAE30\uD68D, \uC0C1\uB2F4, \uC758\uB8CC, \uC608\uC220\uCC98\uB7FC \uC815\uC131\uACFC \uC804\uBB38\uC131\uC774 \uD544\uC694\uD55C \uC77C\uC5D0 \uB9DE\uC2B5\uB2C8\uB2E4. \uBC24\uC774\uB098 \uD63C\uC790 \uC788\uB294 \uC2DC\uAC04\uC5D0 \uC9D1\uC911\uB825\uC774 \uC624\uB985\uB2C8\uB2E4.&quot;,love:&quot;\uC740\uC740\uD558\uACE0 \uAE4A\uC740 \uC0AC\uB791\uC744 \uD569\uB2C8\uB2E4. \uB9D0\uBCF4\uB2E4 \uD589\uB3D9\uC73C\uB85C \uB9C8\uC74C\uC744 \uBCF4\uC5EC \uC8FC\uBA70, \uC0C1\uB300\uC758 \uC791\uC740 \uBCC0\uD654\uB3C4 \uAE08\uBC29 \uB208\uCE58\uCC55\uB2C8\uB2E4.&quot;,stress:&quot;\uAC10\uC815\uC744 \uD138\uC5B4\uB193\uC744 \uACF3\uC774 \uC5C6\uC744 \uB54C \uC9C0\uCE69\uB2C8\uB2E4. \uC77C\uAE30 \uC4F0\uAE30, \uD5A5\uCD08, \uC870\uC6A9\uD55C \uC74C\uC545, \uBBFF\uC744 \uB9CC\uD55C \uD55C \uC0AC\uB78C\uACFC\uC758 \uB300\uD654\uAC00 \uD68C\uBCF5\uC5D0 \uC88B\uC2B5\uB2C8\uB2E4.&quot;,tip:&quot;\uCD1B\uBD88\uC740 \uBC14\uB78C\uC744 \uD53C\uD574\uC57C \uC624\uB798 \uD0D1\uB2C8\uB2E4. \uB098\uB97C \uC18C\uBAA8\uC2DC\uD0A4\uB294 \uAD00\uACC4\uC640 \uAC70\uB9AC\uB97C \uB450\uB294 \uAC83\uB3C4 \uC9C0\uD61C\uC785\uB2C8\uB2E4.&quot;},{kw:[&quot;\uC2E0\uC6A9&quot;,&quot;\uD3EC\uC6A9\uB825&quot;,&quot;\uB4EC\uC9C1\uD568&quot;,&quot;\uC911\uC7AC&quot;,&quot;\uC778\uB0B4&quot;],core:&quot;\uB113\uACE0 \uB192\uC740 \uC0B0\uCC98\uB7FC \uC27D\uAC8C \uD754\uB4E4\uB9AC\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uB9D0\uBCF4\uB2E4 \uD589\uB3D9\uC744 \uBBFF\uACE0 \uC57D\uC18D\uC744 \uBB34\uAC81\uAC8C \uC5EC\uAE30\uBA70, \uC5EC\uB7EC \uC0AC\uB78C\uC744 \uD488\uC5B4 \uC8FC\uB294 \uD3EC\uC6A9\uB825 \uB355\uBD84\uC5D0 \uC5B4\uB514\uC11C\uB098 \uC911\uC2EC\uC744 \uC7A1\uB294 \uC5ED\uD560\uC744 \uB9E1\uC2B5\uB2C8\uB2E4.&quot;,good:[&quot;\uD55C\uBC88 \uD55C \uC57D\uC18D\uC740 \uBC18\uB4DC\uC2DC \uC9C0\uD0A4\uB294 \uC2E0\uC6A9&quot;,&quot;\uC704\uAE30\uC5D0\uB3C4 \uCE68\uCC29\uD55C \uC548\uC815\uAC10&quot;,&quot;\uC11C\uB85C \uB2E4\uB978 \uC0AC\uB78C\uB4E4\uC744 \uD488\uC5B4 \uC8FC\uB294 \uB113\uC740 \uC544\uB7C9&quot;],bad:[&quot;\uBCC0\uD654\uC5D0 \uB290\uB9AC\uACE0 \uC0C8\uB85C\uC6B4 \uAC83\uC744 \uACBD\uACC4\uD568&quot;,&quot;\uC18D\uC744 \uC798 \uB4DC\uB7EC\uB0B4\uC9C0 \uC54A\uC544 \uB2F5\uB2F5\uD574 \uBCF4\uC784&quot;,&quot;\uD55C\uBC88 \uC815\uD558\uBA74 \uBC14\uAFB8\uC9C0 \uC54A\uB294 \uACE0\uC9D1&quot;],people:&quot;\uBBFF\uC74C\uC9C1\uD55C \uD615\uB2D8\xB7\uC5B8\uB2C8 \uAC19\uC740 \uC874\uC7AC\uC785\uB2C8\uB2E4. \uC0AC\uB78C\uB4E4\uC774 \uACE0\uBBFC\uC744 \uD138\uC5B4\uB193\uC73C\uB7EC \uCC3E\uC544\uC624\uACE0, \uAC08\uB4F1 \uC0C1\uD669\uC5D0\uC11C \uC911\uC7AC\uC790 \uC5ED\uD560\uC744 \uC798\uD569\uB2C8\uB2E4.&quot;,work:&quot;\uBD80\uB3D9\uC0B0, \uAC74\uC124, \uAD00\uB9AC, \uD589\uC815\uCC98\uB7FC \uAE30\uBC18\uC744 \uB2E4\uC9C0\uACE0 \uC624\uB798 \uC9C0\uD0A4\uB294 \uC77C\uC5D0 \uAC15\uD569\uB2C8\uB2E4. \uBE60\uB978 \uC2B9\uBD80\uBCF4\uB2E4 \uAE34 \uD638\uD761\uC758 \uC77C\uC5D0\uC11C \uC131\uACFC\uAC00 \uD07D\uB2C8\uB2E4.&quot;,love:&quot;\uCC9C\uCC9C\uD788 \uB2E4\uAC00\uAC00\uC9C0\uB9CC \uD55C\uBC88 \uC2DC\uC791\uD558\uBA74 \uBB35\uBB35\uD788 \uC624\uB798 \uAC11\uB2C8\uB2E4. \uD654\uB824\uD55C \uC774\uBCA4\uD2B8\uBCF4\uB2E4 \uBCC0\uD568\uC5C6\uB294 \uD0DC\uB3C4\uB85C \uC0AC\uB791\uC744 \uBCF4\uC5EC \uC90D\uB2C8\uB2E4.&quot;,stress:&quot;\uB0A8\uC758 \uC9D0\uAE4C\uC9C0 \uB5A0\uC548\uB2E4\uAC00 \uC18D\uBCD1\uC774 \uB0A9\uB2C8\uB2E4. \uB4F1\uC0B0, \uCEA0\uD551, \uD759\uC744 \uBC1F\uB294 \uC2DC\uAC04\uCC98\uB7FC \uC790\uC5F0 \uC18D\uC5D0\uC11C \uBA38\uB9AC\uB97C \uBE44\uC6B0\uB294 \uAC83\uC774 \uC88B\uC2B5\uB2C8\uB2E4.&quot;,tip:&quot;\uC0B0\uB3C4 \uACC4\uC808\uB9C8\uB2E4 \uC637\uC744 \uAC08\uC544\uC785\uC2B5\uB2C8\uB2E4. \uC791\uC740 \uBCC0\uD654\uB97C \uC2DC\uB3C4\uD574 \uBCF4\uB294 \uAC83\uC774 \uB354 \uD070 \uC0B0\uC744 \uB9CC\uB4ED\uB2C8\uB2E4.&quot;},{kw:[&quot;\uC2E4\uC18D&quot;,&quot;\uAF3C\uAF3C\uD568&quot;,&quot;\uC591\uC721&quot;,&quot;\uD604\uC2E4\uAC10&quot;,&quot;\uB2E4\uC815\uD568&quot;],core:&quot;\uC528\uC557\uC744 \uD488\uC5B4 \uAE38\uB7EC \uB0B4\uB294 \uAE30\uB984\uC9C4 \uBC2D\uD759\uC785\uB2C8\uB2E4. \uAC89\uC73C\uB85C \uD654\uB824\uD558\uC9C0 \uC54A\uC544\uB3C4 \uC2E4\uC18D\uC744 \uCC59\uAE30\uACE0, \uC0AC\uB78C\uACFC \uC77C\uC744 \uCC28\uADFC\uCC28\uADFC \uD0A4\uC6CC \uB0B4\uB294 \uC7AC\uC8FC\uAC00 \uC788\uC2B5\uB2C8\uB2E4.&quot;,good:[&quot;\uC791\uC740 \uAC83\uB3C4 \uB193\uCE58\uC9C0 \uC54A\uB294 \uAF3C\uAF3C\uD568&quot;,&quot;\uC0AC\uB78C\uC744 \uD0A4\uC6B0\uACE0 \uB3CC\uBCF4\uB294 \uB530\uB73B\uD55C \uB9C8\uC74C&quot;,&quot;\uD604\uC2E4\uC801\uC778 \uACC4\uC0B0\uACFC \uC54C\uB730\uD55C \uC0B4\uB9BC \uAC10\uAC01&quot;],bad:[&quot;\uAC71\uC815\uC774 \uB9CE\uC544 \uBBF8\uB9AC \uC9C0\uCE68&quot;,&quot;\uC758\uC2EC\uC774 \uB9CE\uC544 \uACB0\uC815\uC774 \uB2A6\uC5B4\uC9D0&quot;,&quot;\uB0A8\uC744 \uCC59\uAE30\uB290\uB77C \uC815\uC791 \uC790\uAE30 \uBAAB\uC744 \uB193\uCE68&quot;],people:&quot;\uC0C1\uB300\uC5D0\uAC8C \uD544\uC694\uD55C \uAC83\uC744 \uBA3C\uC800 \uCC59\uACA8 \uC8FC\uB294 \uC5C4\uB9C8 \uAC19\uC740 \uC0AC\uB78C\uC785\uB2C8\uB2E4. \uC624\uB798 \uC0AC\uADC8\uC218\uB85D \uC9C4\uAC00\uAC00 \uB4DC\uB7EC\uB098\uB294 \uD0C0\uC785\uC785\uB2C8\uB2E4.&quot;,work:&quot;\uAD50\uC721, \uC0C1\uB2F4, \uC7AC\uBB34, \uC2DD\uD488, \uC778\uC0AC\uCC98\uB7FC \uC0AC\uB78C\uACFC \uC790\uC6D0\uC744 \uAD00\uB9AC\uD558\uACE0 \uD0A4\uC6B0\uB294 \uC77C\uC5D0\uC11C \uC131\uACFC\uAC00 \uB0A9\uB2C8\uB2E4. \uC2E4\uBB34 \uB2A5\uB825\uC774 \uB6F0\uC5B4\uB098 \uC870\uC9C1\uC5D0\uC11C \uAF2D \uD544\uC694\uD55C \uC0AC\uB78C\uC774 \uB429\uB2C8\uB2E4.&quot;,love:&quot;\uD604\uC2E4\uC801\uC774\uACE0 \uD5CC\uC2E0\uC801\uC778 \uC0AC\uB791\uC744 \uD569\uB2C8\uB2E4. \uD568\uAED8 \uBBF8\uB798\uB97C \uC124\uACC4\uD558\uB294 \uAC83\uC744 \uC88B\uC544\uD558\uACE0, \uC0C1\uB300\uB97C \uCC59\uAE30\uB294 \uB370\uC11C \uD589\uBCF5\uC744 \uB290\uB08D\uB2C8\uB2E4.&quot;,stress:&quot;\uC77C\uC774 \uACC4\uD68D\uB300\uB85C \uC548 \uB420 \uB54C \uAC71\uC815\uC774 \uAF2C\uB9AC\uB97C \uBB45\uB2C8\uB2E4. \uC694\uB9AC, \uC815\uB9AC \uC815\uB3C8, \uD143\uBC2D \uAC00\uAFB8\uAE30\uCC98\uB7FC \uC190\uC73C\uB85C \uACB0\uACFC\uAC00 \uBCF4\uC774\uB294 \uD65C\uB3D9\uC774 \uB9C8\uC74C\uC744 \uC548\uC815\uC2DC\uD0B5\uB2C8\uB2E4.&quot;,tip:&quot;\uBC2D\uC5D0\uB3C4 \uC26C\uB294 \uD574\uAC00 \uD544\uC694\uD569\uB2C8\uB2E4. \uAC71\uC815\uC744 \uC885\uC774\uC5D0 \uC801\uC5B4 \uB450\uACE0, \uD560 \uC218 \uC788\uB294 \uAC83 \uD558\uB098\uB9CC \uACE0\uB974\uC138\uC694.&quot;},{kw:[&quot;\uACB0\uB2E8\uB825&quot;,&quot;\uC758\uB9AC&quot;,&quot;\uAC15\uC9C1\uD568&quot;,&quot;\uC2B9\uBD80\uC695&quot;,&quot;\uC2E4\uD589\uB825&quot;],core:&quot;\uC544\uC9C1 \uB2E4\uB4EC\uC5B4\uC9C0\uC9C0 \uC54A\uC740 \uB2E8\uB2E8\uD55C \uC1F3\uB369\uC774\uC785\uB2C8\uB2E4. \uACB0\uB2E8\uC774 \uBE60\uB974\uACE0 \uC633\uB2E4\uACE0 \uBBFF\uC73C\uBA74 \uACE7\uC7A5 \uC2E4\uD589\uD569\uB2C8\uB2E4. \uBD88\uC5D0 \uB2EC\uAD88\uC9C0\uACE0 \uB450\uB4DC\uB824\uC9C8\uC218\uB85D \uBA85\uAC80\uC774 \uB418\uB294 \uAE30\uC6B4\uC774\uB77C, \uC2DC\uB828\uC744 \uACAA\uC73C\uBA70 \uB354 \uD06C\uAC8C \uC131\uC7A5\uD569\uB2C8\uB2E4.&quot;,good:[&quot;\uB9DD\uC124\uC784 \uC5C6\uB294 \uACB0\uB2E8\uB825\uACFC \uC2E4\uD589\uB825&quot;,&quot;\uD55C\uBC88 \uB9FA\uC740 \uC778\uC5F0\uC744 \uB05D\uAE4C\uC9C0 \uC9C0\uD0A4\uB294 \uC758\uB9AC&quot;,&quot;\uC704\uAE30 \uC0C1\uD669\uC5D0\uC11C \uC624\uD788\uB824 \uAC15\uD574\uC9C0\uB294 \uC2B9\uBD80 \uADFC\uC131&quot;],bad:[&quot;\uC9C1\uC124\uC801\uC778 \uB9D0\uC774 \uC758\uB3C4\uBCF4\uB2E4 \uB0A0\uCE74\uB86D\uAC8C \uAF42\uD798&quot;,&quot;\uD751\uBC31\uC774 \uBD84\uBA85\uD574 \uC735\uD1B5\uC131\uC774 \uBD80\uC871\uD574 \uBCF4\uC784&quot;,&quot;\uCC38\uB2E4\uAC00 \uD55C \uBC88\uC5D0 \uD3ED\uBC1C\uD558\uB294 \uC131\uACA9&quot;],people:&quot;\uAC89\uC740 \uCC28\uAC00\uC6CC \uBCF4\uC5EC\uB3C4 \uC758\uB9AC \uD558\uB098\uB294 \uD655\uC2E4\uD569\uB2C8\uB2E4. \uB0B4 \uD3B8\uC5D0\uAC8C\uB294 \uB4E0\uB4E0\uD55C \uBC29\uD328\uAC00 \uB418\uC9C0\uB9CC, \uC544\uB2C8\uB2E4 \uC2F6\uC740 \uC0AC\uB78C\uACFC\uB294 \uC120\uC744 \uBD84\uBA85\uD788 \uAE0B\uC2B5\uB2C8\uB2E4.&quot;,work:&quot;\uAD70\xB7\uACBD\uCC30, \uAE30\uACC4, \uAE08\uC735, \uBC95\uC870, \uC678\uACFC\uCC98\uB7FC \uD310\uB2E8\uC774 \uBE60\uB974\uACE0 \uC6D0\uCE59\uC774 \uBD84\uBA85\uD55C \uC77C\uC5D0 \uAC15\uD569\uB2C8\uB2E4. \uACBD\uC7C1\uACFC \uBAA9\uD45C\uAC00 \uB69C\uB837\uD560\uC218\uB85D \uC2E4\uB825\uC744 \uBC1C\uD718\uD569\uB2C8\uB2E4.&quot;,love:&quot;\uC88B\uACE0 \uC2EB\uC74C\uC774 \uBD84\uBA85\uD569\uB2C8\uB2E4. \uB9C8\uC74C\uC744 \uC815\uD558\uBA74 \uC9C1\uC9C4\uD558\uACE0, \uC0C1\uB300\uB97C \uC9C0\uD0A4\uB824\uB294 \uBCF4\uD638 \uBCF8\uB2A5\uC774 \uAC15\uD569\uB2C8\uB2E4. \uB9D0\uD22C\uB9CC \uC870\uAE08 \uB2E4\uB4EC\uC73C\uBA74 \uB9E4\uB825\uC774 \uBC30\uAC00 \uB429\uB2C8\uB2E4.&quot;,stress:&quot;\uBD88\uACF5\uC815\uD55C \uC0C1\uD669\uC774\uB098 \uC6B0\uC720\uBD80\uB2E8\uD55C \uC0AC\uB78C \uB54C\uBB38\uC5D0 \uD654\uAC00 \uC313\uC785\uB2C8\uB2E4. \uACA9\uD55C \uC6B4\uB3D9, \uC6E8\uC774\uD2B8, \uBB34\uC220\uCC98\uB7FC \uB540\uC744 \uD758\uB9AC\uBA70 \uD798\uC744 \uC3DF\uB294 \uD65C\uB3D9\uC774 \uC88B\uC2B5\uB2C8\uB2E4.&quot;,tip:&quot;\uC1E0\uB294 \uBD88(\uAD00\uC131)\uC744 \uB9CC\uB098\uC57C \uADF8\uB987\uC774 \uB429\uB2C8\uB2E4. \uB098\uB97C \uB2E8\uB828\uC2DC\uD0A4\uB294 \uADDC\uCE59\uACFC \uC0AC\uB78C\uC744 \uD53C\uD558\uC9C0 \uB9C8\uC138\uC694.&quot;},{kw:[&quot;\uC12C\uC138\uD568&quot;,&quot;\uBBF8\uC801 \uAC10\uAC01&quot;,&quot;\uC790\uAE30\uAD00\uB9AC&quot;,&quot;\uC644\uBCBD\uC8FC\uC758&quot;,&quot;\uD488\uACA9&quot;],core:&quot;\uC798 \uC138\uACF5\uB41C \uBCF4\uC11D\uCC98\uB7FC \uBC18\uC9DD\uC774\uACE0 \uAE54\uB054\uD569\uB2C8\uB2E4. \uAE30\uC900\uC774 \uB192\uACE0 \uC544\uB984\uB2E4\uC6B4 \uAC83\uC744 \uC54C\uC544\uBCF4\uB294 \uB208\uC774 \uC788\uC73C\uBA70, \uC790\uAE30 \uAD00\uB9AC\uC5D0 \uCCA0\uC800\uD574 \uC5B4\uB514\uC11C\uB098 \uB2E8\uC815\uD558\uACE0 \uC138\uB828\uB41C \uC778\uC0C1\uC744 \uC90D\uB2C8\uB2E4.&quot;,good:[&quot;\uB0A8\uB2E4\uB978 \uBBF8\uC801 \uAC10\uAC01\uACFC \uB514\uD14C\uC77C&quot;,&quot;\uC2A4\uC2A4\uB85C\uB97C \uAC08\uACE0\uB2E6\uB294 \uC131\uC2E4\uD55C \uC790\uAE30\uAD00\uB9AC&quot;,&quot;\uD488\uC704\uB97C \uC9C0\uD0A4\uB294 \uB9D0\uACFC \uD0DC\uB3C4&quot;],bad:[&quot;\uC791\uC740 \uB9D0\uC5D0\uB3C4 \uC0C1\uCC98\uBC1B\uB294 \uC608\uBBFC\uD568&quot;,&quot;\uC644\uBCBD\uD558\uC9C0 \uC54A\uC73C\uBA74 \uC2DC\uC791\uC744 \uBBF8\uB8F8&quot;,&quot;\uC790\uC874\uC2EC \uB54C\uBB38\uC5D0 \uB3C4\uC6C0\uC744 \uCCAD\uD558\uC9C0 \uBABB\uD568&quot;],people:&quot;\uC544\uBB34\uC5D0\uAC8C\uB098 \uACC1\uC744 \uB0B4\uC8FC\uC9C0 \uC54A\uC9C0\uB9CC, \uAC00\uAE4C\uC6CC\uC9C0\uBA74 \uC758\uB9AC \uC788\uACE0 \uC12C\uC138\uD558\uAC8C \uCC59\uAE41\uB2C8\uB2E4. \uBB34\uB840\uD55C \uC0AC\uB78C\uC5D0\uAC8C\uB294 \uB0C9\uC815\uD558\uAC8C \uC120\uC744 \uAE0B\uC2B5\uB2C8\uB2E4.&quot;,work:&quot;\uB514\uC790\uC778, \uD328\uC158, \uBDF0\uD2F0, \uAE08\uC735, \uC815\uBC00\uAE30\uC220, \uC758\uB8CC\uCC98\uB7FC \uC815\uD655\uC131\uACFC \uAC10\uAC01\uC774 \uD568\uAED8 \uD544\uC694\uD55C \uC77C\uC5D0 \uD0C1\uC6D4\uD569\uB2C8\uB2E4.&quot;,love:&quot;\uC774\uC0C1\uD615\uC774 \uBD84\uBA85\uD558\uACE0 \uC5F0\uC560\uC5D0\uC11C\uB3C4 \uD488\uACA9\uC744 \uC911\uC2DC\uD569\uB2C8\uB2E4. \uC0C1\uB300\uAC00 \uB098\uB97C \uADC0\uD558\uAC8C \uB300\uD574 \uC904 \uB54C \uB9C8\uC74C\uC744 \uC5FD\uB2C8\uB2E4.&quot;,stress:&quot;\uD3C9\uAC00\uBC1B\uAC70\uB098 \uBE44\uAD50\uB2F9\uD560 \uB54C \uD06C\uAC8C \uC18C\uBAA8\uB429\uB2C8\uB2E4. \uBC18\uC2E0\uC695, \uD53C\uBD80 \uAD00\uB9AC, \uC804\uC2DC \uAD00\uB78C\uCC98\uB7FC \uB098\uB97C \uC544\uB07C\uACE0 \uAFB8\uBBF8\uB294 \uC2DC\uAC04\uC774 \uD68C\uBCF5\uC5D0 \uC88B\uC2B5\uB2C8\uB2E4.&quot;,tip:&quot;\uBCF4\uC11D\uC740 \uBB3C(\uC2DD\uC0C1)\uC5D0 \uC53B\uAE38 \uB54C \uAC00\uC7A5 \uBE5B\uB0A9\uB2C8\uB2E4. \uC644\uBCBD\uD558\uC9C0 \uC54A\uC544\uB3C4 \uBA3C\uC800 \uBCF4\uC5EC \uC8FC\uACE0 \uD45C\uD604\uD558\uC138\uC694.&quot;},{kw:[&quot;\uC9C0\uD61C&quot;,&quot;\uD3EC\uBD80&quot;,&quot;\uC720\uC5F0\uD568&quot;,&quot;\uC790\uC720&quot;,&quot;\uD1B5\uCC30&quot;],core:&quot;\uB05D\uC5C6\uC774 \uD750\uB974\uB294 \uD070 \uAC15\uACFC \uBC14\uB2E4\uC785\uB2C8\uB2E4. \uC0DD\uAC01\uC758 \uD3ED\uC774 \uB113\uACE0 \uD070 \uADF8\uB9BC\uC744 \uADF8\uB9AC\uBA70, \uB9C9\uD788\uBA74 \uB3CC\uC544\uAC00\uB294 \uC720\uC5F0\uD568\uC73C\uB85C \uACB0\uAD6D \uC6D0\uD558\uB294 \uACF3\uC5D0 \uB2FF\uC2B5\uB2C8\uB2E4. \uC5EC\uB7EC \uBB3C\uC904\uAE30\uB97C \uBAA8\uC73C\uB4EF \uB2E4\uC591\uD55C \uC9C0\uC2DD\uACFC \uC0AC\uB78C\uC744 \uD488\uC2B5\uB2C8\uB2E4.&quot;,good:[&quot;\uC0C1\uD669 \uC804\uCCB4\uB97C \uAFF0\uB6AB\uB294 \uB113\uC740 \uC2DC\uC57C&quot;,&quot;\uB9C9\uD600\uB3C4 \uB2E4\uB978 \uAE38\uC744 \uCC3E\uB294 \uC720\uC5F0\uD55C \uBA38\uB9AC&quot;,&quot;\uC2A4\uCF00\uC77C \uD070 \uD3EC\uBD80\uC640 \uAE30\uD68D\uB825&quot;],bad:[&quot;\uD765\uBBF8\uAC00 \uC790\uC8FC \uBC14\uB00C\uC5B4 \uD55C\uACF3\uC5D0 \uBA38\uBB3C\uAE30 \uC5B4\uB824\uC6C0&quot;,&quot;\uC18D\uC744 \uC54C \uC218 \uC5C6\uB2E4\uB294 \uB9D0\uC744 \uB4E4\uC74C&quot;,&quot;\uC790\uC720\uB97C \uC6D0\uD574 \uAD6C\uC18D\uC744 \uACAC\uB514\uC9C0 \uBABB\uD568&quot;],people:&quot;\uBAA8\uC784\uC758 \uBD84\uC704\uAE30\uB97C \uC774\uB044\uB294 \uC0AC\uAD50\uAC00\uC774\uBA74\uC11C\uB3C4 \uC18D\uB9C8\uC74C\uC740 \uAE4A\uC774 \uAC10\uCDA5\uB2C8\uB2E4. \uB2E4\uC591\uD55C \uBD84\uC57C\uC758 \uC0AC\uB78C\uB4E4\uACFC \uD3ED\uB113\uAC8C \uAD50\uB958\uD569\uB2C8\uB2E4.&quot;,work:&quot;\uBB34\uC5ED, \uBB3C\uB958, \uAE30\uD68D, \uC5F0\uAD6C, \uC5EC\uD589, \uD50C\uB7AB\uD3FC\uCC98\uB7FC \uB113\uAC8C \uC5F0\uACB0\uD558\uACE0 \uD750\uB984\uC744 \uB9CC\uB4DC\uB294 \uC77C\uC5D0 \uAC15\uD569\uB2C8\uB2E4. \uBC18\uBCF5\uC801\uC778 \uD2C0\uC5D0 \uAC07\uD788\uBA74 \uB2A5\uB825\uC774 \uC904\uC5B4\uB4ED\uB2C8\uB2E4.&quot;,love:&quot;\uC790\uC720\uB86D\uACE0 \uB0AD\uB9CC\uC801\uC778 \uC5F0\uC560\uB97C \uD569\uB2C8\uB2E4. \uC11C\uB85C\uC758 \uACF5\uAC04\uC744 \uC874\uC911\uD574 \uC8FC\uB294 \uC0C1\uB300\uC640 \uC624\uB798 \uAC11\uB2C8\uB2E4.&quot;,stress:&quot;\uB2F5\uB2F5\uD55C \uD658\uACBD\uACFC \uAC04\uC12D\uC5D0 \uC57D\uD569\uB2C8\uB2E4. \uBC14\uB2E4, \uAC15\uBCC0 \uC0B0\uCC45, \uC218\uC601, \uC989\uD765 \uC5EC\uD589\uC774 \uAC00\uC7A5 \uC88B\uC740 \uCDA9\uC804\uC785\uB2C8\uB2E4.&quot;,tip:&quot;\uBB3C\uC740 \uB451(\uAD00\uC131)\uC774 \uC788\uC5B4\uC57C \uD070 \uD798\uC744 \uB0C5\uB2C8\uB2E4. \uC2A4\uC2A4\uB85C \uC815\uD55C \uB9C8\uAC10\uACFC \uADDC\uCE59\uC774 \uB0A0\uAC1C\uAC00 \uB429\uB2C8\uB2E4.&quot;},{kw:[&quot;\uC9C1\uAD00&quot;,&quot;\uCD1D\uBA85\uD568&quot;,&quot;\uAC10\uC218\uC131&quot;,&quot;\uC778\uB0B4&quot;,&quot;\uC870\uC6A9\uD55C \uD798&quot;],core:&quot;\uB300\uC9C0\uB97C \uC801\uC2DC\uB294 \uBE44\uC640 \uC0C8\uBCBD \uC774\uC2AC\uC785\uB2C8\uB2E4. \uC870\uC6A9\uD788 \uC2A4\uBA70\uB4DC\uB294 \uCD1D\uBA85\uD568\uC774 \uC788\uC5B4 \uB4DC\uB7EC\uB0B4\uC9C0 \uC54A\uACE0\uB3C4 \uC0C1\uD669\uC744 \uC815\uD655\uD788 \uC77D\uC2B5\uB2C8\uB2E4. \uC9C1\uAD00\uACFC \uAC10\uC218\uC131\uC774 \uB6F0\uC5B4\uB098\uACE0, \uC791\uC740 \uBB3C\uBC29\uC6B8\uC774 \uBC14\uC704\uB97C \uB6AB\uB4EF \uB048\uAE30 \uC788\uAC8C \uBAA9\uD45C\uB97C \uC774\uB8F9\uB2C8\uB2E4.&quot;,good:[&quot;\uB0A8\uB4E4\uC774 \uBABB \uBCF4\uB294 \uAC83\uC744 \uC54C\uC544\uCC44\uB294 \uC9C1\uAD00&quot;,&quot;\uB9D0\uC5C6\uC774 \uC624\uB798 \uBC84\uD2F0\uB294 \uC778\uB0B4\uC2EC&quot;,&quot;\uC0C1\uB300 \uB9C8\uC74C\uC5D0 \uC2A4\uBA70\uB4DC\uB294 \uACF5\uAC10 \uB2A5\uB825&quot;],bad:[&quot;\uC0DD\uAC01\uC774 \uB9CE\uC544 \uD589\uB3D9\uC774 \uB2A6\uC5B4\uC9D0&quot;,&quot;\uAC71\uC815\uACFC \uBD88\uC548\uC774 \uC313\uC774\uAE30 \uC26C\uC6C0&quot;,&quot;\uC18D\uB9C8\uC74C\uC744 \uC228\uACA8 \uC624\uD574\uB97C \uC0BC&quot;],people:&quot;\uC870\uC6A9\uD558\uC9C0\uB9CC \uD568\uAED8 \uC788\uC73C\uBA74 \uD3B8\uC548\uD55C \uC0AC\uB78C\uC785\uB2C8\uB2E4. \uC0C1\uB300\uC758 \uC774\uC57C\uAE30\uB97C \uC798 \uB4E4\uC5B4 \uC8FC\uACE0, \uBE44\uBC00\uC744 \uC9C0\uCF1C \uC8FC\uB294 \uC0AC\uB78C\uC73C\uB85C \uC2E0\uB8B0\uB97C \uC5BB\uC2B5\uB2C8\uB2E4.&quot;,work:&quot;\uC5F0\uAD6C, \uBD84\uC11D, \uC2EC\uB9AC, \uAE00\uC4F0\uAE30, \uAE30\uD68D, IT\uCC98\uB7FC \uAE4A\uC740 \uC0AC\uACE0\uC640 \uAC10\uAC01\uC774 \uD544\uC694\uD55C \uC77C\uC5D0 \uB9DE\uC2B5\uB2C8\uB2E4. \uB4A4\uC5D0\uC11C \uD310\uC744 \uC9DC\uB294 \uCC38\uBAA8 \uC5ED\uD560\uC5D0 \uD0C1\uC6D4\uD569\uB2C8\uB2E4.&quot;,love:&quot;\uCC9C\uCC9C\uD788 \uC2A4\uBA70\uB4DC\uB294 \uC0AC\uB791\uC744 \uD569\uB2C8\uB2E4. \uAC89\uC73C\uB85C \uD45C\uD604\uC740 \uC801\uC9C0\uB9CC \uC0C1\uB300\uB97C \uAE4A\uC774 \uC774\uD574\uD558\uACE0, \uAC10\uC815\uC758 \uAD50\uAC10\uC744 \uC911\uC694\uD558\uAC8C \uC5EC\uAE41\uB2C8\uB2E4.&quot;,stress:&quot;\uBD88\uD655\uC2E4\uD55C \uC0C1\uD669\uC774 \uAE38\uC5B4\uC9C8 \uB54C \uBD88\uC548\uC774 \uCEE4\uC9D1\uB2C8\uB2E4. \uCDA9\uBD84\uD55C \uC7A0, \uBE44 \uC624\uB294 \uB0A0\uC758 \uB3C5\uC11C, \uB530\uB73B\uD55C \uCC28 \uD55C \uC794\uC774 \uB9C8\uC74C\uC744 \uAC00\uB77C\uC549\uD799\uB2C8\uB2E4.&quot;,tip:&quot;\uBE44\uB294 \uD587\uBE5B(\uC7AC\uC131\xB7\uD654)\uC744 \uB9CC\uB098\uC57C \uBB34\uC9C0\uAC1C\uAC00 \uB429\uB2C8\uB2E4. \uC0DD\uAC01\uC744 \uC791\uC740 \uD589\uB3D9 \uD558\uB098\uB85C \uBC14\uAFD4 \uBCF4\uC138\uC694.&quot;}],SEASON_NAME=[&quot;\uBD04&quot;,&quot;\uC5EC\uB984&quot;,&quot;\uAC00\uC744&quot;,&quot;\uACA8\uC6B8&quot;],seasonOf=e=&gt;({2:0,3:0,4:0,5:1,6:1,7:1,8:2,9:2,10:2,11:3,0:3,1:3})[e],SEASON_TEXT=[[&quot;\uBD04\uC5D0 \uD0DC\uC5B4\uB09C \uB098\uBB34\uB77C \uC81C\uCCA0\uC744 \uB9CC\uB0AC\uC2B5\uB2C8\uB2E4. \uAE30\uC6B4\uC774 \uC655\uC131\uD574 \uC790\uC2E0\uAC10\uC774 \uB118\uCE58\uC9C0\uB9CC, \uB2E4\uB4EC\uC5B4 \uC904 \uAE08(\u91D1)\uACFC \uAF43\uC744 \uD53C\uC6B8 \uD654(\u706B)\uAC00 \uC788\uC5B4\uC57C \uC4F0\uC784\uC774 \uCEE4\uC9D1\uB2C8\uB2E4.&quot;,&quot;\uC5EC\uB984 \uB098\uBB34\uB77C \uC78E\uC774 \uBB34\uC131\uD558\uACE0 \uC7AC\uB2A5\uC774 \uBC16\uC73C\uB85C \uB4DC\uB7EC\uB0A9\uB2C8\uB2E4. \uB2E4\uB9CC \uB728\uAC70\uC6CC \uC27D\uAC8C \uC9C0\uCE58\uB2C8 \uBB3C(\u6C34)\uB85C \uBFCC\uB9AC\uB97C \uC801\uC154 \uC8FC\uB294 \uD734\uC2DD\uC774 \uC911\uC694\uD569\uB2C8\uB2E4.&quot;,&quot;\uAC00\uC744 \uB098\uBB34\uB77C \uC5F4\uB9E4\uB97C \uB9FA\uB294 \uC2DC\uAE30\uC785\uB2C8\uB2E4. \uC678\uBD80 \uC555\uBC15(\u91D1)\uC774 \uAC15\uD574 \uB2E8\uB828\uC744 \uB9CE\uC774 \uBC1B\uC9C0\uB9CC, \uADF8\uB9CC\uD07C \uD604\uC2E4\uC801\uC778 \uACB0\uC2E4\uC744 \uAC70\uB461\uB2C8\uB2E4.&quot;,&quot;\uACA8\uC6B8 \uB098\uBB34\uB77C \uBD04\uC744 \uAE30\uB2E4\uB9AC\uBA70 \uBFCC\uB9AC\uB97C \uB2E4\uC9D1\uB2C8\uB2E4. \uC0DD\uAC01\uC774 \uAE4A\uACE0 \uC900\uBE44\uAC00 \uCCA0\uC800\uD558\uC9C0\uB9CC, \uB530\uB73B\uD55C \uD654(\u706B)\uB97C \uB9CC\uB098\uC57C \uAE30\uC9C0\uAC1C\uB97C \uCF2D\uB2C8\uB2E4.&quot;],[&quot;\uBD04\uC5D0 \uD0DC\uC5B4\uB09C \uBD88\uC774\uB77C \uB098\uBB34\uAC00 \uBD88\uC744 \uC9C0\uD3B4 \uC90D\uB2C8\uB2E4. \uC8FC\uBCC0\uC758 \uB3C4\uC6C0\uACFC \uBC30\uC6C0 \uC6B4\uC774 \uC788\uC5B4 \uAE30\uC6B4\uC774 \uAFB8\uC900\uD788 \uC0B4\uC544\uB0A9\uB2C8\uB2E4.&quot;,&quot;\uC5EC\uB984 \uBD88\uC774\uB77C \uC81C\uCCA0\uC744 \uB9CC\uB098 \uC5F4\uC815\uC774 \uCD5C\uACE0\uC870\uC785\uB2C8\uB2E4. \uB118\uCE58\uB294 \uAE30\uC6B4\uC744 \uBB3C(\u6C34)\uB85C \uC870\uC808\uD558\uBA74 \uD070 \uBE5B\uC744 \uC624\uB798 \uB0C5\uB2C8\uB2E4.&quot;,&quot;\uAC00\uC744 \uBD88\uC774\uB77C \uD574\uAC00 \uAE30\uC6B0\uB294 \uB54C\uC785\uB2C8\uB2E4. \uD604\uC2E4\uC801\uC778 \uC77C\uACFC \uC7AC\uBB3C\uC5D0 \uB9C8\uC74C\uC744 \uC4F0\uAC8C \uB418\uBA70, \uB098\uBB34(\u6728)\uC758 \uB3C4\uC6C0\uC774 \uD798\uC774 \uB429\uB2C8\uB2E4.&quot;,&quot;\uACA8\uC6B8 \uBD88\uC774\uB77C \uCD94\uC704 \uC18D\uC758 \uADC0\uD55C \uBE5B\uC785\uB2C8\uB2E4. \uC678\uB85C\uC6C0\uC744 \uB290\uB07C\uAE30 \uC27D\uC9C0\uB9CC, \uADF8\uB9CC\uD07C \uC0AC\uB78C\uB4E4\uC5D0\uAC8C \uAF2D \uD544\uC694\uD55C \uC874\uC7AC\uAC00 \uB429\uB2C8\uB2E4.&quot;],[&quot;\uBD04\uC5D0 \uD0DC\uC5B4\uB09C \uD759\uC774\uB77C \uB098\uBB34\uAC00 \uBFCC\uB9AC\uB97C \uB0B4\uB9AC\uBA70 \uD759\uC744 \uB2E4\uC2A4\uB9BD\uB2C8\uB2E4. \uCC45\uC784\uACFC \uC555\uBC15\uC774 \uB9CE\uC9C0\uB9CC \uC870\uC9C1\uC5D0\uC11C \uC778\uC815\uBC1B\uC2B5\uB2C8\uB2E4.&quot;,&quot;\uC5EC\uB984 \uD759\uC774\uB77C \uD587\uBCD5\uC5D0 \uB370\uC6CC\uC838 \uAE30\uC6B4\uC774 \uB109\uB109\uD569\uB2C8\uB2E4. \uB2E4\uB9CC \uBA54\uB9C8\uB974\uAE30 \uC26C\uC6B0\uB2C8 \uBB3C(\u6C34)\uCC98\uB7FC \uC720\uC5F0\uD568\uC744 \uB354\uD558\uBA74 \uC88B\uC2B5\uB2C8\uB2E4.&quot;,&quot;\uAC00\uC744 \uD759\uC774\uB77C \uACB0\uC2E4\uC744 \uB0B4\uBCF4\uB0B4\uB294 \uB54C\uC785\uB2C8\uB2E4. \uC7AC\uB2A5\uACFC \uD45C\uD604\uC774 \uBC16\uC73C\uB85C \uD758\uB7EC\uB098\uAC00 \uC131\uACFC\uAC00 \uB418\uC9C0\uB9CC \uAE30\uC6B4 \uC18C\uBAA8\uB3C4 \uD07D\uB2C8\uB2E4.&quot;,&quot;\uACA8\uC6B8 \uD759\uC774\uB77C \uC5BC\uC5B4 \uC788\uB294 \uB545\uC785\uB2C8\uB2E4. \uC7AC\uBB3C \uAE30\uC6B4\uC740 \uC788\uC73C\uB098 \uCC28\uAC00\uC6B0\uB2C8 \uD654(\u706B)\uC758 \uC628\uAE30\uAC00 \uC788\uC5B4\uC57C \uC81C \uC5ED\uD560\uC744 \uD569\uB2C8\uB2E4.&quot;],[&quot;\uBD04\uC5D0 \uD0DC\uC5B4\uB09C \uC1E0\uB77C \uB098\uBB34\uB97C \uB2E4\uC2A4\uB9AC\uB290\uB77C \uBC14\uC069\uB2C8\uB2E4. \uD604\uC2E4 \uAC10\uAC01\uC774 \uC88B\uACE0 \uC7AC\uBB3C\uC5D0 \uAD00\uC2EC\uC774 \uB9CE\uC73C\uBA70, \uD759(\u571F)\uC758 \uB3C4\uC6C0\uC774 \uD544\uC694\uD569\uB2C8\uB2E4.&quot;,&quot;\uC5EC\uB984 \uC1E0\uB77C \uBD88 \uC18D\uC5D0\uC11C \uB2EC\uAD88\uC9C0\uB294 \uC911\uC785\uB2C8\uB2E4. \uB2E8\uB828\uC774 \uB9CE\uC9C0\uB9CC \uADF8\uB9CC\uD07C \uC4F8\uBAA8 \uC788\uB294 \uADF8\uB987\uC774 \uB429\uB2C8\uB2E4. \uBB3C(\u6C34)\uACFC \uD759(\u571F)\uC774 \uC228\uC744 \uB3CC\uB9AC\uAC8C \uD569\uB2C8\uB2E4.&quot;,&quot;\uAC00\uC744 \uC1E0\uB77C \uC81C\uCCA0\uC744 \uB9CC\uB098 \uB0A0\uCE74\uB86D\uACE0 \uAC15\uD569\uB2C8\uB2E4. \uACB0\uB2E8\uB825\uC774 \uB6F0\uC5B4\uB098\uC9C0\uB9CC, \uBD88(\u706B)\uB85C \uB2E4\uB4EC\uC5B4\uC57C \uBA85\uAC80\uC774 \uB429\uB2C8\uB2E4.&quot;,&quot;\uACA8\uC6B8 \uC1E0\uB77C \uCC28\uAC00\uC6B4 \uBB3C\uC5D0 \uC7A0\uAE34 \uD615\uC0C1\uC785\uB2C8\uB2E4. \uBA38\uB9AC\uAC00 \uBE44\uC0C1\uD558\uACE0 \uB9D0\uC19C\uC528\uAC00 \uC88B\uC9C0\uB9CC, \uB530\uB73B\uD55C \uD654(\u706B)\uAC00 \uC788\uC5B4\uC57C \uAE30\uC6B4\uC774 \uB3D5\uB2C8\uB2E4.&quot;],[&quot;\uBD04\uC5D0 \uD0DC\uC5B4\uB09C \uBB3C\uC774\uB77C \uB098\uBB34\uB97C \uD0A4\uC6B0\uBA70 \uAE30\uC6B4\uC744 \uB0B4\uBCF4\uB0C5\uB2C8\uB2E4. \uC7AC\uB2A5\uC774 \uB9CE\uACE0 \uBCA0\uD480\uAE30\uB97C \uC88B\uC544\uD558\uBA70, \uC1E0(\u91D1)\uC758 \uB3C4\uC6C0\uC774 \uADFC\uC6D0\uC774 \uB429\uB2C8\uB2E4.&quot;,&quot;\uC5EC\uB984 \uBB3C\uC774\uB77C \uC99D\uBC1C\uD558\uAE30 \uC26C\uC6B4 \uB54C\uC785\uB2C8\uB2E4. \uC7AC\uBB3C\uACFC \uD604\uC2E4\uC5D0 \uBC14\uC058\uC9C0\uB9CC \uC9C0\uCE58\uAE30 \uC26C\uC6B0\uB2C8 \uAE08(\u91D1)\xB7\uC218(\u6C34)\uB85C \uAE30\uC6B4\uC744 \uBCF4\uCDA9\uD574\uC57C \uD569\uB2C8\uB2E4.&quot;,&quot;\uAC00\uC744 \uBB3C\uC774\uB77C \uC1E0\uC5D0\uC11C \uBB3C\uC774 \uC19F\uB4EF \uB9D1\uACE0 \uAE68\uB057\uD569\uB2C8\uB2E4. \uBC30\uC6C0\uACFC \uC9C0\uD61C\uAC00 \uAE4A\uACE0, \uC8FC\uBCC0\uC758 \uB3C4\uC6C0\uC744 \uB9CE\uC774 \uBC1B\uC2B5\uB2C8\uB2E4.&quot;,&quot;\uACA8\uC6B8 \uBB3C\uC774\uB77C \uC81C\uCCA0\uC744 \uB9CC\uB098 \uAE30\uC6B4\uC774 \uD07D\uB2C8\uB2E4. \uC9C0\uD61C\uB86D\uC9C0\uB9CC \uCC28\uAC11\uAE30 \uC26C\uC6B0\uB2C8 \uD654(\u706B)\uC640 \uD1A0(\u571F)\uB85C \uC628\uAE30\uC640 \uBC29\uD5A5\uC744 \uC7A1\uC544\uC57C \uD569\uB2C8\uB2E4.&quot;]],ILJI_TEXT={\uBE44\uACAC:&quot;\uC77C\uC9C0\uC5D0 \uBE44\uACAC\uC774 \uC788\uC5B4 \uC8FC\uAD00\uC774 \uB69C\uB837\uD558\uACE0 \uB3C5\uB9BD\uC801\uC785\uB2C8\uB2E4. \uBC30\uC6B0\uC790\uC640\uB3C4 \uCE5C\uAD6C\uCC98\uB7FC \uB300\uB4F1\uD55C \uAD00\uACC4\uB97C \uC6D0\uD569\uB2C8\uB2E4.&quot;,\uAC81\uC7AC:&quot;\uC77C\uC9C0\uC5D0 \uAC81\uC7AC\uAC00 \uC788\uC5B4 \uC2B9\uBD80\uC695\uACFC \uC790\uC874\uC2EC\uC774 \uAC15\uD569\uB2C8\uB2E4. \uAC89\uC740 \uC720\uD574 \uBCF4\uC5EC\uB3C4 \uC18D\uC740 \uC9C0\uAE30 \uC2EB\uC5B4\uD558\uB294 \uC131\uACA9\uC785\uB2C8\uB2E4.&quot;,\uC2DD\uC2E0:&quot;\uC77C\uC9C0\uC5D0 \uC2DD\uC2E0\uC774 \uC788\uC5B4 \uC5EC\uC720\uB86D\uACE0 \uBA39\uC744 \uBCF5\uC774 \uC788\uC2B5\uB2C8\uB2E4. \uCDE8\uBBF8\uC640 \uC7AC\uB2A5\uC744 \uC990\uAE30\uBA70 \uC0B6\uC758 \uC9C8\uC744 \uC911\uC694\uD558\uAC8C \uC5EC\uAE41\uB2C8\uB2E4.&quot;,\uC0C1\uAD00:&quot;\uC77C\uC9C0\uC5D0 \uC0C1\uAD00\uC774 \uC788\uC5B4 \uB9D0\uC19C\uC528\uC640 \uC7AC\uCE58\uAC00 \uB6F0\uC5B4\uB0A9\uB2C8\uB2E4. \uD2C0\uC5D0 \uAC07\uD788\uB294 \uAC83\uC744 \uC2EB\uC5B4\uD558\uACE0 \uAC1C\uC131\uC774 \uBD84\uBA85\uD569\uB2C8\uB2E4.&quot;,\uD3B8\uC7AC:&quot;\uC77C\uC9C0\uC5D0 \uD3B8\uC7AC\uAC00 \uC788\uC5B4 \uD65C\uB3D9\uC801\uC774\uACE0 \uC190\uC774 \uD07D\uB2C8\uB2E4. \uC0AC\uB78C\uACFC \uB3C8\uC744 \uAD74\uB9AC\uB294 \uAC10\uAC01\uC774 \uC788\uACE0 \uC0AC\uAD50\uC801\uC785\uB2C8\uB2E4.&quot;,\uC815\uC7AC:&quot;\uC77C\uC9C0\uC5D0 \uC815\uC7AC\uAC00 \uC788\uC5B4 \uC131\uC2E4\uD558\uACE0 \uC54C\uB730\uD569\uB2C8\uB2E4. \uAC00\uC815\uC744 \uC911\uC2DC\uD558\uACE0 \uACC4\uD68D\uC801\uC73C\uB85C \uC0DD\uD65C\uD569\uB2C8\uB2E4.&quot;,\uD3B8\uAD00:&quot;\uC77C\uC9C0\uC5D0 \uD3B8\uAD00\uC774 \uC788\uC5B4 \uCE74\uB9AC\uC2A4\uB9C8\uC640 \uCD94\uC9C4\uB825\uC774 \uC788\uC2B5\uB2C8\uB2E4. \uC555\uBC15 \uC18D\uC5D0\uC11C \uAC15\uD574\uC9C0\uC9C0\uB9CC \uC2A4\uC2A4\uB85C\uB97C \uBAB0\uC544\uBD99\uC774\uAE30 \uC27D\uC2B5\uB2C8\uB2E4.&quot;,\uC815\uAD00:&quot;\uC77C\uC9C0\uC5D0 \uC815\uAD00\uC774 \uC788\uC5B4 \uBC18\uB4EF\uD558\uACE0 \uC6D0\uCE59\uC801\uC785\uB2C8\uB2E4. \uCCB4\uBA74\uACFC \uC2E0\uC6A9\uC744 \uC911\uC2DC\uD558\uBA70 \uC870\uC9C1 \uC0DD\uD65C\uC5D0 \uC798 \uB9DE\uC2B5\uB2C8\uB2E4.&quot;,\uD3B8\uC778:&quot;\uC77C\uC9C0\uC5D0 \uD3B8\uC778\uC774 \uC788\uC5B4 \uC9C1\uAD00\uACFC \uB3C5\uCC3D\uC131\uC774 \uB6F0\uC5B4\uB0A9\uB2C8\uB2E4. \uB0A8\uB2E4\uB978 \uBD84\uC57C\uC5D0 \uAD00\uC2EC\uC774 \uB9CE\uACE0 \uD63C\uC790\uB9CC\uC758 \uC2DC\uAC04\uC774 \uD544\uC694\uD569\uB2C8\uB2E4.&quot;,\uC815\uC778:&quot;\uC77C\uC9C0\uC5D0 \uC815\uC778\uC774 \uC788\uC5B4 \uC628\uD654\uD558\uACE0 \uBC30\uC6C0\uC744 \uC88B\uC544\uD569\uB2C8\uB2E4. \uC778\uC815\uC774 \uB9CE\uACE0 \uC8FC\uBCC0\uC758 \uB3C4\uC6C0\uC744 \uC798 \uBC1B\uC2B5\uB2C8\uB2E4.&quot;},STRENGTH_TEXT={\uADF9\uC2E0\uAC15:&quot;\uC790\uAE30 \uAE30\uC6B4\uC774 \uB9E4\uC6B0 \uAC15\uD569\uB2C8\uB2E4. \uC8FC\uAD00\uACFC \uBC84\uD2F0\uB294 \uD798\uC774 \uB300\uB2E8\uD558\uC9C0\uB9CC, \uB0A8\uC758 \uB9D0\uC744 \uB4E3\uC9C0 \uC54A\uC73C\uBA74 \uACE0\uB9BD\uB420 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uAE30\uC6B4\uC744 \uBC16\uC73C\uB85C \uC4F0\uB294 \uC77C(\uD45C\uD604\xB7\uC7AC\uBB3C\xB7\uCC45\uC784)\uC5D0 \uD798\uC744 \uC3DF\uC744\uC218\uB85D \uC6B4\uC774 \uD480\uB9BD\uB2C8\uB2E4.&quot;,\uC2E0\uAC15:&quot;\uC790\uAE30 \uAE30\uC6B4\uC774 \uAC15\uD55C \uD3B8\uC785\uB2C8\uB2E4. \uC2A4\uC2A4\uB85C \uD310\uB2E8\uD558\uACE0 \uBC00\uC5B4\uBD99\uC774\uB294 \uD798\uC774 \uC788\uC5B4 \uB3C5\uB9BD\uC801\uC778 \uC77C\uC5D0 \uC720\uB9AC\uD569\uB2C8\uB2E4. \uB118\uCE58\uB294 \uD798\uC744 \uC131\uACFC\uB85C \uBC14\uAFB8\uB294 \uD65C\uB3D9\uC774 \uC911\uC694\uD569\uB2C8\uB2E4.&quot;,\uC911\uD654:&quot;\uAE30\uC6B4\uC758 \uADE0\uD615\uC774 \uC88B\uC740 \uD3B8\uC785\uB2C8\uB2E4. \uC0C1\uD669\uC5D0 \uB530\uB77C \uB098\uC11C\uACE0 \uBB3C\uB7EC\uC124 \uC904 \uC54C\uC544 \uD070 \uAE30\uBCF5 \uC5C6\uC774 \uC548\uC815\uC801\uC73C\uB85C \uB098\uC544\uAC11\uB2C8\uB2E4.&quot;,\uC2E0\uC57D:&quot;\uC790\uAE30 \uAE30\uC6B4\uC774 \uC57D\uD55C \uD3B8\uC785\uB2C8\uB2E4. \uD63C\uC790\uBCF4\uB2E4 \uC88B\uC740 \uC0AC\uB78C\xB7\uC870\uC9C1\uACFC \uD568\uAED8\uD560 \uB54C \uD798\uC774 \uB0A9\uB2C8\uB2E4. \uBC30\uC6C0\uACFC \uD734\uC2DD\uC73C\uB85C \uAE30\uC6B4\uC744 \uCC44\uC6B0\uB294 \uAC83\uC774 \uBA3C\uC800\uC785\uB2C8\uB2E4.&quot;,\uADF9\uC2E0\uC57D:&quot;\uC790\uAE30 \uAE30\uC6B4\uC774 \uB9E4\uC6B0 \uC57D\uD569\uB2C8\uB2E4. \uC8FC\uBCC0 \uD658\uACBD\uC5D0 \uC601\uD5A5\uC744 \uB9CE\uC774 \uBC1B\uC73C\uB2C8, \uB098\uB97C \uC9C0\uC9C0\uD574 \uC8FC\uB294 \uC0AC\uB78C\uACFC \uC548\uC815\uB41C \uD658\uACBD\uC744 \uACE0\uB974\uB294 \uAC83\uC774 \uC131\uACF5\uC758 \uC5F4\uC1E0\uC785\uB2C8\uB2E4.&quot;},GROUP_PERSONA={\uBE44\uAC81:[&quot;\uC8FC\uCCB4\uC131&quot;,&quot;\uB0B4 \uD798\uC73C\uB85C \uD574\uB0B4\uB824\uB294 \uB3C5\uB9BD\uC2EC\uC774 \uAC00\uC7A5 \uB450\uB4DC\uB7EC\uC9D1\uB2C8\uB2E4. \uACBD\uC7C1\uC744 \uC990\uAE30\uACE0 \uB3D9\uB8CC\uC640\uC758 \uC758\uB9AC\uB97C \uC911\uC2DC\uD569\uB2C8\uB2E4.&quot;],\uC2DD\uC0C1:[&qu
