   return async cc=>{if(p.mode==='wipe')cr.setAttribute('width',0);await intro();await vPath(cc,1800,u=>hv(u==null?null:W*(1-u)));await wait(700);};},
 code:p=>`<clipPath id="reveal"><rect width="0" height="100%"/></clipPath>\n<g clip-path="url(#reveal)">  <!-- 면 2개: smooth path + 바닥까지 닫기, 그라디언트 fill(진하기 ${p.alpha}) -->\n</g>\n${p.mode==='wipe'?`// 쓸기: rect width 0 → W, ${p.dur}ms, ease-in-out`:`// 솟기: g { transform-box: fill-box; transform-origin: bottom } scaleY(0 → 1), ${p.dur}ms, 살짝 튀는 이징`}\n// 호버: 인덱스 i의 두 값을 점 2개 + 툴팁 한 개로`,
 prompt:(p,t)=>`${t}에 두 계열을 겹친 애니메이션 에어리어 차트를 만들어줘 (Bklit UI Area Chart 스타일).\n- 로즈(#f3b7bd)·블루실버(#c9d6ef) 두 면, 부드러운 곡선, 위→아래 투명해지는 그라디언트(불투명도 ${p.alpha})\n- 등장: ${p.mode==='wipe'?`clipPath 사각형 너비를 0 → 100%로 ${p.dur}ms 동안 늘려 왼쪽부터 쓸기`:`바닥 기준 scaleY 0 → 1, ${p.dur}ms, 살짝 튀는 이징`}\n- 호버: 세로 가이드선 + 계열별 점 + 두 값을 함께 보여주는 툴팁\n- 범례 클릭으로 계열 숨기기/보이기(면이 부드럽게 사라짐).`},

{id:'ch-bar',cat:'ch',isNew:1,touch:1,src:SRC_BK,ko:'바 차트',en:'Bar Chart',mini:'bounce',target:'월별 실적 리포트',hint:'막대 위로 커서를 올리거나 차트를 눌러 데이터를 바꿔보세요',icon:'<path d="M4 20V11M9 20V6M14 20v-8M19 20V4"/>',
 desc:'막대들이 바닥에서 차례로 통통 튀며 자라고, 하나에 커서를 올리면 나머지가 흐려지며 값이 떠오릅니다. 데이터가 바뀌면 막대 높이가 탄력 있게 새 값으로 움직입니다. 월별 실적, 카테고리 비교, 설문 결과에 씁니다.',
 how:'막대는 최대 높이로 그려 두고 transform-box: fill-box와 transform-origin: bottom을 준 뒤 scaleY(값 ÷ 최대값)으로 높이를 표현합니다. 이렇게 하면 높이 변화가 transform만으로 일어나 transition·WAAPI로 부드럽게 애니메이션됩니다. 등장 때는 막대마다 지연을 늘린 튀는 이징으로 0에서 키웁니다.',
 params:[R('dur','자라는 시간',700,200,1500,20,'ms'),R('stag','막대 간격',60,0,150,5,'ms'),R('n','막대 수',8,4,12,1,'개')],
 build(st,p){const W=chFit(st),H=160,n=+p.n;const B=chBox(st,W,H+18,14);gridLines(B.g,W,H);const bw=W/n*.62;
   let data=Array.from({length:n},()=>20+Math.random()*80);
   const bars=data.map((v,i)=>{const x=(i+.5)*W/n-bw/2;const r=sv(B.g,'rect',{x,y:0,width:bw,height:H,rx:Math.min(6,bw/3),fill:i%3===1?'#c9d6ef':'#f3b7bd'});r.style.transformBox='fill-box';r.style.transformOrigin='50% 100%';r.style.transition=`transform .65s ${SPR},opacity .2s`;r.style.transform='scaleY(0)';sv(B.g,'text',{x:x+bw/2,y:H+14,'text-anchor':'middle',fill:'#8a6f74','font-size':9,'font-family':'var(--f-mono)'}).textContent=MON[i%12].replace('월','');return r;});
   const set=(anim)=>bars.forEach((r,i)=>{r.style.transition=anim?`transform .65s ${SPR},opacity .2s`:'opacity .2s';r.style.transform=`scaleY(${(data[i]/100).toFixed(3)})`;});
   const hv=(x)=>{const i=x==null?-1:Math.floor(x/(W/n));bars.forEach((r,k)=>r.style.opacity=i<0||i>=n||k===i?1:.35);if(i<0||i>=n){chTip(B,null);return;}chTip(B,(i+.5)*W/n,H-data[i]/100*H,`${MON[i%12]} · ${Math.round(data[i])}건`);};
   chHover(st,B,hv);const shuffle=()=>{data=data.map(()=>15+Math.random()*85);set(true);};st.addEventListener('click',shuffle);
   const intro=async()=>{bars.forEach((r,i)=>{r.style.transition='opacity .2s';r.animate([{transform:'scaleY(0)'},{transform:`scaleY(${data[i]/100})`}],{duration:+p.dur,delay:i*p.stag,easing:'cubic-bezier(.3,1.5,.5,1)',fill:'backwards'});});set(false);await wait(+p.dur+n*p.stag);};
   return async cc=>{await intro();await wait(400);await vPath(cc,1500,u=>hv(u==null?null:u*W));await wait(300);shuffle();await wait(1100);shuffle();await wait(1100);};},
 code:p=>`rect { transform-box: fill-box; transform-origin: 50% 100%;\n       transition: transform .65s cubic-bezier(.34,1.56,.64,1); }\n// 높이 = scaleY(value / max)  → transform만 바뀌므로 부드럽게 애니메이션\nbars.forEach((bar, i) => bar.animate(\n  [{ transform: 'scaleY(0)' }, { transform: \`scaleY(\${data[i] / max})\` }],\n  { duration: ${p.dur}, delay: i * ${p.stag}, easing: 'cubic-bezier(.3,1.5,.5,1)', fill: 'backwards' }));\n// 호버: 나머지 막대 opacity .35 + 값 툴팁`,
 prompt:(p,t)=>`${t}에 튀며 자라는 애니메이션 바 차트를 만들어줘 (Bklit UI Bar Chart 스타일).\n- 막대 ${p.n}개, 둥근 모서리, 로즈·블루실버 색, 점선 그리드, 아래 월 라벨\n- 높이는 transform-box: fill-box + origin bottom의 scaleY로 표현\n- 등장: 막대당 ${p.stag}ms 지연, ${p.dur}ms 튀는 이징으로 0에서 자람\n- 호버한 막대만 진하게, 나머지 35%, 값 툴팁 / 데이터 변경 시 스프링으로 새 높이\n- 막대에 aria-label로 값 제공.`},

{id:'ch-ring',cat:'ch',isNew:1,src:SRC_BK,ko:'링 차트',en:'Ring Chart',mini:'spin',target:'목표 달성률 위젯',icon:'<circle cx="12" cy="12" r="9" stroke-dasharray="40 100"/><circle cx="12" cy="12" r="5.5" stroke-dasharray="22 100"/>',
 desc:'겹겹의 원형 링이 바깥부터 차례로 목표치까지 채워지고, 가운데 숫자가 함께 올라갑니다. 운동 링, 목표 달성률, 저장공간·예산 사용량 위젯에 씁니다.',
 how:'링마다 회색 트랙 원과 값 원을 겹치고, 값 원에 pathLength=100을 줘 stroke-dasharray "값 100"으로 원호 길이를 정합니다. 시작점을 12시로 맞추려고 -90° 회전하고, 진행값을 rAF로 0에서 목표까지 이징 보간하며 dasharray와 가운데 숫자를 함께 갱신합니다. 링마다 시작을 조금씩 늦춥니다.',
 params:[R('dur','채우는 시간',1400,400,3000,50,'ms'),R('thick','두께',12,6,20,1,'px'),R('stag','링 간격',150,0,400,10,'ms')],
 build(st,p){const S=190,c=S/2,th=+p.thick;const B=chBox(st,S+150,S,4);const rings=[['활동','#f3b7bd',82],['운동','#c9d6ef',64],['서기','#eee8eb',46]];const lab=[];
   const objs=rings.map(([nm,col],k)=>{const r=c-th/2-k*(th+5);sv(B.g,'circle',{cx:c,cy:c,r,fill:'none',stroke:'rgba(220,170,172,.12)','stroke-width':th});const a=sv(B.g,'circle',{cx:c,cy:c,r,fill:'none',stroke:col,'stroke-width':th,'stroke-linecap':'round',pathLength:100,'stroke-dasharray':'0 100',transform:`rotate(-90 ${c} ${c})`});
     const t=sv(B.g,'text',{x:S+18,y:c-28+k*28,fill:'#b9a6a9','font-size':12,'font-family':'var(--f-body)'});t.innerHTML=`<tspan fill="${col}">●</tspan> ${nm} <tspan class="v" font-family="var(--f-mono)" fill="#efe6e7">0%</tspan>`;lab.push(t.querySelector('.v'));return a;});
   const ctr=sv(B.g,'text',{x:c,y:c+8,'text-anchor':'middle',fill:'#efe6e7','font-size':24,'font-weight':700,'font-family':'var(--f-mono)'});ctr.textContent='0%';let cur=[0,0,0];
   const go=(tg)=>new Promise(res=>{const from=cur.slice(),t0=performance.now();const f=now=>{if(!B.w.isConnected)return res();let done=true;tg.forEach((v,k)=>{const u=Math.max(0,Math.min(1,(now-t0-k*p.stag)/p.dur));if(u<1)done=false;const e=1-Math.pow(1-u,3);cur[k]=from[k]+(v-from[k])*e;objs[k].setAttribute('stroke-dasharray',`${cur[k].toFixed(2)} 100`);lab[k].textContent=Math.round(cur[k])+'%';});ctr.textContent=Math.round(cur[0])+'%';done?res():requestAnimationFrame(f);};requestAnimationFrame(f);});
   return async()=>{await go(rings.map(r=>r[2]));await wait(1000);await go(rings.map(()=>25+Math.random()*70));await wait(900);await go([0,0,0]);};},
 code:p=>`<circle r="R" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 c c)"\n        stroke-width="${p.thick}" stroke-linecap="round" fill="none"/>\nfunction frame(now) {\n  rings.forEach((ring, k) => {\n    const u = clamp((now - t0 - k * ${p.stag}) / ${p.dur}, 0, 1), e = 1 - (1 - u) ** 3;\n    ring.setAttribute('stroke-dasharray', \`\${from + (to - from) * e} 100\`);\n  });\n  center.textContent = Math.round(value) + '%';\n}`,
 prompt:(p,t)=>`${t}에 여러 겹 링 진행률 차트를 만들어줘 (Bklit UI Ring Chart 스타일).\n- 링 3개(로즈·블루실버·실버), 두께 ${p.thick}px, 간격 5px, 각 링 뒤에 흐린 트랙\n- pathLength=100 + stroke-dasharray로 값 표시, 12시 시작(-90° 회전), 둥근 끝\n- 값이 바뀌면 ${p.dur}ms ease-out-cubic으로 보간, 링마다 ${p.stag}ms 늦게 시작, 가운데 숫자와 오른쪽 범례 %도 함께 카운트\n- role="img"와 aria-label에 값 요약.`},

{id:'ch-donut',cat:'ch',isNew:1,touch:1,src:SRC_BK,ko:'도넛 차트',en:'Pie / Donut Chart',mini:'spin',target:'트래픽 유입 경로',hint:'조각 위로 커서를 올려보세요',icon:'<circle cx="12" cy="12" r="8" stroke-dasharray="20 4 14 4 8 100"/>',
 desc:'도넛 조각들이 12시부터 시계 방향으로 한 바퀴 쓸며 채워지고, 조각에 커서를 올리면 그 조각이 굵어지며 가운데에 이름과 비율이 나타납니다. 유입 경로, 비용 구성, 점유율에 씁니다.',
 how:'조각마다 같은 원을 하나씩 그리고 pathLength=100으로 dasharray "조각 길이 100", dashoffset "-시작 위치"를 줘서 원 둘레의 해당 구간만 보이게 합니다. 등장은 전체 진행도 p(0~100)를 올리며 각 조각의 보이는 길이를 min(max(p-시작,0), 길이)로 잘라 한 붓 그리기처럼 쓸어 나갑니다. 호버는 포인터 각도로 조각을 찾습니다.',
 params:[R('dur','쓸기 시간',1200,300,3000,50,'ms'),R('gap','조각 틈',1.2,0,4,.1,''),R('thick','두께',26,10,44,1,'px')],
 build(st,p){const S=200,c=S/2,r=c-p.thick/2-6;const B=chBox(st,S,S,10);const D=[['검색',38,'#f3b7bd'],['SNS',24,'#c9d6ef'],['직접',18,'#eee8eb'],['추천',12,'#c98a93'],['기타',8,'#6d5a5e']];let acc=0;
   const segs=D.map(([nm,v,col])=>{const s0=acc;acc+=v;const e=sv(B.g,'circle',{cx:c,cy:c,r,fill:'none',stroke:col,'stroke-width':p.thick,pathLength:100,'stroke-dasharray':'0 100','stroke-dashoffset':-s0,transform:`rotate(-90 ${c} ${c})`});e.style.transition='stroke-width .25s,opacity .25s';return {e,s0,v,nm};});
   const t1=sv(B.g,'text',{x:c,y:c-2,'text-anchor':'middle',fill:'#efe6e7','font-size':22,'font-weight':700,'font-family':'var(--f-mono)'}),t2=sv(B.g,'text',{x:c,y:c+18,'text-anchor':'middle',fill:'#8a6f74','font-size':11,'font-family':'var(--f-body)'});
   const show=k=>{segs.forEach((s,i)=>{s.e.style.strokeWidth=(k===i?p.thick+8:p.thick)+'px';s.e.style.opacity=k<0||k===i?1:.4;});if(k<0){t1.textContent='12.4K';t2.textContent='총 방문';}else{t1.textContent=segs[k].v+'%';t2.textContent=segs[k].nm;}};
   const sweep=pr=>segs.forEach(s=>s.e.setAttribute('stroke-dasharray',`${Math.max(0,Math.min(pr-s.s0,s.v)-(pr>=s.s0+s.v?p.gap:0)).toFixed(2)} 100`));
   chHover(st,B,(x,y)=>{if(x==null){show(-1);return;}const dx=x-c,dy=y-c,d=Math.hypot(dx,dy);if(d<r-p.thick||d>r+p.thick){show(-1);return;}const a=((Math.atan2(dy,dx)*180/Math.PI+90+360)%360)/3.6;show(segs.findIndex(s=>a>=s.s0&&a<s.s0+s.v));});show(-1);
   return async cc=>{await vPath(cc,+p.dur,u=>sweep(u==null?100:ease3(u)*100));await wait(500);for(let k=0;k<segs.length;k++){if(!cc.alive)return;show(k);await wait(550);}show(-1);await wait(800);};},
 code:p=>`// 조각 = 같은 원 + pathLength 100, 둘레의 [start, start+len] 구간만 표시\nseg.setAttribute('stroke-dasharray', \`\${visible} 100\`);\nseg.setAttribute('stroke-dashoffset', -start);\n// 쓸기: progress 0→100 (${p.dur}ms)\nvisible = Math.min(Math.max(progress - start, 0), len) - ${p.gap};   // 틈 ${p.gap}\n// 호버: angle = atan2(dy, dx) + 90°  → 해당 조각 stroke-width +8, 나머지 opacity .4`,
 prompt:(p,t)=>`${t}에 쓸면서 채워지는 애니메이션 도넛 차트를 만들어줘 (Bklit UI Pie Chart 스타일).\n- 조각 5개(로즈 계열 팔레트), 두께 ${p.thick}px, 조각 사이 틈 ${p.gap}\n- 각 조각은 pathLength=100인 원의 dasharray/dashoffset 구간으로 표현, 12시부터 시계 방향\n- 등장: 진행도 0→100을 ${p.dur}ms 동안 올리며 조각들이 한 붓으로 이어서 채워짐\n- 호버: 포인터 각도로 조각 찾기 → 그 조각 굵게, 나머지 흐리게, 가운데에 이름·비율(기본은 총합)\n- 범례와 키보드 포커스로도 같은 강조.`},

{id:'ch-radar',cat:'ch',isNew:1,src:SRC_BK,ko:'레이더 차트',en:'Radar Chart',mini:'pulse',target:'선수 능력치 비교',icon:'<path d="M12 3l8 6-3 10H7L4 9z" opacity=".5"/><path d="M12 7l5 3-2 6H9l-2-6z"/>',
 desc:'여섯 갈래 축 위에 그려진 다각형이 데이터가 바뀔 때마다 꼭짓점이 늘었다 줄었다 하며 다음 모양으로 부드럽게 변합니다. 능력치·역량 비교, 제품 스펙, 설문 영역별 점수에 씁니다.',
 how:'축 각도 i·60°에 대해 값 v를 반지름으로 삼아 (cos, sin) × v로 꼭짓점을 구하고 polygon의 points에 넣습니다. 데이터가 바뀌면 이전 값과 새 값 사이를 이징으로 보간해 매 프레임 points를 다시 계산하므로 모양이 모핑됩니다. 배경 격자는 같은 방식의 동심 다각형입니다.',
 params:[R('dur','모핑 시간',900,300,2000,50,'ms'),R('hold','머무는 시간',1100,300,3000,50,'ms')],
 build(st,p){const S=210,c=S/2,R0=c-22;const B=chBox(st,S,S,10);const AX=['속도','힘','기술','시야','체력','협동'],n=6;const pt=(i,v)=>[c+Math.cos(-Math.PI/2+i/n*2*Math.PI)*R0*v,c+Math.sin(-Math.PI/2+i/n*2*Math.PI)*R0*v];
   [.25,.5,.75,1].forEach(l=>sv(B.g,'polygon',{points:AX.map((_,i)=>pt(i,l).join(',')).join(' '),fill:'none',stroke:'rgba(220,170,172,.15)'}));AX.forEach((a,i)=>{const [x,y]=pt(i,1);sv(B.g,'line',{x1:c,y1:c,x2:x,y2:y,stroke:'rgba(220,170,172,.15)'});const [lx,ly]=pt(i,1.16);sv(B.g,'text',{x:lx,y:ly+4,'text-anchor':'middle',fill:'#8a6f74','font-size':10,'font-family':'var(--f-body)'}).textContent=a;});
   const poly=sv(B.g,'polygon',{fill:'rgba(243,183,189,.25)',stroke:'#f3b7bd','stroke-width':2,'stroke-linejoin':'round'});const dots=AX.map(()=>sv(B.g,'circle',{r:3.5,fill:'#f6dad7'}));let cur=AX.map(()=>0);
   const draw=v=>{poly.setAttribute('points',v.map((x,i)=>pt(i,x).join(',')).join(' '));v.forEach((x,i)=>{const [a,b]=pt(i,x);dots[i].setAttribute('cx',a);dots[i].setAttribute('cy',b);});};draw(cur);
   const go=tg=>{const from=cur.slice();return vPath({alive:true},+p.dur,u=>{const e=u==null?1:1-Math.pow(1-u,3)*(1-u*.0);cur=from.map((f,i)=>f+(tg[i]-f)*(u==null?1:(u<1?1-Math.pow(1-u,3):1)));draw(cur);});};
   const sets=[[.9,.55,.8,.6,.75,.5],[.5,.9,.45,.7,.6,.85],[.7,.65,.95,.85,.4,.7]];
   return async cc=>{for(const s of sets){if(!cc.alive)return;await go(s);await wait(+p.hold);}};},
 code:p=>`const point = (i, v) => [cx + Math.cos(-PI/2 + i / n * TAU) * R * v,\n                          cy + Math.sin(-PI/2 + i / n * TAU) * R * v];\nfunction morph(from, to) {                     // ${p.dur}ms, ease-out-cubic\n  animate(u => {\n    const v = from.map((f, i) => f + (to[i] - f) * easeOutCubic(u));\n    polygon.setAttribute('points', v.map((x, i) => point(i, x).join(',')).join(' '));\n  });\n}`,
 prompt:(p,t)=>`${t}에 모양이 모핑되는 레이더 차트를 만들어줘 (Bklit UI Radar Chart 스타일).\n- 축 6개(라벨 포함), 25% 간격 동심 다각형 격자, 데이터 면 rgba(243,183,189,.25) + 로즈 외곽선 + 꼭짓점 점\n- 데이터가 바뀌면 각 축 값을 ${p.dur}ms ease-out-cubic으로 보간해 매 프레임 polygon points를 다시 계산(모핑)\n- 여러 데이터셋 비교 시 두 번째는 블루실버 반투명으로 겹치기, 꼭짓점 호버 툴팁\n- prefers-reduced-motion이면 즉시 교체.`},

{id:'ch-gauge',cat:'ch',isNew:1,src:SRC_BK,ko:'게이지',en:'Gauge',mini:'swing',target:'서버 부하 모니터',icon:'<path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-5"/>',
 desc:'반원 계기판의 바늘이 새 값으로 휙 돌아가 살짝 지나쳤다가 떨리며 멈추고, 호(arc)도 함께 채워집니다. CPU·서버 부하, 속도, 신용 점수, 만족도 지표에 씁니다.',
 how:'바늘 각도를 감쇠 스프링(가속도 = 강성·(목표-각도) - 감쇠·속도)으로 시뮬레이션해 목표를 지나쳤다 돌아오는 계기판 느낌을 냅니다. 같은 값으로 반원 호의 dasharray를 갱신하고, 값 구간에 따라 색을 바꿉니다.',
 params:[R('val','값',72,0,100,1,''),R('k','강성',90,20,300,5,''),R('damp','감쇠',9,2,30,.5,'')],
 build(st,p,c){const S=220,cx=S/2,cy=S*.62,r=S*.42;const B=chBox(st,S,S*.78,8);const arcD=`M${cx-r},${cy} A${r},${r} 0 0 1 ${cx+r},${cy}`;
   sv(B.g,'path',{d:arcD,fill:'none',stroke:'rgba(220,170,172,.13)','stroke-width':16,'stroke-linecap':'round'});const ar=sv(B.g,'path',{d:arcD,fill:'none',stroke:'#f3b7bd','stroke-width':16,'stroke-linecap':'round',pathLength:100,'stroke-dasharray':'0 100'});
   for(let i=0;i<=10;i++){const a=Math.PI+i/10*Math.PI;sv(B.g,'line',{x1:cx+Math.cos(a)*(r-16),y1:cy+Math.sin(a)*(r-16),x2:cx+Math.cos(a)*(r-(i%5?21:26)),y2:cy+Math.sin(a)*(r-(i%5?21:26)),stroke:'#6d5a5e','stroke-width':i%5?1:1.6});}
   const nd=sv(B.g,'g',{});sv(nd,'path',{d:`M${cx-4},${cy} L${cx},${cy-r+30} L${cx+4},${cy}Z`,fill:'#f6dad7'});sv(nd,'circle',{cx,cy,r:8,fill:'#141113',stroke:'#f6dad7','stroke-width':2.5});
   const tx=sv(B.g,'text',{x:cx,y:cy+30,'text-anchor':'middle',fill:'#efe6e7','font-size':22,'font-weight':700,'font-family':'var(--f-mono)'});
   let v=0,vel=0,tg=+p.val;loop(c,(t,dt)=>{const h=dt/4;for(let i=0;i<4;i++){vel+=(p.k*(tg-v)-p.damp*vel)*h;v+=vel*h;}const vv=Math.max(-3,Math.min(103,v));nd.setAttribute('transform',`rotate(${(vv/100*180-90).toFixed(2)} ${cx} ${cy})`);ar.setAttribute('stroke-dasharray',`${Math.max(0,Math.min(100,vv)).toFixed(2)} 100`);ar.setAttribute('stroke',vv>85?'#e48a97':vv>60?'#f3b7bd':'#c9d6ef');tx.textContent=Math.round(Math.max(0,Math.min(100,vv)))+'%';});
   return async cc=>{for(const k of [+p.val,34,93,+p.val]){if(!cc.alive)return;tg=k;await wait(1500);}};},
 code:p=>`// 바늘: 감쇠 스프링 → 목표를 살짝 지나쳤다 멈춤\nvel += (${p.k} * (target - value) - ${p.damp} * vel) * dt;\nvalue += vel * dt;\nneedle.setAttribute('transform', \`rotate(\${value / 100 * 180 - 90} cx cy)\`);\narc.setAttribute('stroke-dasharray', \`\${value} 100\`);           // 반원 호, pathLength=100\narc.setAttribute('stroke', value > 85 ? danger : value > 60 ? rose : calm);`,
 prompt:(p,t)=>`${t}에 스프링 바늘 게이지를 SVG로 만들어줘 (Bklit UI Gauge 스타일).\n- 반원 트랙(두께 16, 둥근 끝) + pathLength=100 값 호, 눈금 11개, 가운데 % 숫자, 현재 값 ${p.val}\n- 바늘 각도는 감쇠 스프링(강성 ${p.k}, 감쇠 ${p.damp})으로 목표를 살짝 지나쳤다 멈추게, 한 프레임을 4번 나눠 계산\n- 값 구간별 색: 60 이하 블루실버, 60~85 로즈, 85 이상 레드로즈\n- role="meter"와 aria-valuenow 갱신.`},

{id:'ch-live',cat:'ch',isNew:1,src:SRC_BK,ko:'실시간 라인',en:'Live Line Chart',mini:'slide',target:'실시간 접속자 모니터',icon:'<path d="M3 15l4-3 3 2 4-6 3 3"/><circle cx="20" cy="11" r="1.8" fill="url(#rsg)" stroke="none"/>',
 desc:'새 값이 들어올 때마다 선이 왼쪽으로 부드럽게 흘러가고, 맨 끝의 점이 맥박처럼 퍼지며 최신 값을 알려줍니다. 실시간 접속자, 주식 시세, 서버 지표, IoT 센서 모니터에 씁니다.',
 how:'최근 N개 값을 배열로 유지하고, 새 값이 들어온 뒤 다음 값이 오기까지의 경과 비율만큼 전체 선을 왼쪽으로 한 칸 이하 평행이동해 끊김 없이 흐르게 합니다. 끝점에는 커졌다 사라지는 고리를 반복하고, 세로 범위는 최소·최대값을 스무딩으로 따라가 축이 튀지 않게 합니다.',
 params:[R('rate','데이터 간격',600,150,2000,50,'ms'),R('n','표시 개수',30,10,60,1,'개'),R('vol','변동폭',12,2,30,1,'')],
 build(st,p,c){const W=chFit(st),H=150,n=+p.n;const B=chBox(st,W,H,14),id=uidc();gradDef(B.s,id,'#f3b7bd',.35);gridLines(B.g,W,H,3);
   const cp=sv(B.s.querySelector('defs'),'clipPath',{id:id+'k'});sv(cp,'rect',{x:0,y:-10,width:W,height:H+20});const g=sv(B.g,'g',{'clip-path':`url(#${id}k)`});
   const area=sv(g,'path',{fill:`url(#${id})`}),ln=sv(g,'path',{fill:'none',stroke:'#f3b7bd','stroke-width':2,'stroke-linejoin':'round'});const ring=sv(B.g,'circle',{r:4,fill:'none',stroke:'#f3b7bd'}),dot=sv(B.g,'circle',{r:4,fill:'#f6dad7'});const tx=sv(B.g,'text',{'text-anchor':'end',fill:'#f6dad7','font-size':11,'font-family':'var(--f-mono)'});
   let data=walk(n+1,50,p.vol),last=performance.now(),lo=0,hi=100;
   loop(c,()=>{const now=performance.now();if(now-last>p.rate){last=now;data.push(Math.max(5,Math.min(95,data[data.length-1]+(Math.random()-.5)*p.vol*1.6)));data=data.slice(-(n+2));}
     const f=Math.min(1,(now-last)/p.rate),step=W/(n-1);const mn=Math.min(...data)-8,mx=Math.max(...data)+8;lo+=(mn-lo)*.05;hi+=(mx-hi)*.05;const Y=v=>H-(v-lo)/(hi-lo)*H;
     const pts=data.map((v,i)=>[(i-(data.length-1-n+1))*step-f*step+step,Y(v)]);const d=smoothD(pts);ln.setAttribute('d',d);area.setAttribute('d',d+`L${pts[pts.length-1][0]},${H}L${pts[0][0]},${H}Z`);
     const e=pts[pts.length-1],ex=Math.min(W,e[0]);dot.setAttribute('cx',ex);dot.setAttribute('cy',e[1]);ring.setAttribute('cx',ex);ring.setAttribute('cy',e[1]);ring.setAttribute('r',4+f*14);ring.setAttribute('opacity',1-f);tx.setAttribute('x',ex-10);tx.setAttribute('y',e[1]-12);tx.textContent=Math.round(data[data.length-1]*37)+'명';});
   return null;},
 code:p=>`// ${p.rate}ms마다 새 값 push, 최근 ${p.n}개 유지\nconst f = (now - lastPush) / ${p.rate};          // 0→1: 다음 값까지 진행률\nconst pts = data.map((v, i) => [(i - f) * step, y(v)]);   // 왼쪽으로 연속 이동\nline.setAttribute('d', smooth(pts));\nlo += (min - lo) * .05; hi += (max - hi) * .05;  // 세로 범위 스무딩\npulse.setAttribute('r', 4 + f * 14); pulse.setAttribute('opacity', 1 - f);`,
 prompt:(p,t)=>`${t}에 실시간으로 흘러가는 라이브 라인 차트를 만들어줘 (Bklit UI Live Line Chart 스타일).\n- ${p.rate}ms마다 새 값(WebSocket 등) 추가, 최근 ${p.n}개만 유지\n- 다음 값까지의 경과 비율만큼 선 전체를 왼쪽으로 이동해 끊김 없이 흐르게, 부드러운 곡선 + 그라디언트 면\n- 끝점: 실선 점 + 매 주기 퍼지며 사라지는 고리, 옆에 최신 값 라벨\n- 세로 범위는 최소/최대를 0.05씩 스무딩해 축이 튀지 않게, 탭이 숨겨지면 렌더 정지.`},

{id:'ch-funnel',cat:'ch',isNew:1,src:SRC_BK,ko:'퍼널 차트',en:'Funnel Chart',mini:'stretch',target:'가입 전환 퍼널',icon:'<path d="M3 5h18l-5 7v6l-4 2v-8z"/>',
 desc:'방문 → 가입 → 구매처럼 단계마다 줄어드는 사용자 수를 부드러운 곡선 띠로 보여주고, 각 단계 폭이 0에서 값까지 자라나며 전환율이 함께 올라갑니다. 마케팅 전환, 가입 흐름, 영업 파이프라인에 씁니다.',
 how:'단계마다 세로 중심선을 기준으로 위아래 폭(값에 비례)을 정하고, 이웃 단계 사이를 베지어 곡선으로 이어 하나의 매끄러운 면 path를 만듭니다. 진행도에 따라 모든 폭을 0에서 목표까지 보간해 매 프레임 path를 다시 그리고, 단계 라벨과 전환율 숫자를 함께 카운트합니다.',
 params:[R('dur','자라는 시간',1200,300,3000,50,'ms'),R('curve','곡률',.5,0,1,.05,'')],
 build(st,p){const W=chFit(st),H=150;const B=chBox(st,W,H+30,10),id=uidc();const df=sv(B.s,'defs',{});const lg=sv(df,'linearGradient',{id,x1:0,y1:0,x2:1,y2:0});sv(lg,'stop',{offset:0,'stop-color':'#f3b7bd'});sv(lg,'stop',{offset:1,'stop-color':'#8a6f74'});
   const S=[['방문',12400],['가입',5200],['체험',2900],['구매',1150]];const n=S.length,cy=H/2;const body=sv(B.g,'path',{fill:`url(#${id})`,opacity:.9});const hi=sv(B.g,'path',{fill:'none',stroke:'rgba(255,255,255,.35)','stroke-width':1});
   const labs=S.map(([nm],i)=>{const x=(i+.5)/n*W;sv(B.g,'line',{x1:i/n*W,x2:i/n*W,y1:-4,y2:H+4,stroke:'rgba(20,17,19,.6)',opacity:i?1:0});const t=sv(B.g,'text',{x,y:H+20,'text-anchor':'middle',fill:'#b9a6a9','font-size':10,'font-family':'var(--f-body)'});const v=sv(B.g,'text',{x,y:cy+4,'text-anchor':'middle',fill:'#141113','font-size':11,'font-weight':700,'font-family':'var(--f-mono)'});return [t,v,nm];});
   const draw=k=>{const hw=S.map(([,v])=>v/S[0][1]*cy*.95*k);let top=`M0,${cy-hw[0]}`,bot='';const xs=S.map((_,i)=>(i+.5)/n*W);
     for(let i=0;i<n;i++){const x0=i/n*W,x1=(i+1)/n*W,h=hw[i],hn=hw[Math.min(n-1,i+1)];const cx=(x1-x0)*p.curve;top+=`L${x0+(x1-x0)*.5},${cy-h}`;top+=i<n-1?`C${x0+(x1-x0)*.5+cx},${cy-h} ${x1+(x1-x0)*.5-cx},${cy-hn} ${x1+(x1-x0)*.5},${cy-hn}`:`L${x1},${cy-h}`;}
     const pts=[];for(let i=n-1;i>=0;i--){const x0=i/n*W,x1=(i+1)/n*W,h=hw[i],hp=hw[Math.max(0,i-1)];const cx=(x1-x0)*p.curve;bot+=i===n-1?`L${x1},${cy+h}L${x0+(x1-x0)*.5},${cy+h}`:`L${x0+(x1-x0)*.5},${cy+h}`;if(i>0)bot+=`C${x0+(x1-x0)*.5-cx},${cy+h} ${x0-(x1-x0)*.5+cx},${cy+hp} ${x0-(x1-x0)*.5},${cy+hp}`;}
     body.setAttribute('d',top+bot+`L0,${cy+hw[0]}Z`);hi.setAttribute('d',top);labs.forEach(([t,v,nm],i)=>{t.textContent=i?`${nm} ${Math.round(S[i][1]/S[i-1][1]*100*k)}%`:nm;v.textContent=Math.round(S[i][1]*k).toLocaleString();});};draw(0);
   return async cc=>{await vPath(cc,+p.dur,u=>draw(u==null?1:ease3(u)));await wait(1600);await vPath(cc,500,u=>draw(u==null?0:1-ease3(u)));await wait(300);};},
 code:p=>`// 단계 i의 반폭 h[i] = value[i] / value[0] * maxHalf * progress\n// 위쪽 경계: 단계 중앙점들을 베지어(곡률 ${p.curve})로 잇고, 아래쪽은 거울로 되돌아오며 닫기\npath = top(h) + bottom(h) + 'Z';\nanimate(${p.dur}, u => { progress = easeInOutCubic(u); render(); });\n// 라벨: "가입 42%" = value[i] / value[i-1], 숫자도 progress로 카운트`,
 prompt:(p,t)=>`${t}로 곡선 띠 퍼널 차트를 SVG로 만들어줘 (Bklit UI Funnel Chart 스타일).\n- 단계 4개(방문 12,400 → 가입 5,200 → 체험 2,900 → 구매 1,150), 세로 중심 기준 값에 비례한 폭\n- 단계 사이를 베지어(곡률 ${p.curve})로 이어 하나의 매끄러운 면, 로즈 → 그레이 가로 그라디언트, 단계 경계 세로 구분선\n- 등장: 모든 폭을 0에서 ${p.dur}ms 동안 키우고 단계 값·전환율(이전 단계 대비 %)을 함께 카운트\n- 단계 호버 시 해당 구간 강조 + 툴팁.`},

{id:'ch-candle',cat:'ch',isNew:1,touch:1,src:SRC_BK,ko:'캔들스틱',en:'Candlestick Chart',mini:'pulse',target:'코인 시세 화면',hint:'차트 위로 커서를 움직여보세요',icon:'<path d="M7 4v16M17 6v12"/><rect x="5" y="8" width="4" height="7" rx=".5"/><rect x="15" y="10" width="4" height="5" rx=".5"/>',
 desc:'봉(캔들)이 하나씩 위아래로 펼쳐지며 차트가 쌓이고, 커서를 올리면 십자선과 함께 그 봉의 시가·고가·저가·종가가 나타납니다. 주식·코인 시세, 트레이딩 화면에 씁니다.',
 how:'봉마다 고가~저가를 잇는 심지(line)와 시가~종가 몸통(rect)을 그리고, 몸통 중심을 기준(transform-origin: center)으로 scaleY 0 → 1을 차례로 지연시켜 펼칩니다. 상승은 로즈, 하락은 실버 회색으로 칠하고, 호버하면 가장 가까운 봉의 x와 포인터 y에 십자선과 OHLC 툴팁을 둡니다.',
 params:[R('n','봉 개수',22,10,40,1,'개'),R('stag','등장 간격',40,0,120,5,'ms')],
 build(st,p){const W=chFit(st),H=160,n=+p.n;const B=chBox(st,W,H,14);gridLines(B.g,W,H);let pr=50;const D=Array.from({length:n},()=>{const o=pr,c=Math.max(10,Math.min(90,o+(Math.random()-.47)*12));const h=Math.max(o,c)+Math.random()*6,l=Math.min(o,c)-Math.random()*6;pr=c;return {o,c,h,l};});
   const lo=Math.min(...D.map(d=>d.l))-4,hi=Math.max(...D.map(d=>d.h))+4,Y=v=>H-(v-lo)/(hi-lo)*H,cw=W/n;
   const cs=D.map((d,i)=>{const x=(i+.5)*cw,up=d.c>=d.o,col=up?'#f3b7bd':'#8a7b80';const g=sv(B.g,'g',{});sv(g,'line',{x1:x,x2:x,y1:Y(d.h),y2:Y(d.l),stroke:col,'stroke-width':1.2});sv(g,'rect',{x:x-cw*.32,y:Y(Math.max(d.o,d.c)),width:cw*.64,height:Math.max(1.5,Math.abs(Y(d.o)-Y(d.c))),fill:col,rx:1});g.style.transformBox='fill-box';g.style.transformOrigin='center';return g;});
   const vx=sv(B.g,'line',{y1:0,y2:H,stroke:'rgba(246,218,215,.5)','stroke-dasharray':'3 3',opacity:0}),hz=sv(B.g,'line',{x1:0,x2:W,stroke:'rgba(246,218,215,.5)','stroke-dasharray':'3 3',opacity:0});
   const hv=(x,y)=>{if(x==null||x<0||x>W){vx.setAttribute('opacity',0);hz.setAttribute('opacity',0);chTip(B,null);cs.forEach(g=>g.style.opacity=1);return;}const i=Math.min(n-1,Math.floor(x/cw)),d=D[i],cx=(i+.5)*cw,yy=Math.max(0,Math.min(H,y));vx.setAttribute('x1',cx);vx.setAttribute('x2',cx);hz.setAttribute('y1',yy);hz.setAttribute('y2',yy);vx.setAttribute('opacity',1);hz.setAttribute('opacity',1);cs.forEach((g,k)=>g.style.opacity=k===i?1:.55);chTip(B,cx,Y(d.h),`O ${d.o.toFixed(1)} H ${d.h.toFixed(1)} L ${d.l.toFixed(1)} C ${d.c.toFixed(1)}`);};
   chHover(st,B,hv);
   return async cc=>{cs.forEach((g,i)=>g.animate([{transform:'scaleY(0)',opacity:0},{transform:'scaleY(1)',opacity:1}],{duration:420,delay:i*p.stag,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'backwards'}));await wait(420+n*p.stag);await vPath(cc,2000,u=>hv(u==null?null:u*W,u==null?null:H*(.3+.4*Math.sin(u*6))));await wait(500);};},
 code:p=>`candles.forEach((c, i) => {\n  // 심지: line(high → low), 몸통: rect(open ↔ close), 상승 로즈 / 하락 실버\n  c.group.style.transformBox = 'fill-box'; c.group.style.transformOrigin = 'center';\n  c.group.animate([{ transform: 'scaleY(0)', opacity: 0 }, { transform: 'scaleY(1)', opacity: 1 }],\n    { duration: 420, delay: i * ${p.stag}, easing: 'cubic-bezier(.3,1.4,.5,1)', fill: 'backwards' });\n});\n// 호버: 가장 가까운 봉 x + 포인터 y에 점선 십자선, "O H L C" 툴팁`,

{id:'ch-sankey',cat:'ch',isNew:1,touch:1,src:SRC_BK,ko:'생키 다이어그램',en:'Sankey Chart',mini:'slide',target:'예산 흐름 시각화',hint:'흐름 위로 커서를 올려보세요',icon:'<path d="M3 6c8 0 10 10 18 10M3 12c8 0 10-6 18-6M3 18c8 0 10-2 18-2" />',
 desc:'왼쪽 출처에서 오른쪽 목적지로 흘러가는 양을 굵기가 다른 곡선 띠로 보여줍니다. 띠가 왼쪽부터 그려지며 등장하고, 안쪽으로 빛 입자가 흐르며, 띠에 커서를 올리면 그 흐름만 강조됩니다. 예산·매출 흐름, 유입→전환 경로, 에너지 흐름에 씁니다.',
 how:'노드마다 값의 합에 비례한 높이를 주고, 각 흐름을 출처 노드의 쌓인 위치에서 목적지 노드의 쌓인 위치로 잇는 수평 베지어 곡선으로 그립니다. 흐름의 굵기는 stroke-width = 값으로 정하고, pathLength=1의 dashoffset으로 등장을 그립니다. 위에 짧은 점선을 겹쳐 dashoffset을 계속 줄이면 흐르는 입자처럼 보입니다.',
 params:[R('dur','그리기 시간',1300,300,3000,50,'ms'),R('flow','흐름 속도',1,0,3,.1,'×')],
 build(st,p,c){const W=chFit(st),H=180;const B=chBox(st,W,H,12),id=uidc();const df=sv(B.s,'defs',{});
   const L=[['광고',40],['검색',35],['추천',25]],Rt=[['가입',45],['이탈',30],['재방문',25]];const F=[[0,0,18],[0,1,15],[0,2,7],[1,0,17],[1,1,8],[1,2,10],[2,0,10],[2,1,7],[2,2,8]];const COL=['#f3b7bd','#c9d6ef','#eee8eb'];
   const gap=10,sc=(H-gap*2)/100,nw=10;const ly=[],ry=[];let a=0;L.forEach(([,v])=>{ly.push(a);a+=v*sc+gap;});a=0;Rt.forEach(([,v])=>{ry.push(a);a+=v*sc+gap;});
   const lo=L.map(()=>0),ro=Rt.map(()=>0);const flows=F.map(([s,t,v],k)=>{const w=v*sc,y0=ly[s]+lo[s]+w/2,y1=ry[t]+ro[t]+w/2;lo[s]+=w;ro[t]+=w;const gid=id+k;const lg=sv(df,'linearGradient',{id:gid,x1:0,x2:1,y1:0,y2:0});sv(lg,'stop',{offset:0,'stop-color':COL[s],'stop-opacity':.55});sv(lg,'stop',{offset:1,'stop-color':COL[t],'stop-opacity':.35});
     const d=`M${nw},${y0} C${W/2},${y0} ${W/2},${y1} ${W-nw},${y1}`;const band=sv(B.g,'path',{d,fill:'none',stroke:`url(#${gid})`,'stroke-width':w,pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1});band.style.transition='opacity .2s';
     const pt=sv(B.g,'path',{d,fill:'none',stroke:'rgba(255,245,245,.55)','stroke-width':Math.max(1,w*.12),'stroke-dasharray':'2 14','stroke-linecap':'round',opacity:0});return {band,pt,s,t,v,y:(y0+y1)/2};});
   L.forEach(([nm,v],i)=>{sv(B.g,'rect',{x:0,y:ly[i],width:nw,height:v*sc,rx:2,fill:COL[i]});sv(B.g,'text',{x:nw+5,y:ly[i]+v*sc/2+4,fill:'#efe6e7','font-size':10,'font-weight':700,'font-family':'var(--f-body)',style:'paint-order:stroke;stroke:#141113;stroke-width:3px'}).textContent=nm;});
   Rt.forEach(([nm,v],i)=>{sv(B.g,'rect',{x:W-nw,y:ry[i],width:nw,height:v*sc,rx:2,fill:COL[i]});sv(B.g,'text',{x:W-nw-5,y:ry[i]+v*sc/2+4,'text-anchor':'end',fill:'#efe6e7','font-size':10,'font-weight':700,'font-family':'var(--f-body)',style:'paint-order:stroke;stroke:#141113;stroke-width:3px'}).textContent=nm;});
   const hl=k=>{flows.forEach((f,i)=>f.band.style.opacity=k<0||i===k?1:.25);if(k<0)chTip(B,null);else chTip(B,W/2,flows[k].y-8,`${L[flows[k].s][0]} → ${Rt[flows[k].t][0]} · ${flows[k].v}%`);};
   chHover(st,B,(x,y)=>{if(x==null||x<nw||x>W-nw){hl(-1);return;}const u=(x-nw)/(W-2*nw);let best=-1,bd=1e9;flows.forEach((f,i)=>{const d=f.band.getAttribute('d').match(/-?[\d.]+/g).map(Number);const yy=d[1]+(d[7]-d[1])*(3*u*u-2*u*u*u);const dd=Math.abs(yy-y);if(dd<f.v*sc/2+2&&dd<bd){bd=dd;best=i;}});hl(best);});
   let off=0;loop(c,(t,dt)=>{off-=dt*40*p.flow;flows.forEach(f=>f.pt.setAttribute('stroke-dashoffset',off.toFixed(1)));});
   return async cc=>{flows.forEach((f,i)=>{f.pt.setAttribute('opacity',0);f.band.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:+p.dur,delay:i*40,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'});});await wait(+p.dur+400);flows.forEach(f=>f.pt.animate([{opacity:0},{opacity:1}],{duration:400,fill:'forwards'}));
     for(const k of [0,4,8]){if(!cc.alive)return;hl(k);await wait(900);}hl(-1);await wait(800);};},
 code:p=>`// 흐름 = 출처의 쌓인 y → 목적지의 쌓인 y 수평 베지어, 굵기 = 값\nconst d = \`M\${x0},\${y0} C\${mid},\${y0} \${mid},\${y1} \${x1},\${y1}\`;\nband.setAttribute('stroke-width', value * scale);   // pathLength=1\nband.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: ${p.dur}, delay: i * 40 });\n// 흐르는 입자: 같은 path에 '2 14' 점선을 겹치고 dashoffset -= dt * ${Math.round(40*p.flow)}\n// 호버: 해당 흐름만 opacity 1, 나머지 .25 + "광고 → 가입 · 18%"`,
 prompt:(p,t)=>`${t}로 애니메이션 생키 다이어그램을 SVG로 만들어줘 (Bklit UI Sankey Chart 스타일).\n- 왼쪽 출처 3개 → 오른쪽 목적지 3개, 노드 높이와 흐름 굵기는 값에 비례, 노드 안에서 흐름을 위부터 쌓아 배치\n- 흐름은 수평 베지어 곡선 + 출처색 → 목적지색 가로 그라디언트(반투명)\n- 등장: 흐름마다 40ms 지연으로 pathLength=1 dashoffset을 ${p.dur}ms 동안 그리기, 이후 짧은 점선이 ${p.flow}배 속도로 흘러가는 입자 효과\n- 흐름 호버 시 그것만 강조하고 "출처 → 목적지 · 값" 툴팁, 노드 호버 시 연결된 흐름 전체 강조.`},

{id:'ch-scatter',cat:'ch',isNew:1,touch:1,src:SRC_BK,ko:'스캐터 차트',en:'Scatter Chart',mini:'pop',target:'고객 세그먼트 분석',hint:'점 위로 커서를 움직여보세요',icon:'<circle cx="6" cy="16" r="1.6"/><circle cx="10" cy="11" r="1.6"/><circle cx="15" cy="13" r="1.6"/><circle cx="18" cy="6" r="1.6"/><path d="M3 21h18M3 3v18" opacity=".5"/>',
 desc:'점들이 차례로 톡톡 튀어나오고, 데이터를 다른 기준으로 바꾸면 점들이 각자 새 위치로 미끄러지며 무리를 이룹니다. 커서 가까운 점이 커지며 값을 보여줍니다. 고객 세그먼트, 가격-판매량 상관관계, 클러스터 분석에 씁니다.',
 how:'점마다 두 가지 좌표 세트(예: 전체 분포, 군집별 분포)를 미리 계산하고, 세트를 바꿀 때 각 점의 cx·cy를 이전 → 새 좌표로 이징 보간합니다. 등장은 점마다 지연을 준 scale 0 → 1 팝입니다. 호버는 포인터와 가장 가까운 점을 찾아 반지름을 키우고 툴팁을 띄웁니다.',
 params:[R('n','점 개수',48,15,120,1,'개'),R('dur','이동 시간',900,300,2000,50,'ms')],
 build(st,p){const W=chFit(st),H=170,n=+p.n;const B=chBox(st,W,H,14);gridLines(B.g,W,H);const COL=['#f3b7bd','#c9d6ef','#eee8eb'];const CC=[[.25,.7],[.55,.35],[.82,.62]];
   const P=Array.from({length:n},(_,i)=>{const k=i%3,a=Math.random()*6.28,r=Math.sqrt(Math.random())*.13;return {k,A:[Math.random()*W,Math.random()*H],Bp:[(CC[k][0]+Math.cos(a)*r)*W,(CC[k][1]+Math.sin(a)*r*1.2)*H]};});
   const dots=P.map(q=>{const e=sv(B.g,'circle',{cx:q.A[0],cy:q.A[1],r:4,fill:COL[q.k],opacity:.85});e.style.transformBox='fill-box';e.style.transformOrigin='center';q.e=q.cur=null;q.e=e;q.cur=q.A.slice();return e;});let mode=0,hov=-1;
   const go=m=>{mode=m;const from=P.map(q=>q.cur.slice());return vPath({alive:true},+p.dur,u=>{const e=u==null?1:ease3(u);P.forEach((q,i)=>{const T=m?q.Bp:q.A;const d=Math.min(1,Math.max(0,e*1.25-i/n*.25));q.cur=[from[i][0]+(T[0]-from[i][0])*d,from[i][1]+(T[1]-from[i][1])*d];q.e.setAttribute('cx',q.cur[0].toFixed(1));q.e.setAttribute('cy',q.cur[1].toFixed(1));});});};
   const hv=(x,y)=>{let b=-1,bd=30;if(x!=null)P.forEach((q,i)=>{const d=Math.hypot(q.cur[0]-x,q.cur[1]-y);if(d<bd){bd=d;b=i;}});if(b!==hov){if(hov>=0)P[hov].e.setAttribute('r',4);hov=b;}if(b<0){chTip(B,null);return;}P[b].e.setAttribute('r',8);chTip(B,P[b].cur[0],P[b].cur[1]-6,`세그먼트 ${'ABC'[P[b].k]} · ₩${Math.round(P[b].cur[0]/W*90+10)}k · ${Math.round((1-P[b].cur[1]/H)*100)}회`);};
   chHover(st,B,hv);st.addEventListener('click',()=>go(mode?0:1));
   return async cc=>{dots.forEach((e,i)=>e.animate([{transform:'scale(0)'},{transform:'scale(1)'}],{duration:400,delay:i*18,easing:'cubic-bezier(.3,1.8,.5,1)',fill:'backwards'}));await wait(400+n*18);await go(1);await vPath(cc,1200,u=>{if(u==null)return hv(null);const k=Math.min(2,Math.floor(u*3));hv(CC[k][0]*W,CC[k][1]*H);});hv(null);await go(0);await wait(500);};},
 code:p=>`// 점마다 좌표 세트 2개 준비: A(전체 분포), B(군집별)\nfunction morph(to) {                                 // ${p.dur}ms\n  animate(u => points.forEach((pt, i) => {\n    const d = clamp(easeInOut(u) * 1.25 - i / n * .25, 0, 1);   // 살짝 순차적으로\n    pt.el.setAttribute('cx', lerp(pt.from.x, pt[to].x, d));\n    pt.el.setAttribute('cy', lerp(pt.from.y, pt[to].y, d));\n  }));\n}\n// 등장: i * 18ms 지연 scale 0 → 1 / 호버: 가장 가까운 점 r 4 → 8 + 툴팁`,
 prompt:(p,t)=>`${t}에 모핑되는 애니메이션 스캐터 차트를 만들어줘 (Bklit UI Scatter Chart 스타일).\n- 점 ${p.n}개(세그먼트 3색), 반지름 4, 점선 그리드\n- 등장: 점마다 18ms 지연 scale 0 → 1 팝\n- 보기 전환(전체 ↔ 군집) 시 각 점이 ${p.dur}ms 동안 새 좌표로 이동, 인덱스에 따라 살짝 순차적으로\n- 호버: 포인터 30px 안의 가장 가까운 점을 2배로 키우고 툴팁, 터치 지원\n- 범례 클릭으로 세그먼트 필터.`},

{id:'fx-chroma',cat:'fx',isNew:1,src:SRC_BK,ko:'색수차 글리치',en:'Chromatic Glitch',mini:'shake',target:'고객사 로고 띠',hint:'로고에 커서를 올려보세요',icon:'<path d="M5 8h14M5 12h10M5 16h12" stroke="#f3b7bd"/><path d="M6.5 9h14M6.5 13h10" opacity=".45"/>',
 desc:'로고·글자가 가끔(또는 커서를 올릴 때) 빨강·초록·파랑 층으로 어긋나며 가로 띠 단위로 찢어지는 색수차 글리치를 일으킵니다. "신뢰하는 고객사" 로고 띠, 테크 브랜드 히어로, 404 페이지에 씁니다.',
 how:'같은 글자를 세 겹으로 겹치고 각각 빨강·초록·파랑만 남긴 뒤 mix-blend-mode: screen으로 합치면 평소에는 흰색으로 보입니다. 글리치 순간에는 층마다 다른 방향으로 몇 px 어긋나게 하고, clip-path: inset()으로 무작위 가로 띠만 잘라 옆으로 밀어 찢어진 느낌을 줍니다. 짧은 간격으로 여러 번 바꾼 뒤 원래대로 돌립니다.',
 params:[R('amt','어긋남',4,1,12,.5,'px'),R('every','자동 간격',2200,600,6000,100,'ms'),R('len','지속 시간',320,100,900,10,'ms')],
 build(st,p,c){const box=mk('div','',null,st);box.style.cssText='display:flex;flex-direction:column;align-items:center;gap:16px';mk('div','',`<span style="font:500 10px var(--f-mono);letter-spacing:.2em;color:var(--muted)">TRUSTED BY</span>`,box);const row=mk('div','',null,box);row.style.cssText='display:flex;gap:26px;flex-wrap:wrap;justify-content:center';
   const NM=[['NOVA','700 22px var(--f-display)'],['orbit','600 22px var(--f-body)'],['Lumen','400 24px var(--f-display)'],['KITE','800 20px var(--f-mono)']];
   const logos=NM.map(([t,f])=>{const w=mk('div','',null,row);w.style.cssText=`position:relative;font:${f};color:#fff;isolation:isolate;cursor:pointer`;mk('span','',t,w).style.visibility='hidden';const L=['#ff0000','#00ff00','#0000ff'].map(cl=>{const s=mk('span','',t,w);s.style.cssText=`position:absolute;inset:0;color:${cl};mix-blend-mode:screen`;return s;});w._L=L;return w;});
   const glitch=async w=>{if(w._busy)return;w._busy=1;const t0=performance.now();while(performance.now()-t0<p.len&&c.alive){w._L.forEach((s,i)=>{const a=p.amt*(Math.random()*2-1)*(i===1?.4:1);const y0=Math.random()*80,h=8+Math.random()*30;s.style.transform=`translate(${a.toFixed(1)}px,${(Math.random()-.5)*p.amt*.4}px)`;s.style.clipPath=Math.random()<.6?`inset(${y0}% 0 ${Math.max(0,100-y0-h)}% 0)`:'none';});await wait(45);}w._L.forEach(s=>{s.style.transform='';s.style.clipPath='';});w._busy=0;};
   logos.forEach(w=>w.addEventListener('pointerenter',()=>glitch(w)));
   return async cc=>{for(let i=0;i<logos.length;i++){if(!cc.alive)return;glitch(logos[i]);await wait(p.len+150);}await wait(+p.every);};},
 code:p=>`<span class="logo"><span class="r">NOVA</span><span class="g">NOVA</span><span class="b">NOVA</span></span>\n.logo span { position: absolute; inset: 0; mix-blend-mode: screen; }   /* 합치면 흰색 */\n.r { color: #f00 } .g { color: #0f0 } .b { color: #00f }\n// 글리치 ${p.len}ms 동안 45ms마다:\nlayer.style.transform = \`translate(\${rand(-${p.amt}, ${p.amt})}px, 0)\`;\nlayer.style.clipPath = \`inset(\${top}% 0 \${bottom}% 0)\`;   // 무작위 가로 띠만\n// 끝나면 transform·clipPath 초기화, ${p.every}ms마다 또는 hover 시 재생`,
 prompt:(p,t)=>`${t}에 색수차(RGB split) 글리치 효과를 넣어줘 (Bklit 홈페이지의 Chromatic glitch filter 로고 스타일).\n- 로고/글자를 빨강·초록·파랑 세 층으로 겹치고 mix-blend-mode: screen → 평소엔 흰색\n- 글리치 ${p.len}ms 동안 45ms마다 층별로 ±${p.amt}px 무작위 이동 + clip-path: inset()으로 무작위 가로 띠만 남겨 찢어지는 느낌\n- 호버 시 재생, 로고 띠 전체는 ${p.every}ms마다 하나씩 순서대로 자동 재생\n- SVG 로고라면 feColorMatrix로 채널 분리 + feOffset 사용, prefers-reduced-motion이면 끔.`}
);

const fitPv=pv=>{const w=pv.clientWidth;const inr=pv.querySelector('.pv-in');if(inr&&w)inr.style.transform=`scale(${w/400})`;};
function stopPreview(card){const c=card._c;if(!c)return;card._c=null;c.alive=false;(c.cl||[]).forEach(f=>{try{f();}catch(e){}});
  const inr=card.querySelector('.pv-in');if(inr){inr.querySelectorAll('canvas').forEach(cv=>{try{const g=cv.getContext('webgl')||cv.getContext('webgl2');const x=g&&g.getExtension('WEBGL_lose_context');if(x)x.loseContext();}catch(e){}});inr.getAnimations&&inr.getAnimations({subtree:true}).forEach(a=>{try{a.cancel();}catch(e){}});inr.innerHTML='';}}
function startPreview(card){if(card._c||!scrim.hidden||reduce.matches)return;const it=ITEMS.find(i=>i.id===card.dataset.id);if(!it)return;
  const pv=card.querySelector('.pv');let inr=pv.querySelector('.pv-in');if(!inr){inr=mk('div','pv-in',null,pv);}fitPv(pv);pv.classList.toggle('static',false);
  const c={alive:true,cl:[],on(f){this.cl.push(f);}};card._c=c;const v={};it.params.forEach(p=>v[p.k]=p.v);if(it.pv)Object.assign(v,it.pv);
  let fn=null;try{fn=it.build(inr,v,c)||null;}catch(e){console.warn('preview',it.id,e);return;}
  const go=()=>{if(!c.alive||!fn)return;let r;try{r=fn(c);}catch(e){return;}const d=r&&(r.finished?r.finished:r);if(d&&d.then)d.then(()=>{if(c.alive)setTimeout(go,900);},()=>{});};
  requestAnimationFrame(()=>requestAnimationFrame(go));}
function pausePreviews(){pvAll.forEach(stopPreview);}
function resumePreviews(){pvAll.forEach(cd=>{if(cd._vis&&cd.isConnected)startPreview(cd);});}
function renderList(){
  const term=q.value.trim().toLowerCase();
  pausePreviews();pvAll.clear();if(pvIO)pvIO.disconnect();if(pvRO)pvRO.disconnect();
  pvIO=new IntersectionObserver(es=>es.forEach(e=>{const cd=e.target;cd._vis=e.isIntersecting;clearTimeout(cd._t);if(e.isIntersecting)cd._t=setTimeout(()=>{if(cd._vis)startPreview(cd);},120);else stopPreview(cd);}),{rootMargin:'40px 0px'});
  pvRO=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>fitPv(e.target))):null;
  list.innerHTML='';
  const groups=CATS.slice(1).filter(([k])=>cat==='all'||cat===k);
  let shown=0;
  groups.forEach(([k,l,en])=>{
    const its=ITEMS.filter(i=>i.cat===k&&(!term||(i.ko+i.en+i.id+i.desc).toLowerCase().includes(term)));
    if(!its.length)return;shown+=its.length;
    mk('div','section-h',`<h2>${l}</h2><span>${en}</span><b class="cnt">${its.length}</b>`,list);
    const g=mk('div','grid cards',null,list);
    its.forEach(it=>{const t=mk('button','card2',`<div class="pv">${reduce.matches?`<div class="pv-still">${svgIcon(it)}</div>`:''}${it.isNew?'<span class="new">NEW</span>':''}</div><div class="cmeta"><span class="ic">${it.swatch?'':svgIcon(it)}</span><span class="nm"><span class="ko">${it.ko}</span><span class="en">${it.en}</span></span></div>`,g);
      t.dataset.id=it.id;t.setAttribute('aria-label',it.ko+' · '+it.en+' 열기');
      if(it.swatch){const ic=t.querySelector('.ic');ic.style.background=it.swatch;ic.classList.add('sw');}
      t.onclick=()=>openItem(it.id,t);pvAll.add(t);pvIO.observe(t);if(pvRO)pvRO.observe(t.querySelector('.pv'));});
  });
  if(!shown)mk('p','empty','검색 결과가 없습니다. 다른 이름이나 영어 이름으로 찾아보세요.',list);
}
window.addEventListener('resize',()=>pvAll.forEach(cd=>fitPv(cd.querySelector('.pv'))));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePreviews();else if(scrim.hidden)resumePreviews();});
q.addEventListener('input',renderList);

/* ───────── 상세 ───────── */
const scrim=$('#scrim'),stage=$('#stage'),ctrls=$('#ctrls'),hint=$('#hint');
let cur=null,vals={},ctx=null,playFn=null,playToken=0,loopOn=false,lastTile=null,deb=0;
const isTouch=matchMedia('(hover: none)').matches||navigator.maxTouchPoints>0&&!matchMedia('(hover: hover)').matches;
const TOUCH_IDS=['magnetic','tilt','spotlight','trail','kinetic','weight','lift','bot','liquidglass','frosted','stone','marble','sand','wood','paper','fabric','leather','brushed','holo'];
const touchHint=h=>h.replace('마우스를 올리거나 ','').replace('커서를 움직여보세요','손가락으로 끌어보세요').replace('커서를 지나가 보세요','손가락으로 쓸어보세요')
  .replace('마우스를 올려보세요','탭해보세요').replace('마우스를 올려도','탭해도').replace('마우스를 올리면','누르고 있으면').replace('눈이 커서를 따라옵니다','화면을 끌면 눈이 따라옵니다');
function newCtx(){if(ctx){ctx.alive=false;(ctx.cl||[]).forEach(f=>{try{f();}catch(e){}});}ctx={alive:true,cl:[],on(f){this.cl.push(f);}};return ctx;}
function runPlay(){
  const token=++playToken;if(!playFn)return;
  const r=playFn(ctx);const done=r&&(r.finished?r.finished:r);
  if(done&&done.then)done.then(()=>{if(loopOn&&token===playToken)setTimeout(()=>{if(token===playToken&&!scrim.hidden)runPlay();},600);}).catch(()=>{});
}
function rebuild(){
  const c=newCtx();
  stage.querySelectorAll('.st-in').forEach(n=>n.remove());
  const inner=mk('div','st-in');stage.insertBefore(inner,hint);
  playFn=cur.build(inner,vals,c)||null;
  requestAnimationFrame(()=>{if(c.alive)runPlay();});
  updateText();
}
function fmt(p,v){if(p.k==='to'&&p.max>1000)return Number(v).toLocaleString('ko-KR');const s=p.step<1?(+v).toFixed(String(p.step).split('.')[1].length):v;return s+(p.u?(p.u==='×'?'×':p.u):'');}
function renderCtrls(){
  ctrls.innerHTML='';
  cur.params.forEach(p=>{
    const row=mk('div','ctrl',null,ctrls);const id='p-'+cur.id+'-'+p.k;
    const lab=mk('label','',p.l,row);lab.htmlFor=id;
    if(p.type==='select'){const s=mk('select','',null,row);s.id=id;p.opts.forEach(([v,l])=>{const o=mk('option','',l,s);o.value=v;});s.value=vals[p.k];s.onchange=()=>{vals[p.k]=s.value;rebuild();};}
    else{const r=mk('input','',null,row);r.type='range';r.id=id;r.min=p.min;r.max=p.max;r.step=p.step;r.value=vals[p.k];const out=mk('output','',fmt(p,vals[p.k]),row);
      const pct=()=>r.style.setProperty('--pct',((r.value-p.min)/(p.max-p.min)*100)+'%');pct();
      r.oninput=()=>{vals[p.k]=+r.value;out.textContent=fmt(p,r.value);pct();updateText();clearTimeout(deb);deb=setTimeout(rebuild,140);};}
  });
}
function updateText(){
  $('#d-code').textContent=cur.code(vals);
  const t=$('#target').value.trim()||cur.target;
  let s=`[${cur.ko} · ${cur.en}]\n`+cur.prompt(vals,t);
  if($('#a11y').checked)s+=`\n\n공통 조건:\n- transform과 opacity 위주로 애니메이션해서 레이아웃 재계산을 피하고 60fps를 유지해줘.\n- prefers-reduced-motion: reduce 환경에서는 애니메이션을 끄거나 바로 최종 상태로 보여줘.\n- 데스크톱(마우스)과 모바일(터치) 모두에서 자연스럽게 동작하게 해줘.`;
  $('#d-prompt').textContent=s;
}
function openItem(id,tile){
  const it=ITEMS.find(i=>i.id===id);if(!it)return;
  cur=it;if(tile)lastTile=tile;pausePreviews();
  vals={};it.params.forEach(p=>vals[p.k]=p.v);
  {const ic=$('#d-ic');ic.innerHTML=it.swatch?'':svgIcon(it);ic.style.background=it.swatch||'';ic.classList.toggle('sw',!!it.swatch);}
  $('#d-name').textContent=it.ko;
  $('#d-meta').textContent=it.en.toUpperCase()+' · '+CATS.find(c=>c[0]===it.cat)[1]+(it.src?' · 참고 '+it.src:'');
  $('#d-desc').textContent=it.desc;$('#d-how').textContent=it.how;
  $('#target').value='';$('#target').placeholder=it.target;
  hint.hidden=!it.hint;hint.textContent=it.hint?'↳ '+(isTouch?touchHint(it.hint):it.hint):'';
  stage.classList.toggle('touch',TOUCH_IDS.includes(it.id)||!!it.touch);
  $('#copied').textContent='현재 조절값이 반영된 프롬프트입니다';
  const wasHidden=scrim.hidden;
  scrim.hidden=false;document.body.style.overflow='hidden';
  renderCtrls();rebuild();
  if(wasHidden){$('#close').focus({preventScroll:true});}
  scrim.querySelector('.sheet').scrollTop=0;
  try{history.replaceState(null,'','#'+id);}catch(e){}
}
function closeItem(){
  newCtx();playToken++;scrim.hidden=true;document.body.style.overflow='';
  stage.querySelectorAll('.st-in').forEach(n=>n.remove());
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(lastTile)lastTile.focus({preventScroll:true});
  setTimeout(resumePreviews,60);
}
function step(d){const i=ITEMS.indexOf(cur);openItem(ITEMS[(i+d+ITEMS.length)%ITEMS.length].id);}
$('#close').onclick=closeItem;$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
scrim.addEventListener('click',e=>{if(e.target===scrim)closeItem();});
document.addEventListener('keydown',e=>{if(scrim.hidden)return;if(e.key==='Escape')closeItem();
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});
$('#play').onclick=()=>rebuild();
$('#loop').onclick=e=>{loopOn=!loopOn;e.currentTarget.setAttribute('aria-pressed',loopOn);if(loopOn)rebuild();};
$('#reset').onclick=()=>{cur.params.forEach(p=>vals[p.k]=p.v);renderCtrls();rebuild();};
$('#target').addEventListener('input',updateText);$('#a11y').addEventListener('change',updateText);
$('#copy').onclick=()=>{const txt=$('#d-prompt').textContent;const ok=()=>{$('#copied').textContent='복사했습니다. AI 채팅창에 붙여 넣으세요.';};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents($('#d-prompt'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#copied').textContent='텍스트를 선택했습니다. Ctrl+C(⌘C)로 복사하세요.';};
  try{navigator.clipboard.writeText(txt).then(ok,fallback);}catch(e){fallback();}};

renderChips();renderList();
const h=(location.hash||'').slice(1);if(h&&ITEMS.some(i=>i.id===h))openItem(h);
})();
</script>
