<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0b">
<meta name="color-scheme" content="dark">
<meta name="description" content="반응형 애니메이션·컴포넌트·아이콘·이펙트·차트·재질·물리 시뮬레이션·헤어라인 도형 176가지를 미리보기, 조절바, 원리, AI 프롬프트와 함께 모은 도감">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="모션 도감">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html{background:#0b0a0b}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>
<title>반응형 애니메이션 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Marcellus&family=Outfit:wght@100..900&display=swap">
</head>
<body>
<style>
/* 레이아웃: 상단 타이틀 + 검색/분류 → 아이콘 그리드 → 아이콘 탭 시 상세 시트(미리보기·조절 / 설명·원리·프롬프트) */
:root{
  --bg:#0b0a0b;
  --surface:#141214;
  --surface-2:#1b181a;
  --line:#2a2427;
  --line-2:#3d3236;
  --fg:#efe6e7;
  --muted:#9a8c90;
  --rose:#dcaaac;
  --rose-hi:#f6dad7;
  --silver:#d2ccd0;
  --ink:#2a1d20;
  --metal:linear-gradient(135deg,#f7dfdb 0%,#c99a9e 30%,#eee8eb 52%,#b3878c 76%,#ecd3d2 100%);
  --f-display:"Marcellus","Gowun Batang",serif;
  --f-ko:"Gowun Batang","IBM Plex Sans KR",serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* iPhone · Safari 대응 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage.touch{touch-action:none}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
input[type=search]{-webkit-appearance:none;appearance:none}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:40px 80px}

/* 헤더 */
.top{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-ko);font-weight:700;font-size:clamp(30px,5.4vw,52px);line-height:1.15;text-wrap:balance;
  background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:0;color:var(--muted);max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 40px;outline:none}
.search input:focus{border-color:var(--rose)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .2s}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--metal);color:var(--ink);border-color:transparent;font-weight:600}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}

/* 그리드 */
.section-h{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.section-h h2{margin:0;font-family:var(--f-ko);font-size:19px;font-weight:700}
.section-h span{font-family:var(--f-display);color:var(--muted);font-size:14px;letter-spacing:.05em}
.section-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer;text-align:center;transition:border-color .25s,transform .25s cubic-bezier(.16,1,.3,1),background .25s}
.tile:focus-visible{border-color:var(--rose);background:var(--surface-2)}
@media (hover:hover){.tile:hover{border-color:var(--rose);background:var(--surface-2)}}
.tile:active{transform:scale(.97)}
.ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 30% 25%,#2a2225,#141113 70%)}
.ic::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1px;background:var(--metal);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75}
.ic svg{width:28px;height:28px;fill:none;stroke:url(#rsg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.tile .ko{font-weight:600;font-size:14px;line-height:1.3}
.tile .en{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;line-height:1.2}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* 상세 시트 */
.scrim{position:fixed;inset:0;background:rgba(5,4,5,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(1080px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column}
.sh-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:16px 18px;background:rgba(20,18,20,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.sh-head .ic{width:46px;height:46px;flex:none}
.sh-head .ic svg{width:24px;height:24px}
.sh-title{flex:1;min-width:0}
.sh-title h3{margin:0;font-family:var(--f-ko);font-size:21px;line-height:1.2}
.sh-title .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.iconbtn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--line-2)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sh-body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;padding:20px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.stage{position:relative;height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 35%,#231c1f 0%,#0f0d0e 70%),var(--bg)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(220,170,172,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(220,170,172,.05) 1px,transparent 1px);background-size:24px 24px}
.st-in{position:absolute;inset:0;display:grid;place-items:center}
.hint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--muted);font-family:var(--f-mono);pointer-events:none;z-index:3}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 15px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:13.5px;transition:all .2s}
.btn:hover{border-color:var(--rose);color:var(--rose-hi)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--metal);color:var(--ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.06);color:var(--ink)}
.btn[aria-pressed="true"]{border-color:var(--rose);color:var(--rose-hi);background:rgba(220,170,172,.1)}
.ctrls{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.ctrl{display:grid;grid-template-columns:92px minmax(0,1fr) 72px;align-items:center;gap:12px}
.ctrl label{font-size:13px;color:var(--muted)}
.ctrl output{font-family:var(--f-mono);font-size:12.5px;text-align:right;color:var(--rose-hi);font-variant-numeric:tabular-nums}
.ctrl select{grid-column:2 / 4;width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--rose) var(--pct,50%),var(--line-2) var(--pct,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--rose)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--metal);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--rose)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#e9c9c8;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--rose)}

.block h4{margin:0 0 6px;font-size:12px;font-family:var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}
.block p{margin:0;max-width:62ch}
.block p.sub{color:#cdbfc2}
pre.code{margin:10px 0 0;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-family:var(--f-mono);font-size:12px;line-height:1.6;color:var(--silver);overflow-x:auto;white-space:pre}
.prompt-box{border:1px solid var(--line-2);border-radius:14px;background:var(--bg);overflow:hidden}
.pb-opts{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.pb-opts label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pb-opts input[type=text]{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 9px;font-size:13px;width:140px;outline:none}
.pb-opts input[type=text]:focus{border-color:var(--rose)}
.pb-opts input[type=checkbox]{accent-color:var(--rose)}
.prompt{margin:0;padding:14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:13.5px;line-height:1.7;color:var(--fg);max-height:300px;overflow:auto}
.pb-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.pb-foot small{color:var(--muted);font-size:12px}

/* 미리보기 오브젝트 */
.obj{width:84px;height:84px;border-radius:20px;background:var(--metal);position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -8px 18px rgba(120,70,76,.35),0 14px 30px rgba(0,0,0,.55)}
.obj::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);pointer-events:none}
.obj.round{border-radius:50%}
.obj svg{position:absolute;inset:0;margin:auto;width:46%;height:46%;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.metal-text{font-family:var(--f-display);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.fake-input{width:min(260px,80%);padding:12px 16px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-size:14px;color:var(--muted)}
.fake-input b{display:block;font-size:11px;color:#e27d84;font-weight:500;margin-top:2px}
.card{width:min(240px,78%);border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden;position:relative}
.card .ph{height:96px;background:var(--metal)}
.card .tx{padding:12px 14px}
.card .tx b{display:block;font-size:14px}
.card .tx span{font-size:12px;color:var(--muted)}
.pbtn{border:0;border-radius:999px;padding:14px 30px;background:var(--metal);color:var(--ink);font-weight:600;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wave{position:absolute;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none;width:20px;height:20px;margin:-10px 0 0 -10px}
.sw{width:76px;height:42px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;border:0;padding:0}
.sw i{position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:#e8e2e4;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.sw.on{background:var(--rose)}
.ring{border-radius:50%;border-style:solid;border-color:rgba(220,170,172,.18);border-top-color:var(--rose-hi)}
.sk{width:min(260px,82%);display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.sk .row{display:flex;gap:12px;align-items:center}
.sk .b{border-radius:8px;background-color:#221d1f;background-size:200% 100%}
.track{width:min(300px,82%);height:10px;border-radius:999px;background:var(--line-2);overflow:hidden}
.track i{display:block;height:100%;width:100%;background:var(--metal);transform-origin:left;transform:scaleX(0)}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 22px}
.rv{height:66px;margin-bottom:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);display:flex;align-items:center;gap:12px;padding:0 14px;font-size:13px;color:var(--muted)}
.rv i{width:36px;height:36px;border-radius:9px;background:var(--metal);flex:none}
.mq{width:100%;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-t{display:flex;width:max-content}
.mq-t span{font-family:var(--f-display);font-size:28px;white-space:nowrap;display:flex;align-items:center}
.mq-t span::after{content:"✦";font-size:14px;color:var(--rose);margin-left:var(--gap)}

.tile{position:relative}
.tile .new{position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink);background:var(--metal);border-radius:999px;padding:1px 6px;line-height:1.5}
/* 신규 항목 */
.beamw{position:relative;width:min(270px,80%);border-radius:18px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.bring{position:absolute;inset:0;border-radius:inherit;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.beam-glow{position:absolute;inset:0;border-radius:inherit;filter:blur(10px);pointer-events:none}
.beam-in{position:relative;padding:22px 22px 24px;display:flex;flex-direction:column;gap:4px}
.beam-in small{font-family:var(--f-mono);font-size:11px;color:var(--rose);letter-spacing:.12em}
.beam-in b{font-family:var(--f-ko);font-size:22px}
.beam-in span{font-size:13px;color:var(--muted)}
.orb-ball{position:relative;width:130px;height:130px;border-radius:50%;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 35% 30%,#2a2023,#0e0b0c 75%);box-shadow:inset 0 0 0 1px rgba(246,218,215,.18),0 20px 50px rgba(0,0,0,.6)}
.shimmer-text{font-size:14px;background:linear-gradient(90deg,var(--muted) 0%,var(--rose-hi) 50%,var(--muted) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.metal-btn{position:relative;overflow:hidden;border:0;border-radius:999px;padding:18px 40px;font-family:var(--f-display);font-size:20px;letter-spacing:.06em;color:var(--ink);cursor:pointer;
  background:linear-gradient(110deg,#7a5c61,#f7dfdb 12%,#a8868b 22%,#ffffff 32%,#b3878c 44%,#efd6d5 56%,#7a5c61 66%,#f4e9eb 78%,#a8868b 90%,#7a5c61);background-size:600px 100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -6px 14px rgba(80,40,46,.45),0 14px 30px rgba(0,0,0,.55)}
.metal-btn .sheen{position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);mix-blend-mode:overlay;pointer-events:none}
.bot{position:relative;width:128px;height:112px;border-radius:36px;background:var(--metal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -10px 22px rgba(120,70,76,.35),0 18px 36px rgba(0,0,0,.55)}
.bot-ant{position:absolute;top:-16px;left:50%;width:2px;height:16px;margin-left:-1px;background:#d9b5b6}
.bot-ant::after{content:"";position:absolute;top:-8px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--rose-hi);box-shadow:0 0 12px var(--rose)}
.bot-eyes{display:flex;gap:26px;align-items:flex-end;height:20px;transition:transform .2s ease-out}
.bot-eyes i{display:block;width:14px;height:20px;border-radius:7px;background:var(--ink)}
.bot.happy .bot-eyes i{width:18px;height:10px;background:transparent;border:3.5px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0}
.bot-mouth{display:block;width:26px;height:6px;border-radius:6px;background:var(--ink)}
.bot.happy .bot-mouth{height:11px;border-radius:0 0 14px 14px}
.bot-dots{position:absolute;left:calc(50% + 58px);top:calc(50% - 84px);display:flex;gap:4px}
.bot-dots i{display:block;width:7px;height:7px;border-radius:50%;background:var(--rose-hi)}
.spot{position:absolute;inset:0;overflow:hidden}
.spot-l{position:absolute;inset:0;padding:16px}
.spot-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:10px;height:100%}
.spot-grid div{border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;min-width:0}
.spot-l.lo .spot-grid div{border:1px solid #201b1d;color:#352b2f}
.spot-l.hi .spot-grid div{border:1px solid var(--rose);color:var(--rose-hi);background:rgba(220,170,172,.07)}
.spot-grid b{font-family:var(--f-ko);font-size:15px}
.spot-grid span{font-family:var(--f-mono);font-size:11px}
.spot-glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.sbtn{position:relative;width:180px;height:52px;border:0;border-radius:26px;background:#2a2427;color:var(--fg);font-weight:600;font-size:15px;cursor:pointer;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rose),0 10px 24px rgba(0,0,0,.45)}
.sbtn > *{grid-area:1/1}
.sbtn .t{white-space:nowrap}
.sbtn .sp{display:block;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(220,170,172,.25);border-top-color:var(--rose-hi)}
.sbtn .ck{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.seg{position:relative;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2)}

 how:'opacity를 0에서 1로 보간합니다. opacity는 GPU 합성 단계에서만 처리되어 레이아웃과 페인트를 다시 하지 않기 때문에 가장 가벼운 애니메이션입니다. 끝부분이 느려지는 감속형 이징이 자연스럽습니다.',
 params:[DUR(600),EASE('out')],
 build(st,p){const o=obj(st);return()=>anim(o,[{opacity:0},{opacity:1}],p);},
 code:p=>`.fade-in {\n  animation: fadeIn ${p.dur}ms ${ez(p.ease)} both;\n}\n@keyframes fadeIn {\n  from { opacity: 0; }\n  to   { opacity: 1; }\n}`,
 prompt:(p,t)=>`${t}이(가) 화면에 나타날 때 페이드 인 애니메이션을 넣어줘.\n- 투명도: opacity 0 → 1\n- 지속시간: ${p.dur}ms\n- 이징: ${ez(p.ease)}\n- opacity만 애니메이션하고 위치나 크기는 바꾸지 마.`},

{id:'slide-up',cat:'in',ko:'슬라이드 업',en:'Slide Up',mini:'up',target:'카드',
 icon:'<rect x="6" y="12" width="12" height="7" rx="1.5"/><path d="M12 9V3M9 6l3-3 3 3"/>',
 desc:'아래에서 살짝 떠오르며 나타납니다. 카드 목록, 섹션 제목, 바텀시트 콘텐츠에 가장 많이 쓰는 등장 방식입니다.',
 how:'transform: translateY(거리)에서 0으로, opacity 0에서 1로 동시에 보간합니다. top이나 margin 대신 transform을 써야 주변 요소가 밀리지 않고 60fps를 유지합니다. 거리는 16~40px 정도가 과하지 않습니다.',
 params:[DUR(700),R('dist','이동 거리',32,0,150,1,'px'),EASE('expo')],
 build(st,p){const o=obj(st);return()=>anim(o,[{opacity:0,transform:`translateY(${p.dist}px)`},{opacity:1,transform:'none'}],p);},
 code:p=>`.slide-up {\n  animation: slideUp ${p.dur}ms ${ez(p.ease)} both;\n}\n@keyframes slideUp {\n  from { opacity: 0; transform: translateY(${p.dist}px); }\n  to   { opacity: 1; transform: none; }\n}`,
 prompt:(p,t)=>`${t}이(가) 아래에서 위로 떠오르며 나타나는 슬라이드 업 애니메이션을 만들어줘.\n- 시작: translateY(${p.dist}px), opacity 0\n- 끝: translateY(0), opacity 1\n- 지속시간: ${p.dur}ms, 이징: ${ez(p.ease)}\n- top/margin이 아니라 transform으로 움직여서 주변 레이아웃이 밀리지 않게 해줘.`},

{id:'scale-in',cat:'in',ko:'스케일 인',en:'Scale In',mini:'pop',target:'팝업',
 icon:'<rect x="9" y="9" width="6" height="6" rx="1"/><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/>',
 desc:'작은 크기에서 원래 크기로 커지며 등장합니다. 팝업, 아이콘, 알림 배지처럼 툭 튀어나와야 하는 요소에 맞습니다.',
 how:'transform: scale(시작값)에서 scale(1)로 보간합니다. Back Out 이징(1을 살짝 넘었다가 돌아오는 곡선)을 쓰면 탄성이 생깁니다. transform-origin으로 커지는 기준점을 바꿀 수 있습니다.',
 params:[DUR(500),R('from','시작 크기',.6,0,1,.05,'×'),EASE('back')],
 build(st,p){const o=obj(st);return()=>anim(o,[{opacity:0,transform:`scale(${p.from})`},{opacity:1,transform:'scale(1)'}],p);},
 code:p=>`.scale-in {\n  animation: scaleIn ${p.dur}ms ${ez(p.ease)} both;\n}\n@keyframes scaleIn {\n  from { opacity: 0; transform: scale(${p.from}); }\n  to   { opacity: 1; transform: scale(1); }\n}`,
 prompt:(p,t)=>`${t}이(가) 작게 시작해서 원래 크기로 커지며 나타나는 스케일 인 애니메이션을 넣어줘.\n- 시작: scale(${p.from}), opacity 0 → 끝: scale(1), opacity 1\n- 지속시간: ${p.dur}ms, 이징: ${ez(p.ease)}\n- 중심(transform-origin: center)에서 커지게 해줘.`},

{id:'blur-in',cat:'in',ko:'블러 인',en:'Blur In',mini:'blur',target:'히어로 타이틀',
 icon:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6" opacity=".55"/><circle cx="12" cy="12" r="9" opacity=".25"/>',
 desc:'흐릿한 상태에서 초점이 맞듯 선명해집니다. 히어로 이미지나 큰 타이틀처럼 분위기를 만들어야 하는 곳에 씁니다.',
 how:'filter: blur(n px)에서 blur(0)으로, opacity와 약간의 scale을 함께 보간합니다. blur는 픽셀마다 계산이 필요해 opacity보다 무거우므로 큰 요소 여러 개에 동시에 쓰지 않는 것이 좋습니다.',
 params:[DUR(900),R('blur','블러 강도',14,0,40,1,'px'),EASE('out')],
 build(st,p){const o=mk('div','metal-text','Rose Silver',st);o.style.fontSize='42px';return()=>anim(o,[{opacity:0,filter:`blur(${p.blur}px)`,transform:'scale(1.06)'},{opacity:1,filter:'blur(0)',transform:'scale(1)'}],p);},
 code:p=>`.blur-in {\n  animation: blurIn ${p.dur}ms ${ez(p.ease)} both;\n}\n@keyframes blurIn {\n  from { opacity: 0; filter: blur(${p.blur}px); transform: scale(1.06); }\n  to   { opacity: 1; filter: blur(0);  transform: scale(1); }\n}`,
 prompt:(p,t)=>`${t}이(가) 흐릿한 상태에서 선명해지며 나타나는 블러 인 효과를 만들어줘.\n- 시작: filter blur(${p.blur}px), opacity 0, scale(1.06)\n- 끝: blur(0), opacity 1, scale(1)\n- 지속시간: ${p.dur}ms, 이징: ${ez(p.ease)}\n- blur는 무거우니 이 요소에만 적용하고 끝나면 will-change를 해제해줘.`},

{id:'flip-in',cat:'in',ko:'3D 플립',en:'Flip In',mini:'flip',target:'카드',
 icon:'<path d="M7 5l10 2v10l-10 2z"/><path d="M12 2v20" stroke-dasharray="2 2"/>',
 desc:'카드가 3D 축을 중심으로 돌아서며 나타납니다. 카드 뒤집기, 단계 전환, 정답 공개에 어울립니다.',
 how:'perspective()로 원근감을 만든 뒤 rotateX 또는 rotateY 각도를 0으로 보간합니다. perspective 값이 작을수록 왜곡이 강해집니다. 뒷면이 비치지 않게 하려면 backface-visibility: hidden을 씁니다.',
 params:[DUR(800),R('angle','회전 각도',90,0,180,1,'°'),R('persp','원근 거리',800,200,2000,10,'px'),SEL('axis','회전 축','X',[['X','X축 (위아래로 뒤집기)'],['Y','Y축 (좌우로 뒤집기)']]),EASE('expo')],
 build(st,p){const o=obj(st);o.style.width='120px';return()=>anim(o,[{opacity:0,transform:`perspective(${p.persp}px) rotate${p.axis}(${p.angle}deg)`},{opacity:1,transform:`perspective(${p.persp}px) rotate${p.axis}(0deg)`}],p);},
 code:p=>`.flip-in {\n  backface-visibility: hidden;\n  animation: flipIn ${p.dur}ms ${ez(p.ease)} both;\n}\n@keyframes flipIn {\n  from { opacity: 0; transform: perspective(${p.persp}px) rotate${p.axis}(${p.angle}deg); }\n  to   { opacity: 1; transform: perspective(${p.persp}px) rotate${p.axis}(0); }\n}`,
 prompt:(p,t)=>`${t}이(가) 3D로 회전하면서 나타나는 플립 인 애니메이션을 만들어줘.\n- 회전 축: ${p.axis}축, 시작 각도 ${p.angle}deg → 0deg\n- perspective: ${p.persp}px\n- opacity 0 → 1 동시 적용\n- 지속시간: ${p.dur}ms, 이징: ${ez(p.ease)}\n- backface-visibility: hidden으로 뒷면이 비치지 않게 해줘.`},

{id:'stagger',cat:'in',ko:'순차 등장',en:'Stagger',mini:'up',target:'리스트 항목',
 icon:'<rect x="4" y="14" width="3.5" height="6" rx="1"/><rect x="10.25" y="10" width="3.5" height="10" rx="1"/><rect x="16.5" y="6" width="3.5" height="14" rx="1"/>',
 desc:'여러 요소가 시간차를 두고 하나씩 나타납니다. 리스트, 메뉴, 갤러리 그리드에 리듬감을 줍니다.',
 how:'모든 요소에 같은 애니메이션을 주고 delay만 순번 × 간격으로 늘립니다. CSS 변수 --i에 순번을 넣고 calc(var(--i) * 간격)으로 계산하면 간단합니다. 전체 시간은 지속시간 + (개수 − 1) × 간격이므로 개수가 많으면 간격을 줄입니다.',
 params:[R('count','개수',5,2,8,1,'개'),R('gap','간격',90,0,300,5,'ms'),DUR(550),R('dist','이동 거리',24,0,80,1,'px'),EASE('expo')],
 build(st,p){const box=mk('div','',null,st);box.style.cssText='display:flex;flex-direction:column;gap:8px;width:min(260px,80%)';const els=[];for(let i=0;i<p.count;i++){const r=mk('div','',null,box);r.style.cssText='height:22px;border-radius:7px;background:var(--metal);width:'+(100-i*7)+'%';els.push(r);}
   return()=>Promise.all(els.map((el,i)=>anim(el,[{opacity:0,transform:`translateY(${p.dist}px)`},{opacity:1,transform:'none'}],p,{delay:i*p.gap}).finished));},
 code:p=>`.item {\n  animation: rise ${p.dur}ms ${ez(p.ease)} both;\n  animation-delay: calc(var(--i) * ${p.gap}ms);\n}\n@keyframes rise {\n  from { opacity: 0; transform: translateY(${p.dist}px); }\n}\n/* <li style="--i:0">, <li style="--i:1"> ... */`,
 prompt:(p,t)=>`${t}들이 위에서부터 차례대로 나타나는 순차 등장(stagger) 애니메이션을 만들어줘.\n- 각 항목: translateY(${p.dist}px)·opacity 0 → 제자리·opacity 1\n- 항목당 지속시간 ${p.dur}ms, 이징 ${ez(p.ease)}\n- 항목 간 시간차: ${p.gap}ms (CSS 변수 --i에 순번을 넣어 calc로 delay 계산)\n- 항목 수가 많아도 전체가 1.5초를 넘지 않게 최대 delay를 제한해줘.`},

{id:'clip',cat:'in',ko:'마스크 리빌',en:'Clip Reveal',mini:'slide',target:'헤드라인',
 icon:'<rect x="4" y="5" width="16" height="14" rx="2"/><rect x="4" y="5" width="8" height="14" rx="2" fill="url(#rsg)" opacity=".45" stroke="none"/>',
 desc:'보이지 않는 마스크가 걷히면서 요소가 드러납니다. 헤드라인, 이미지 공개, 섹션 전환에 고급스러운 느낌을 줍니다.',
 how:'clip-path로 요소의 보이는 영역을 잘라낸 뒤 그 영역을 넓혀갑니다. 예를 들어 inset(0 100% 0 0)에서 inset(0)으로 바꾸면 왼쪽부터 드러납니다. 요소는 움직이지 않고 보이는 범위만 바뀌므로 레이아웃에 영향이 없습니다.',
 params:[DUR(1000),SEL('dir','방향','left',[['left','왼쪽 → 오른쪽'],['up','아래 → 위'],['circle','중앙 원형 확장']]),EASE('inout')],
 build(st,p){const o=mk('div','',null,st);o.style.cssText='padding:22px 30px;border-radius:14px;background:var(--metal);color:var(--ink);font-family:var(--f-display);font-size:34px;letter-spacing:.04em';o.textContent='REVEAL';
   const from={left:'inset(0 100% 0 0)',up:'inset(100% 0 0 0)',circle:'circle(0% at 50% 50%)'}[p.dir];const to=p.dir==='circle'?'circle(75% at 50% 50%)':'inset(0 0 0 0)';
   return()=>anim(o,[{clipPath:from},{clipPath:to}],p);},
 code:p=>{const from={left:'inset(0 100% 0 0)',up:'inset(100% 0 0 0)',circle:'circle(0% at 50% 50%)'}[p.dir];const to=p.dir==='circle'?'circle(75% at 50% 50%)':'inset(0)';return `.reveal {\n  animation: reveal ${p.dur}ms ${ez(p.ease)} both;\n}\n@keyframes reveal {\n  from { clip-path: ${from}; }\n  to   { clip-path: ${to}; }\n}`;},
 prompt:(p,t)=>{const d={left:'왼쪽에서 오른쪽으로',up:'아래에서 위로',circle:'중앙에서 원형으로 퍼지며'}[p.dir];return `${t}이(가) ${d} 드러나는 마스크 리빌 애니메이션을 clip-path로 만들어줘.\n- 방향: ${d} (clip-path ${p.dir==='circle'?'circle(0%) → circle(75%)':'inset 값을 0으로'})\n- 지속시간: ${p.dur}ms, 이징: ${ez(p.ease)}\n- 요소 위치는 고정하고 보이는 영역만 바뀌게 해줘.`;}},

/* ───────── 강조 ───────── */
{id:'pulse',cat:'em',ko:'펄스',en:'Pulse',mini:'pulse',target:'라이브 배지',
 icon:'<circle cx="12" cy="12" r="4" fill="url(#rsg)"/><circle cx="12" cy="12" r="8" opacity=".5"/>',
 desc:'커졌다 작아지며 주변으로 파동이 퍼집니다. 라이브 표시, 새 알림, 녹음 중 버튼처럼 지금 활성 상태임을 알립니다.',
 how:'scale을 1 → 최대 → 1로 반복하고, 동시에 box-shadow의 spread를 0에서 n px로 키우면서 색 투명도를 0으로 낮춰 퍼지는 링을 만듭니다. iteration-count를 infinite로 둡니다.',
 params:[DUR(1400,400,4000),R('scale','최대 크기',1.08,1,1.5,.01,'×'),R('ring','파동 크기',22,0,60,1,'px')],
 build(st,p){const o=obj(st,'round');o.style.width=o.style.height='70px';return()=>{o.animate([{transform:'scale(1)',boxShadow:`0 0 0 0 ${RS}.55)`},{transform:`scale(${p.scale})`,offset:.5},{transform:'scale(1)',boxShadow:`0 0 0 ${p.ring}px ${RS}0)`}],{duration:+p.dur,iterations:Infinity,easing:'ease-out'});return null;};},
 code:p=>`.pulse {\n  animation: pulse ${p.dur}ms ease-out infinite;\n}\n@keyframes pulse {\n  0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,184,186,.55); }\n  50%  { transform: scale(${p.scale}); }\n  100% { transform: scale(1); box-shadow: 0 0 0 ${p.ring}px rgba(232,184,186,0); }\n}`,
 prompt:(p,t)=>`${t}에 무한 반복되는 펄스 애니메이션을 넣어줘.\n- 크기: scale 1 → ${p.scale} → 1\n- 파동: box-shadow spread 0 → ${p.ring}px로 퍼지면서 투명해지게\n- 한 주기: ${p.dur}ms, ease-out, infinite\n- 탭에 포커스가 없을 때(visibilitychange)는 애니메이션을 멈춰줘.`},

{id:'shake',cat:'em',ko:'쉐이크',en:'Shake',mini:'shake',target:'비밀번호 입력창',
 icon:'<rect x="7" y="6" width="10" height="12" rx="2"/><path d="M3 9v6M21 9v6"/>',
 desc:'좌우로 빠르게 흔들려 잘못됐다는 신호를 줍니다. 로그인 실패, 잘못된 입력, 비활성 버튼 클릭에 씁니다.',
 how:'translateX를 −진폭, +진폭으로 번갈아 주면서 점점 줄이는 감쇠 키프레임을 만듭니다. 지속시간은 300~600ms가 적당하고 한 번만 재생합니다. 색 변화(빨간 테두리)와 함께 쓰면 의미가 더 분명해집니다.',
 params:[DUR(480,150,1500),R('amp','흔들림 폭',10,2,30,1,'px')],
 build(st,p){const o=mk('div','fake-input','••••••<b>비밀번호가 일치하지 않습니다</b>',st);
   return()=>{const a=p.amp;return o.animate([{transform:'translateX(0)',borderColor:'#e27d84'},{transform:`translateX(${-a}px)`},{transform:`translateX(${a}px)`},{transform:`translateX(${-a*.6}px)`},{transform:`translateX(${a*.6}px)`},{transform:`translateX(${-a*.3}px)`},{transform:'translateX(0)',borderColor:'#e27d84'}],{duration:+p.dur,easing:'ease-in-out'});};},
 code:p=>`.shake {\n  animation: shake ${p.dur}ms ease-in-out;\n}\n@keyframes shake {\n  20% { transform: translateX(-${p.amp}px); }\n  40% { transform: translateX(${p.amp}px); }\n  60% { transform: translateX(-${(p.amp*.6).toFixed(1)}px); }\n  80% { transform: translateX(${(p.amp*.6).toFixed(1)}px); }\n}`,
 prompt:(p,t)=>`검증에 실패하면 ${t}이(가) 좌우로 흔들리는 쉐이크 애니메이션을 넣어줘.\n- 흔들림 폭: ±${p.amp}px에서 시작해 점점 줄어들게(감쇠)\n- 지속시간: ${p.dur}ms, 1회만 재생\n- 흔들리는 동안 테두리를 빨간색으로 바꾸고 에러 메시지를 함께 보여줘.\n- 다시 실패하면 클래스를 제거했다 다시 붙여 재생되게 해줘.`},

{id:'bounce',cat:'em',ko:'바운스',en:'Bounce',mini:'bounce',target:'스크롤 유도 아이콘',
 icon:'<circle cx="12" cy="7" r="3.5"/><path d="M4 20h16"/><path d="M12 12.5v4" stroke-dasharray="1.5 1.5"/>',
 desc:'공처럼 튀어 오르고 착지할 때 찌그러집니다. 스크롤 유도 화살표, 캐릭터, 장바구니 담기 피드백에 생동감을 줍니다.',
 how:'올라갈 때는 감속, 떨어질 때는 가속 곡선을 구간별로 지정해 중력처럼 보이게 합니다. 착지 순간 scale(1.15, 0.85)로 납작하게 만드는 스쿼시 & 스트레치가 핵심이고, 바닥 그림자를 높이에 따라 줄이면 공간감이 생깁니다.',
 params:[DUR(900,300,2500),R('h','점프 높이',70,10,140,1,'px'),R('squash','찌그러짐',.15,0,.35,.01,'')],
 build(st,p){const g=mk('div','',null,st);g.style.cssText='display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateY(40px)';const o=obj(g,'round');o.style.width=o.style.height='56px';o.style.transformOrigin='50% 100%';const sh=mk('div','',null,g);sh.style.cssText='width:56px;height:8px;border-radius:50%;background:rgba(0,0,0,.55)';
   return()=>{const s=+p.squash;o.animate([{transform:`translateY(0) scale(${1+s},${1-s})`,easing:'cubic-bezier(.33,1,.68,1)'},{transform:`translateY(-${p.h}px) scale(${1-s/3},${1+s/3})`,offset:.45,easing:'cubic-bezier(.32,0,.67,0)'},{transform:`translateY(0) scale(${1+s},${1-s})`,offset:.9},{transform:`translateY(0) scale(${1+s},${1-s})`}],{duration:+p.dur,iterations:Infinity});
     sh.animate([{transform:'scale(1)',opacity:1,easing:'cubic-bezier(.33,1,.68,1)'},{transform:'scale(.5)',opacity:.35,offset:.45,easing:'cubic-bezier(.32,0,.67,0)'},{transform:'scale(1)',opacity:1,offset:.9},{transform:'scale(1)',opacity:1}],{duration:+p.dur,iterations:Infinity});return null;};},
 code:p=>`.bounce {\n  transform-origin: 50% 100%;\n  animation: bounce ${p.dur}ms infinite;\n}\n@keyframes bounce {\n  0%, 90%, 100% { transform: translateY(0) scale(${1+ +p.squash}, ${(1-p.squash).toFixed(2)});\n                  animation-timing-function: cubic-bezier(.33,1,.68,1); }\n  45% { transform: translateY(-${p.h}px);\n        animation-timing-function: cubic-bezier(.32,0,.67,0); }\n}`,
 prompt:(p,t)=>`${t}이(가) 공처럼 통통 튀는 바운스 애니메이션을 무한 반복으로 만들어줘.\n- 점프 높이: ${p.h}px, 한 주기 ${p.dur}ms\n- 올라갈 때 ease-out, 내려올 때 ease-in으로 중력 느낌\n- 착지 순간 scale(${(1+ +p.squash).toFixed(2)}, ${(1-p.squash).toFixed(2)})로 찌그러지는 스쿼시 & 스트레치, transform-origin은 아래쪽 중앙\n- 아래 그림자가 높이에 따라 작아졌다 커지게 해줘.`},

{id:'swing',cat:'em',ko:'스윙',en:'Swing',mini:'swing',target:'알림 종 아이콘',
 icon:'<path d="M12 3v2"/><path d="M7 16c0-6 2-10 5-10s5 4 5 10z"/><path d="M5 16h14M10.5 19h3"/>',
 desc:'위쪽을 축으로 시계추처럼 흔들립니다. 알림 종 아이콘, 매달린 태그, 새 메시지 주의 끌기에 씁니다.',
 how:'transform-origin을 상단 중앙으로 옮기고 rotate 각도를 +, −로 번갈아 주면서 점점 줄입니다. 회전 축 위치만 바꿔도 같은 회전이 전혀 다른 움직임이 됩니다.',
 params:[DUR(900,200,2500),R('angle','흔들림 각도',15,2,40,1,'°')],
 build(st,p){const o=obj(st,'',BELL);o.style.transformOrigin='50% 0';return()=>{const a=p.angle;return o.animate([{transform:'rotate(0)'},{transform:`rotate(${a}deg)`},{transform:`rotate(${-a*.8}deg)`},{transform:`rotate(${a*.55}deg)`},{transform:`rotate(${-a*.3}deg)`},{transform:`rotate(${a*.12}deg)`},{transform:'rotate(0)'}],{duration:+p.dur,easing:'ease-in-out'});};},
 code:p=>`.swing {\n  transform-origin: 50% 0;\n  animation: swing ${p.dur}ms ease-in-out;\n}\n@keyframes swing {\n  17% { transform: rotate(${p.angle}deg); }\n  33% { transform: rotate(-${(p.angle*.8).toFixed(1)}deg); }\n  50% { transform: rotate(${(p.angle*.55).toFixed(1)}deg); }\n  67% { transform: rotate(-${(p.angle*.3).toFixed(1)}deg); }\n  83% { transform: rotate(${(p.angle*.12).toFixed(1)}deg); }\n}`,
 prompt:(p,t)=>`새 알림이 오면 ${t}이(가) 위쪽을 축으로 흔들리는 스윙 애니메이션을 넣어줘.\n- transform-origin: 위쪽 중앙\n- 회전: ±${p.angle}deg에서 시작해 점점 줄어들며 멈추게\n- 지속시간: ${p.dur}ms, ease-in-out, 1회 재생\n- 새 알림이 올 때마다 다시 재생되게 해줘.`},

{id:'glow',cat:'em',ko:'글로우',en:'Glow',mini:'pulse',target:'구매 버튼',
 icon:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
 desc:'요소 주변이 은은하게 빛났다 사그라들기를 반복합니다. CTA 버튼, 프리미엄 배지, 선택된 항목 강조에 씁니다.',
 how:'box-shadow의 블러 반경과 색 투명도를 alternate 방향으로 반복 보간합니다. box-shadow 애니메이션은 매 프레임 다시 그려지므로, 여러 요소에 쓸 때는 그림자를 가상요소(::after)에 고정하고 그 opacity만 바꾸는 방식이 더 가볍습니다.',
 params:[DUR(1800,400,5000),R('r','빛 반경',28,4,70,1,'px'),R('alpha','밝기',.6,.1,1,.05,'')],
 build(st,p){const b=mk('button','pbtn','구매하기',st);return()=>{b.animate([{boxShadow:`0 0 ${p.r*.25}px ${RS}${p.alpha*.25})`},{boxShadow:`0 0 ${p.r}px ${p.r*.2}px ${RS}${p.alpha})`}],{duration:+p.dur,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});return null;};},
 code:p=>`.glow {\n  animation: glow ${p.dur}ms ease-in-out infinite alternate;\n}\n@keyframes glow {\n  from { box-shadow: 0 0 ${(p.r*.25).toFixed(0)}px rgba(232,184,186,${(p.alpha*.25).toFixed(2)}); }\n  to   { box-shadow: 0 0 ${p.r}px ${(p.r*.2).toFixed(0)}px rgba(232,184,186,${p.alpha}); }\n}`,
 prompt:(p,t)=>`${t} 주변이 은은하게 빛났다 사그라드는 글로우 효과를 넣어줘.\n- 색: 로즈 핑크 rgba(232,184,186)\n- 빛 반경: 최대 ${p.r}px, 최대 불투명도 ${p.alpha}\n- 한 방향 ${p.dur}ms, ease-in-out, alternate로 무한 반복\n- 성능을 위해 box-shadow는 ::after 가상요소에 고정하고 opacity만 애니메이션해줘.`},

{id:'heartbeat',cat:'em',ko:'하트비트',en:'Heartbeat',mini:'pulse',target:'좋아요 아이콘',
 icon:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
 desc:'두 번 연속 쿵쿵 뛰고 쉬는 리듬입니다. 좋아요, 찜하기, 라이브 하트처럼 감정이 담긴 반응에 씁니다.',
 how:'한 주기 안에 scale 피크를 두 번(14%, 42% 지점) 넣고 나머지 구간은 쉬게 하는 키프레임 offset 설계입니다. 단순 펄스와 달리 쿵-쿵, 쉼의 리듬이 생깁니다.',
 params:[DUR(1300,500,3000),R('scale','뛰는 크기',1.22,1,1.6,.01,'×')],
 build(st,p){const o=mk('div','',HEART,st);o.style.cssText='width:96px;height:96px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))';return()=>{const s=p.scale;o.animate([{transform:'scale(1)'},{transform:`scale(${s})`,offset:.14},{transform:'scale(1)',offset:.28},{transform:`scale(${s})`,offset:.42},{transform:'scale(1)',offset:.7},{transform:'scale(1)'}],{duration:+p.dur,iterations:Infinity,easing:'ease-in-out'});return null;};},
 code:p=>`.heartbeat {\n  animation: beat ${p.dur}ms ease-in-out infinite;\n}\n@keyframes beat {\n  0%, 28%, 70%, 100% { transform: scale(1); }\n  14%, 42%           { transform: scale(${p.scale}); }\n}`,
 prompt:(p,t)=>`${t}에 두 번 연속 뛰고 쉬는 하트비트 애니메이션을 넣어줘.\n- 키프레임: 0% 1 → 14% ${p.scale} → 28% 1 → 42% ${p.scale} → 70~100% 1\n- 한 주기: ${p.dur}ms, ease-in-out, infinite\n- 좋아요를 누르는 순간에는 한 번 더 크게 튀는 효과를 추가해줘.`},

/* ───────── 인터랙션 ───────── */
{id:'lift',cat:'ia',ko:'호버 리프트',en:'Hover Lift',mini:'lift',target:'상품 카드',hint:'카드에 마우스를 올리거나 탭해보세요',
 icon:'<rect x="5" y="4" width="14" height="10" rx="2"/><path d="M7 18h10M9 21h6" opacity=".5"/>',
 desc:'마우스를 올리면 카드가 살짝 떠오르고 그림자가 깊어집니다. 클릭할 수 있는 카드라는 것을 알려주는 가장 대표적인 반응형 효과입니다.',
 how:':hover 상태에 translateY(−n px)과 더 큰 box-shadow를 지정하고, 기본 상태에 transition을 걸어 두 상태 사이를 보간합니다. 터치 기기에는 hover가 없으므로 @media (hover: hover)로 감싸고 :active를 대체로 씁니다.',
 params:[R('lift','떠오르는 높이',8,0,24,1,'px'),R('shadow','그림자 깊이',30,0,60,1,'px'),R('dur','지속시간',260,80,800,10,'ms'),EASE('expo')],
 build(st,p){const c=mk('div','card','<div class="ph"></div><div class="tx"><b>로즈실버 워치</b><span>₩ 289,000</span></div>',st);
   c.style.transition=`transform ${p.dur}ms ${ez(p.ease)}, box-shadow ${p.dur}ms ${ez(p.ease)}`;c.style.boxShadow='0 4px 10px rgba(0,0,0,.35)';
   const on=()=>{c.style.transform=`translateY(-${p.lift}px)`;c.style.boxShadow=`0 ${p.shadow*.5}px ${p.shadow}px rgba(0,0,0,.6)`;};const off=()=>{c.style.transform='';c.style.boxShadow='0 4px 10px rgba(0,0,0,.35)';};
   c.addEventListener('pointerenter',on);c.addEventListener('pointerleave',off);c.addEventListener('pointerdown',on);c.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')setTimeout(off,250);});
   return async()=>{on();await wait(+p.dur+700);off();await wait(+p.dur);};},
 code:p=>`.card {\n  transition: transform ${p.dur}ms ${ez(p.ease)},\n              box-shadow ${p.dur}ms ${ez(p.ease)};\n}\n@media (hover: hover) {\n  .card:hover {\n    transform: translateY(-${p.lift}px);\n    box-shadow: 0 ${p.shadow/2}px ${p.shadow}px rgba(0,0,0,.6);\n  }\n}`,
 prompt:(p,t)=>`${t}에 마우스를 올리면 살짝 떠오르는 호버 리프트 효과를 넣어줘.\n- hover 시: translateY(-${p.lift}px), box-shadow를 0 ${p.shadow/2}px ${p.shadow}px 정도로 깊게\n- transition: transform, box-shadow ${p.dur}ms ${ez(p.ease)}\n- @media (hover: hover) 안에서만 hover를 적용하고, 터치 기기는 :active일 때 같은 효과를 짧게 보여줘.\n- 키보드 포커스(:focus-visible)에도 같은 상태를 적용해줘.`},

{id:'press',cat:'ia',ko:'누름 피드백',en:'Press',mini:'press',target:'모든 버튼',hint:'버튼을 눌러보세요',
 icon:'<rect x="4" y="9" width="16" height="9" rx="4.5"/><path d="M12 3v3M8.5 4.5l1 1.5M15.5 4.5l-1 1.5"/>',
 desc:'버튼을 누르는 순간 살짝 작아져서 눌렸다는 촉감을 줍니다. 모든 버튼에 기본으로 넣어두면 앱 전체가 반응성 있게 느껴집니다.',
 how:':active 상태에서 scale(0.95 내외)로 줄였다가 손을 떼면 transition으로 복귀합니다. 누를 때는 빠르게(100ms 내외), 복귀는 조금 느리게 하면 자연스럽습니다.',
 params:[R('s','눌림 크기',.94,.8,1,.01,'×'),R('dur','눌림 속도',110,40,400,10,'ms'),R('back','복귀 속도',260,80,800,10,'ms')],
 build(st,p){const b=mk('button','pbtn','눌러보세요',st);const set=d=>{b.style.transition=`transform ${d}ms cubic-bezier(.22,.61,.36,1)`;};set(p.back);
   const down=()=>{set(p.dur);b.style.transform=`scale(${p.s})`;};const up=()=>{set(p.back);b.style.transform='';};
   b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);
   return async()=>{down();await wait(+p.dur+120);up();await wait(+p.back);};},
 code:p=>`.btn {\n  transition: transform ${p.back}ms ease-out;\n}\n.btn:active {\n  transform: scale(${p.s});\n  transition-duration: ${p.dur}ms;\n}`,
 prompt:(p,t)=>`${t}에 누르는 순간 살짝 작아지는 누름 피드백을 넣어줘.\n- :active일 때 scale(${p.s})\n- 눌릴 때 ${p.dur}ms, 손을 뗄 때 ${p.back}ms로 복귀 (ease-out)\n- 모바일에서도 :active가 바로 반응하도록 touch-action: manipulation을 설정하고, 탭 하이라이트는 투명하게 해줘.`},

{id:'ripple',cat:'ia',ko:'리플',en:'Ripple',mini:'pulse',target:'버튼',hint:'버튼의 아무 곳이나 눌러보세요',
 icon:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="12" r="1.4" fill="url(#rsg)"/><circle cx="9" cy="12" r="4.2" opacity=".6"/>',
 desc:'터치한 지점에서 물결이 퍼져나갑니다. 머티리얼 디자인의 대표 피드백으로, 어디를 눌렀는지 시각적으로 확인시켜 줍니다.',
 how:'pointerdown 이벤트 좌표를 버튼 내부 좌표로 바꿔 그 위치에 원형 span을 만들고, scale 0 → 큰 값, opacity 0.5 → 0으로 애니메이션한 뒤 제거합니다. 버튼에는 position: relative와 overflow: hidden이 필요합니다.',
 params:[DUR(650,200,1500),R('size','퍼짐 크기',14,4,30,1,'×'),R('alpha','물결 진하기',.5,.1,.9,.05,'')],
 build(st,p){const b=mk('button','pbtn','Ripple Button',st);b.style.padding='18px 40px';
   const spawn=(x,y)=>{const w=mk('span','wave',null,b);w.style.left=x+'px';w.style.top=y+'px';const a=w.animate([{transform:'scale(0)',opacity:p.alpha},{transform:`scale(${p.size})`,opacity:0}],{duration:+p.dur,easing:'cubic-bezier(.22,.61,.36,1)'});a.onfinish=()=>w.remove();return a;};
   b.addEventListener('pointerdown',e=>{const r=b.getBoundingClientRect();spawn(e.clientX-r.left,e.clientY-r.top);});
   return()=>spawn(b.offsetWidth*.3,b.offsetHeight*.5);},
 code:p=>`btn.addEventListener('pointerdown', e => {\n  const r = btn.getBoundingClientRect();\n  const s = document.createElement('span');\n  s.className = 'ripple';\n  s.style.left = (e.clientX - r.left) + 'px';\n  s.style.top  = (e.clientY - r.top) + 'px';\n  btn.appendChild(s);\n  s.animate([{ transform:'scale(0)', opacity:${p.alpha} },\n             { transform:'scale(${p.size})', opacity:0 }],\n            { duration:${p.dur}, easing:'ease-out' })\n   .onfinish = () => s.remove();\n});`,
 prompt:(p,t)=>`${t}을(를) 누르면 누른 위치에서 물결이 퍼지는 리플 효과를 만들어줘.\n- pointerdown 좌표를 버튼 내부 좌표로 변환해서 그 위치에 원을 생성\n- 원: scale 0 → ${p.size}배, opacity ${p.alpha} → 0\n- 지속시간: ${p.dur}ms, ease-out, 끝나면 DOM에서 제거\n- 버튼은 position: relative, overflow: hidden\n- 여러 번 빠르게 눌러도 물결이 각각 겹쳐서 보이게 해줘.`},

{id:'magnetic',cat:'ia',ko:'마그네틱 버튼',en:'Magnetic',mini:'slide',target:'CTA 버튼',hint:'버튼 근처로 커서를 움직여보세요',
 icon:'<path d="M6 4v8a6 6 0 0 0 12 0V4h-4v8a2 2 0 0 1-4 0V4z"/>',
 desc:'커서가 가까이 오면 버튼이 커서 쪽으로 끌려옵니다. 포트폴리오, 랜딩 페이지의 핵심 CTA에 쓰는 고급 인터랙션입니다.',
 how:'pointermove에서 버튼 중심과 커서 사이의 거리(dx, dy)를 구해 transform: translate(dx × 강도, dy × 강도)로 이동시킵니다. 커서가 범위를 벗어나면 Back Out 이징으로 원위치합니다. 안쪽 글자를 절반만 움직이면 입체감이 생깁니다.',
 params:[R('k','끌림 강도',.4,0,1,.05,''),R('range','반응 반경',140,60,260,5,'px'),R('ret','복귀 시간',500,150,1200,10,'ms')],
 build(st,p){const b=mk('button','pbtn','<span style="display:inline-block">Get Started</span>',st);const lab=b.firstChild;b.style.padding='18px 36px';
   const move=(x,y,fast)=>{const tr=fast?'transform .15s linear':`transform ${p.ret}ms cubic-bezier(.34,1.56,.64,1)`;b.style.transition=tr;lab.style.transition=tr;b.style.transform=`translate(${x}px,${y}px)`;lab.style.transform=`translate(${x*.5}px,${y*.5}px)`;};
   st.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d<p.range)move(dx*p.k,dy*p.k,true);else move(0,0,false);});
   st.addEventListener('pointerleave',()=>move(0,0,false));
   return async()=>{const k=p.k*60;const pts=[[k,-k*.5],[-k*.7,k*.4],[k*.3,k*.6],[0,0]];for(const [x,y] of pts){move(x,y,false);await wait(380);}await wait(+p.ret);};},
 code:p=>`area.addEventListener('pointermove', e => {\n  const r = btn.getBoundingClientRect();\n  const dx = e.clientX - (r.left + r.width / 2);\n  const dy = e.clientY - (r.top + r.height / 2);\n  const near = Math.hypot(dx, dy) < ${p.range};\n  btn.style.transform = near\n    ? \`translate(\${dx * ${p.k}}px, \${dy * ${p.k}}px)\`\n    : '';\n});\n/* .btn { transition: transform ${p.ret}ms cubic-bezier(.34,1.56,.64,1); } */`,
 prompt:(p,t)=>`${t}에 커서가 가까이 오면 버튼이 커서 쪽으로 끌려오는 마그네틱 효과를 만들어줘.\n- 반응 반경: 버튼 중심에서 ${p.range}px 이내\n- 이동량: 커서와의 거리(dx, dy) × ${p.k}\n- 안쪽 텍스트는 버튼 이동량의 절반만 움직여 입체감 주기\n- 커서가 벗어나면 ${p.ret}ms cubic-bezier(.34,1.56,.64,1)로 원위치\n- requestAnimationFrame으로 업데이트를 묶고, 터치 기기(hover: none)에서는 비활성화해줘.`},

{id:'tilt',cat:'ia',ko:'3D 틸트',en:'Tilt',mini:'tilt',target:'멤버십 카드',hint:'카드 위에서 커서를 움직여보세요',
 icon:'<path d="M5 7l12-3v14l-12-1z"/><path d="M8 11l6-1" opacity=".6"/>',
 desc:'커서 위치에 따라 카드가 3D로 기울어지고 빛 반사가 따라 움직입니다. 상품 카드, 멤버십 카드, 앨범 커버에 씁니다.',
 how:'카드 안에서 커서의 상대 위치를 −0.5~0.5로 구한 뒤 rotateY = x × 최대각, rotateX = −y × 최대각으로 바꿉니다. 반사광은 radial-gradient의 중심을 커서 위치로 옮겨 표현합니다.',
 params:[R('max','최대 기울기',14,0,35,1,'°'),R('persp','원근 거리',800,300,2000,10,'px'),R('glare','반사광',.35,0,.8,.05,'')],
 build(st,p){const c=mk('div','',null,st);c.style.cssText='width:min(250px,76%);aspect-ratio:1.586;border-radius:16px;background:var(--metal);position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6);transition:transform .5s cubic-bezier(.16,1,.3,1)';
   c.innerHTML='<div style="position:absolute;left:18px;top:16px;font-family:var(--f-display);color:var(--ink);font-size:18px;letter-spacing:.08em">ROSE · SILVER</div><div style="position:absolute;left:18px;bottom:16px;font-family:var(--f-mono);color:var(--ink);font-size:12px;opacity:.75">0427 1132 8890 2026</div>';
   const gl=mk('div','',null,c);gl.style.cssText='position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0;transition:opacity .3s';
   const set=(x,y)=>{c.style.transform=`perspective(${p.persp}px) rotateX(${-y*p.max*2}deg) rotateY(${x*p.max*2}deg)`;gl.style.opacity=1;gl.style.background=`radial-gradient(circle at ${(x+.5)*100}% ${(y+.5)*100}%, rgba(255,255,255,${p.glare*2}), transparent 60%)`;};
   const reset=()=>{c.style.transform=`perspective(${p.persp}px)`;gl.style.opacity=0;};
   c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.transition='transform .1s linear';set((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5);});
   c.addEventListener('pointerleave',()=>{c.style.transition='transform .5s cubic-bezier(.16,1,.3,1)';reset();});
   return async()=>{c.style.transition='transform .45s cubic-bezier(.16,1,.3,1)';for(const [x,y] of [[.5,-.4],[-.5,-.3],[-.4,.5],[.45,.4]]){set(x,y);await wait(450);}reset();await wait(500);};},
 code:p=>`card.addEventListener('pointermove', e => {\n  const r = card.getBoundingClientRect();\n  const x = (e.clientX - r.left) / r.width  - 0.5;\n  const y = (e.clientY - r.top)  / r.height - 0.5;\n  card.style.transform =\n    \`perspective(${p.persp}px) rotateX(\${-y * ${p.max*2}}deg) rotateY(\${x * ${p.max*2}}deg)\`;\n});\ncard.addEventListener('pointerleave', () => card.style.transform = '');`,
 prompt:(p,t)=>`${t}에 커서 위치에 따라 3D로 기울어지는 틸트 효과를 만들어줘.\n- 최대 기울기: ±${p.max}deg (가장자리에서 최대)\n- perspective: ${p.persp}px\n- 커서 위치에 radial-gradient 반사광(흰색, 불투명도 ${p.glare})이 따라다니게, mix-blend-mode: soft-light\n- 커서가 벗어나면 500ms expo-out으로 평평하게 복귀\n- 터치 기기에서는 기울기 대신 탭 시 살짝 눌리는 효과로 대체해줘.`},

{id:'toggle',cat:'ia',ko:'토글 스위치',en:'Toggle',mini:'slide',target:'알림 설정 스위치',hint:'스위치를 눌러보세요',
 icon:'<rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="16" cy="12" r="3" fill="url(#rsg)"/>',
 desc:'켜고 끌 때 손잡이가 미끄러지고 배경색이 바뀝니다. 설정 화면의 기본 컨트롤입니다.',
 how:'켜짐 상태 클래스(.on 또는 :checked)에 따라 손잡이의 translateX와 트랙 배경색이 바뀌고, transition이 그 사이를 채웁니다. Back Out 이징을 쓰면 손잡이가 끝에서 살짝 튕깁니다. 실제 구현은 input type="checkbox"를 기반으로 해야 접근성이 지켜집니다.',
 params:[R('dur','지속시간',300,80,900,10,'ms'),R('stretch','눌림 늘어남',8,0,16,1,'px'),EASE('back')],
 build(st,p){const s=mk('button','sw','<i></i>',st);s.setAttribute('aria-label','토글');s.style.transform='scale(1.4)';const k=s.firstChild;
   const tr=`transform ${p.dur}ms ${ez(p.ease)}, width ${p.dur}ms ${ez(p.ease)}`;k.style.transition=tr;s.style.transition=`background ${p.dur}ms ease`;
   const apply=()=>{const on=s.classList.contains('on');k.style.transform=on?'translateX(34px)':'none';};
   s.addEventListener('pointerdown',()=>{k.style.width=(34+ +p.stretch)+'px';if(s.classList.contains('on'))k.style.transform=`translateX(${34-p.stretch}px)`;});
   s.addEventListener('click',()=>{k.style.width='34px';s.classList.toggle('on');apply();});
   return async()=>{s.classList.toggle('on');apply();await wait(+p.dur+500);};},
 code:p=>`.switch .knob {\n  transition: transform ${p.dur}ms ${ez(p.ease)};\n}\n.switch .track { transition: background ${p.dur}ms ease; }\ninput:checked + .track { background: #dcaaac; }\ninput:checked + .track .knob { transform: translateX(34px); }\n.switch:active .knob { width: calc(34px + ${p.stretch}px); }`,
 prompt:(p,t)=>`${t}을(를) 애니메이션되는 토글 스위치로 만들어줘.\n- 기반: <input type="checkbox" role="switch">, 시각 요소는 그 위에 커스텀\n- 켜질 때 손잡이가 오른쪽으로 이동, 트랙 색이 로즈(#dcaaac)로 변경\n- transition: ${p.dur}ms ${ez(p.ease)}\n- 누르고 있는 동안 손잡이가 ${p.stretch}px 옆으로 늘어나는 디테일 추가\n- 키보드 Space로도 토글되고 포커스 링이 보이게 해줘.`},

/* ───────── 로딩 ───────── */
{id:'orb',cat:'ld',isNew:1,src:'libraries.dev/orbs · npm thinking-orbs',ko:'씽킹 오브',en:'Thinking Orb',mini:'spin',target:'AI 답변 대기 표시',
 icon:'<circle cx="12" cy="12" r="8.5"/><circle cx="9.5" cy="10" r="3" fill="url(#rsg)" opacity=".55" stroke="none"/><circle cx="14.5" cy="13.5" r="2.4" fill="url(#rsg)" opacity=".8" stroke="none"/>',
 desc:'AI가 생각하는 동안 스피너 대신 보여주는 살아있는 구슬입니다. Libraries.dev의 thinking-orbs 패키지처럼 작업 단계마다 다른 9가지 상태(찾기, 풀기, 듣기, 연결, 엮기, 작성, 숨쉬기 등)로 지금 무엇을 하는지 알려줍니다. 64px는 채팅 아바타 크기, 20px는 문장 안에 넣는 크기입니다.',
 how:'구슬 하나를 원형으로 잘라낸(clip) canvas 안에 상태별로 다른 그림을 매 프레임 그립니다. 예를 들어 searching은 빛 한 점이 궤도를 돌며 꼬리를 남기고, connecting은 떠다니는 점들 사이에 가까울수록 진한 선을 잇고, shaping은 구슬 외곽선 자체를 sin 파형으로 일렁이게 합니다. 모든 움직임을 하나의 시계(t)에 묶어 두면 speed는 시계에 곱하는 배수, paused는 시계를 멈추는 것으로 간단히 처리됩니다. 이 미리보기의 상태별 모양은 패키지 이름에 맞춰 직접 그린 재현이며, 실제 패키지의 손으로 다듬은 모양과는 다를 수 있습니다.',
 params:[SEL('state','state (상태)','working',ORB_STATES),SEL('size','size','64',[['64','64 · 채팅 아바타 크기'],['20','20 · 문장 속 크기']]),R('speed','speed',1,.25,3,.05,'×'),SEL('dark','dark','true',[['true','true · 어두운 배경용'],['false','false · 밝은 배경용']]),SEL('paused','paused','false',[['false','false · 재생'],['true','true · 멈춤']])],
 build(st,p,c){const dark=p.dark==='true';const g0=mk('div','',null,st);g0.style.cssText=`display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 26px;border-radius:20px;${dark?'':'background:#f7f2f2;'}`;
   const big=orbCanvas(g0,124);
   const row=mk('div','',null,g0);row.style.cssText=`display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;${dark?'background:var(--surface-2);border:1px solid var(--line-2);':'background:#fff;border:1px solid #e6dcdd;'}`;
   const av=orbCanvas(row,+p.size===64?40:20);const lab=mk('span','',null,row);lab.style.cssText=`font-size:13px;color:${dark?'var(--fg)':'#2a1d20'}`;lab.textContent=ORB_LABEL[p.state];
   let tt=0;const draw=()=>{drawOrb(big.g,124,p.state,tt,dark);drawOrb(av.g,av.S,p.state,tt,dark);};draw();
   return()=>{loop(c,(t,dt)=>{if(p.paused!=='true')tt+=dt*p.speed;draw();});return null;};},
 code:p=>`// npm install thinking-orbs   (React 18+)\nimport { ThinkingOrb } from 'thinking-orbs';\n\n// AI 단계 → 오브 상태\nconst ORB = { search: 'searching', reason: 'solving', tools: 'connecting',\n              write: 'composing', voice: 'listening', idle: 'breathing' };\n\n<ThinkingOrb\n  state="${p.state}"\n  size={${p.size}}        // 64: 채팅 아바타, 20: 문장 속\n  speed={${p.speed}}\n  dark={${p.dark}}\n  paused={${p.paused}}\n/>`,
 prompt:(p,t)=>`내 React 앱의 ${t}에 Libraries.dev의 Thinking Orb를 추가해줘. 지금 쓰는 로딩 스피너를 이걸로 바꾸는 거야.\n\n설치: npm install thinking-orbs  (React 18 이상인지 먼저 확인)\n\n사용:\nimport { ThinkingOrb } from 'thinking-orbs';\n<ThinkingOrb state="${p.state}" size={${p.size}} speed={${p.speed}} dark={${p.dark}} paused={${p.paused}} />\n\nprops:\n- state: "working" | "searching" | "solving" | "listening" | "connecting" | "weaving" | "composing" | "breathing" | "shaping"\n- size: 64(채팅 아바타 크기) 또는 20(문장 속 크기), 각각 따로 튜닝되어 있으니 다른 값 대신 둘 중 하나만 써줘\n- speed: 애니메이션 시계 배수(기본 1), dark: 배경 밝기에 맞는 튜닝 선택, paused: 정지\n\n조건:\n- AI 처리 단계에 맞춰 state를 바꿔줘: 웹 검색 중 → searching, 추론 중 → solving, 도구/API 호출 → connecting, 답변 스트리밍 → composing, 음성 입력 → listening, 대기 → breathing\n- 채팅 말풍선 옆 아바타 자리는 size 64, "답변 작성 중…" 같은 문장 안에는 size 20\n- 앱 테마가 다크면 dark={true}로 연결\n- 응답이 끝나면 오브를 페이드 아웃하고 실제 메시지로 교체\n- 적용한 파일과 바꾼 부분을 마지막에 요약해줘.`},

{id:'spinner',cat:'ld',ko:'스피너',en:'Spinner',mini:'spin',target:'로딩 표시',
 icon:'<circle cx="12" cy="12" r="8" opacity=".25"/><path d="M12 4a8 8 0 0 1 8 8"/>',
 desc:'원형 선이 끊임없이 회전하며 처리 중임을 알립니다. 버튼 안 로딩, 페이지 로딩에 씁니다.',
 how:'테두리 중 한 변만 다른 색인 원(border-top-color)을 rotate(0 → 360deg)로 linear 무한 반복합니다. 회전은 일정 속도여야 이음새 없이 보입니다.',
 params:[R('dur','한 바퀴 시간',900,300,3000,10,'ms'),R('th','선 두께',4,1,12,1,'px'),R('size','크기',64,24,120,1,'px')],
 build(st,p){const r=mk('div','ring',null,st);r.style.cssText+=`;width:${p.size}px;height:${p.size}px;border-width:${p.th}px`;return()=>{r.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:+p.dur,iterations:Infinity});return null;};},
 code:p=>`.spinner {\n  width: ${p.size}px; height: ${p.size}px;\n  border: ${p.th}px solid rgba(220,170,172,.18);\n  border-top-color: #f6dad7;\n  border-radius: 50%;\n  animation: spin ${p.dur}ms linear infinite;\n}\n@keyframes spin { to { transform: rotate(360deg); } }`,
 prompt:(p,t)=>`${t}으로 쓸 원형 스피너를 CSS만으로 만들어줘.\n- 크기: ${p.size}px, 선 두께: ${p.th}px\n- 바탕 원은 반투명 로즈, 윗변(border-top)만 밝은 로즈실버\n- 한 바퀴 ${p.dur}ms, linear, infinite\n- role="status"와 aria-label="로딩 중"을 넣고, 300ms 이내에 끝나는 로딩에는 스피너를 띄우지 않게 지연 표시해줘.`},

{id:'dots',cat:'ld',ko:'점 로딩',en:'Typing Dots',mini:'bounce',target:'채팅 입력 중 표시',
 icon:'<circle cx="6" cy="12" r="2" fill="url(#rsg)"/><circle cx="12" cy="10" r="2" fill="url(#rsg)"/><circle cx="18" cy="12" r="2" fill="url(#rsg)"/>',
 desc:'점들이 차례로 튀어 오르며 대기 상태를 보여줍니다. 채팅의 입력 중 표시, AI 응답 대기에 씁니다.',
 how:'같은 키프레임(위로 올라갔다 내려옴)을 각 점에 주고 delay만 순서 × 간격으로 다르게 줍니다. 순차 등장(stagger)과 같은 원리를 무한 반복에 적용한 것입니다.',
 params:[R('n','점 개수',3,2,6,1,'개'),DUR(1200,400,3000),R('gap','점 간 시간차',160,0,400,10,'ms'),R('h','튀는 높이',10,0,24,1,'px')],
 build(st,p){const b=mk('div','',null,st);b.style.cssText='display:flex;gap:10px;padding:18px 22px;border-radius:22px;background:var(--surface-2);border:1px solid var(--line-2)';const ds=[];for(let i=0;i<p.n;i++){const d=mk('i','',null,b);d.style.cssText='width:12px;height:12px;border-radius:50%;background:var(--metal);display:block';ds.push(d);}
   return()=>{ds.forEach((d,i)=>d.animate([{transform:'translateY(0)',opacity:.35},{transform:`translateY(-${p.h}px)`,opacity:1,offset:.3},{transform:'translateY(0)',opacity:.35,offset:.6},{transform:'translateY(0)',opacity:.35}],{duration:+p.dur,delay:i*p.gap,iterations:Infinity,easing:'ease-in-out'}));return null;};},
 code:p=>`.dot {\n  animation: hop ${p.dur}ms ease-in-out infinite;\n  animation-delay: calc(var(--i) * ${p.gap}ms);\n}\n@keyframes hop {\n  0%, 60%, 100% { transform: translateY(0); opacity: .35; }\n  30%           { transform: translateY(-${p.h}px); opacity: 1; }\n}`,
 prompt:(p,t)=>`${t}로 쓸 점 ${p.n}개짜리 로딩 애니메이션을 만들어줘.\n- 각 점이 ${p.h}px 위로 튀었다 내려오며 투명도 0.35 → 1 → 0.35\n- 한 주기 ${p.dur}ms, ease-in-out, infinite\n- 점 간 시간차: ${p.gap}ms (CSS 변수 --i로 delay 계산)\n- 말풍선 모양 배경 안에 넣어줘.`},

{id:'skeleton',cat:'ld',ko:'스켈레톤',en:'Skeleton Shimmer',mini:'slide',target:'게시글 목록',
 icon:'<rect x="4" y="5" width="5" height="5" rx="1"/><path d="M11 6.5h9M11 9h6M4 14h16M4 17.5h12"/>',
 desc:'콘텐츠 자리에 회색 블록을 먼저 보여주고 빛이 훑고 지나갑니다. 실제 레이아웃을 미리 보여줘 체감 로딩 시간을 줄입니다.',
 how:'밝은 띠가 들어간 linear-gradient를 요소보다 넓게(background-size: 200%) 깔고 background-position을 오른쪽에서 왼쪽으로 반복 이동시킵니다. 블록 크기를 실제 콘텐츠와 맞춰야 로딩 후 화면이 튀지 않습니다.',
 params:[DUR(1500,500,4000),R('a','빛 밝기',.12,.03,.4,.01,''),R('ang','빛 각도',100,60,160,1,'°')],
 build(st,p){const c=mk('div','sk','<div class="row"><div class="b" style="width:44px;height:44px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="b" style="height:11px;width:70%"></div><div class="b" style="height:11px;width:45%"></div></div></div><div class="b" style="height:90px"></div><div class="b" style="height:11px"></div><div class="b" style="height:11px;width:80%"></div>',st);
   const bs=[...c.querySelectorAll('.b')];bs.forEach(b=>b.style.backgroundImage=`linear-gradient(${p.ang}deg, transparent 30%, ${RS}${p.a}) 50%, transparent 70%)`);
   return()=>{bs.forEach(b=>b.animate([{backgroundPosition:'150% 0'},{backgroundPosition:'-50% 0'}],{duration:+p.dur,iterations:Infinity,easing:'ease-in-out'}));return null;};},
 code:p=>`.skeleton {\n  background: #221d1f linear-gradient(${p.ang}deg,\n    transparent 30%, rgba(232,184,186,${p.a}) 50%, transparent 70%);\n  background-size: 200% 100%;\n  animation: shimmer ${p.dur}ms ease-in-out infinite;\n}\n@keyframes shimmer {\n  from { background-position: 150% 0; }\n  to   { background-position: -50% 0; }\n}`,
 prompt:(p,t)=>`${t}이(가) 로딩되는 동안 보여줄 스켈레톤 UI를 만들어줘.\n- 실제 콘텐츠와 같은 크기의 블록(아바타 원, 제목 줄 2개, 이미지, 본문 줄 2개)\n- 블록 색: #221d1f, ${p.ang}deg 방향 밝은 띠(rgba(232,184,186,${p.a}))가 훑고 지나가는 쉬머\n- background-size 200%, background-position 이동, ${p.dur}ms ease-in-out infinite\n- 데이터가 오면 스켈레톤을 페이드 아웃하고 실제 콘텐츠로 교체해줘. aria-busy="true"도 설정해줘.`},

{id:'progress',cat:'ld',ko:'프로그레스 바',en:'Progress',mini:'slide',target:'파일 업로드 진행률',
 icon:'<rect x="3" y="10" width="18" height="4" rx="2"/><path d="M5 12h9" stroke-width="2.6"/>',
 desc:'작업 진행률을 막대로 채워 보여줍니다. 업로드, 단계형 폼, 설치 진행에 씁니다.',
 how:'width 대신 transform: scaleX(진행률)와 transform-origin: left를 써서 레이아웃 재계산 없이 막대를 늘립니다. 진행률이 갱신될 때마다 transition이 값 사이를 부드럽게 이어줍니다.',
 params:[DUR(1800,300,5000),R('to','목표 진행률',78,0,100,1,'%'),EASE('inout')],
 build(st,p){const g=mk('div','',null,st);g.style.cssText='display:flex;flex-direction:column;align-items:center;gap:14px;width:100%';const n=mk('div','metal-text','0%',g);n.style.cssText+=';font-size:40px;font-variant-numeric:tabular-nums';const tr=mk('div','track','<i></i>',g);const f=tr.firstChild;
   return()=>{const a=anim(f,[{transform:'scaleX(0)'},{transform:`scaleX(${p.to/100})`}],p);const tick=()=>{const m=new DOMMatrix(getComputedStyle(f).transform);n.textContent=Math.round(m.a*100)+'%';if(a.playState==='running')requestAnimationFrame(tick);else n.textContent=p.to+'%';};requestAnimationFrame(tick);return a;};},
 code:p=>`.bar-fill {\n  transform-origin: left;\n  transform: scaleX(var(--p));\n  transition: transform ${p.dur}ms ${ez(p.ease)};\n}\n/* JS: fill.style.setProperty('--p', ${p.to/100}); */`,
 prompt:(p,t)=>`${t}을(를) 보여주는 프로그레스 바를 만들어줘.\n- 막대는 width 대신 transform: scaleX(진행률), transform-origin: left\n- 값이 바뀔 때 transition ${p.dur}ms ${ez(p.ease)}로 부드럽게 채워지게\n- 위에 퍼센트 숫자를 표시하고 tabular-nums로 폭이 흔들리지 않게\n- 예시 목표값 ${p.to}%로 데모해주고, role="progressbar"와 aria-valuenow를 갱신해줘.`},

/* ───────── 텍스트·스크롤 ───────── */
{id:'typing',cat:'ts',ko:'타이핑',en:'Typewriter',mini:'fade',target:'히어로 문구',
 icon:'<path d="M5 18L9.5 6 14 18M6.8 14h5.4"/><path d="M18 5v14"/>',
 desc:'글자가 한 자씩 입력되고 커서가 깜빡입니다. 히어로 문구, 챗봇 답변, 터미널 연출에 씁니다.',
 how:'JavaScript 타이머로 문자열을 한 글자씩 잘라 textContent에 넣습니다. 커서는 가상요소를 steps(1) 애니메이션으로 깜빡이게 합니다. 한글은 글자 폭이 일정하지 않아 CSS width + steps 방식보다 JS 방식이 정확합니다.',
 params:[R('speed','글자 간격',70,15,250,5,'ms'),R('hold','완성 후 대기',1200,0,4000,50,'ms'),R('blink','커서 깜빡임',1000,300,2000,50,'ms')],
 build(st,p,c){const box=mk('div','',null,st);box.style.cssText='font-family:var(--f-ko);font-size:24px;padding:0 24px;text-align:center;max-width:100%';const tx=mk('span','',null,box);const cur=mk('span','',null,box);cur.style.cssText='display:inline-block;width:2px;height:1.1em;background:var(--rose-hi);margin-left:3px;vertical-align:-3px';
   cur.animate([{opacity:1},{opacity:0}],{duration:+p.blink,iterations:Infinity,easing:'steps(1,end)'});
   const msg='손끝에 반응하는 로즈실버 모션';
   return async()=>{tx.textContent='';for(let i=1;i<=msg.length;i++){if(!c.alive)return;tx.textContent=msg.slice(0,i);await wait(+p.speed);}await wait(+p.hold);};},
 code:p=>`async function type(el, text) {\n  for (let i = 1; i <= text.length; i++) {\n    el.textContent = text.slice(0, i);\n    await new Promise(r => setTimeout(r, ${p.speed}));\n  }\n}\n.cursor { animation: blink ${p.blink}ms steps(1) infinite; }\n@keyframes blink { 50% { opacity: 0; } }`,
 prompt:(p,t)=>`${t}에 한 글자씩 입력되는 타이핑 효과를 만들어줘.\n- 글자 간격: ${p.speed}ms (JS 타이머로 textContent를 한 글자씩 늘리기)\n- 끝에 세로 막대 커서가 ${p.blink}ms 주기로 steps(1) 깜빡임\n- 완성 후 ${p.hold}ms 대기했다가 다음 문장으로 넘어가는 반복 옵션\n- 스크린리더에는 완성 문장이 한 번만 읽히게 aria-label에 전체 문장을 넣고 애니메이션 요소는 aria-hidden 처리해줘.`},

{id:'count',cat:'ts',ko:'카운트업',en:'Count Up',mini:'pop',target:'누적 가입자 수',
 icon:'<path d="M4 8l2-1.5V17M9.5 9a2.2 2.2 0 1 1 3.5 1.8L9.5 17H14M16.5 7h3.5l-2 4a2.5 2.5 0 1 1-2.2 4"/>',
 desc:'숫자가 0부터 목표값까지 빠르게 올라갑니다. 통계, 매출, 가입자 수 같은 핵심 지표를 강조할 때 씁니다.',
 how:'requestAnimationFrame 루프에서 경과시간 ÷ 지속시간으로 진행률 t(0~1)를 구하고, 이징 함수(easeOutExpo 등)를 적용해 값 = 목표 × ease(t)로 계산합니다. 숫자 폭이 흔들리지 않도록 tabular-nums를 씁니다.',
 params:[DUR(1800,300,5000),R('to','목표값',12840,10,100000,10,'')],
 build(st,p,c){const g=mk('div','',null,st);g.style.cssText='text-align:center';const n=mk('div','metal-text','0',g);n.style.cssText+=';font-size:56px;line-height:1;font-variant-numeric:tabular-nums';const l=mk('div','',null,g);l.textContent='누적 가입자';l.style.cssText='color:var(--muted);font-size:13px;margin-top:8px';
   return()=>new Promise(res=>{const t0=performance.now();const f=now=>{if(!c.alive)return res();const t=Math.min(1,(now-t0)/p.dur);const e=t===1?1:1-Math.pow(2,-10*t);n.textContent=Math.round(p.to*e).toLocaleString('ko-KR');if(t<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);});},
 code:p=>`function countUp(el, to, ms = ${p.dur}) {\n  const t0 = performance.now();\n  const ease = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);\n  requestAnimationFrame(function f(now) {\n    const t = Math.min(1, (now - t0) / ms);\n    el.textContent = Math.round(to * ease(t)).toLocaleString();\n    if (t < 1) requestAnimationFrame(f);\n  });\n}\ncountUp(el, ${p.to});`,
 prompt:(p,t)=>`${t} 숫자가 0부터 ${Number(p.to).toLocaleString('ko-KR')}까지 올라가는 카운트업 애니메이션을 만들어줘.\n- requestAnimationFrame 기반, 지속시간 ${p.dur}ms\n- easeOutExpo로 처음엔 빠르고 끝에서 천천히 멈추게\n- 천 단위 콤마 표시, font-variant-numeric: tabular-nums\n- 요소가 화면에 들어왔을 때(IntersectionObserver) 한 번만 시작되게 해줘.`},

{id:'reveal',cat:'ts',ko:'스크롤 리빌',en:'Scroll Reveal',mini:'up',target:'블로그 섹션',hint:'박스 안을 직접 스크롤해보세요',
 icon:'<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M9 8h6M9 11.5h6"/><path d="M9 15h6" opacity=".35"/>',
 desc:'스크롤해서 요소가 화면에 들어오는 순간 나타납니다. 랜딩 페이지와 블로그 본문에 가장 많이 쓰는 스크롤 반응 효과입니다.',
 how:'IntersectionObserver가 요소의 화면 노출 비율(threshold)을 감시하다가 기준을 넘으면 .in 클래스를 붙이고, CSS transition이 등장 애니메이션을 처리합니다. scroll 이벤트를 직접 계산하는 것보다 훨씬 가볍습니다.',
 params:[R('dist','이동 거리',36,0,100,1,'px'),R('dur','지속시간',700,100,2000,10,'ms'),R('th','노출 기준',.25,0,1,.05,''),EASE('expo')],
 build(st,p){const box=mk('div','scroller',null,st);const cards=[];for(let i=0;i<12;i++){const r=mk('div','rv',`<i></i><span>섹션 ${String(i+1).padStart(2,'0')} · 스크롤하면 나타나요</span>`,box);r.style.cssText=`opacity:0;transform:translateY(${p.dist}px);transition:opacity ${p.dur}ms ${ez(p.ease)},transform ${p.dur}ms ${ez(p.ease)}`;cards.push(r);}
   let io;const show=el=>{el.style.opacity=1;el.style.transform='none';};
   const observe=()=>{if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){show(e.target);io.unobserve(e.target);}}),{root:box,threshold:+p.th});cards.forEach(c=>io.observe(c));};
   return async c=>{cards.forEach(el=>{el.style.transition='none';el.style.opacity=0;el.style.transform=`translateY(${p.dist}px)`;});box.scrollTop=0;void box.offsetHeight;cards.forEach(el=>el.style.transition=`opacity ${p.dur}ms ${ez(p.ease)},transform ${p.dur}ms ${ez(p.ease)}`);observe();await wait(400);await autoScroll(box,3200,c);await wait(+p.dur);};},
 code:p=>`.reveal { opacity: 0; transform: translateY(${p.dist}px);\n  transition: opacity ${p.dur}ms ${ez(p.ease)}, transform ${p.dur}ms ${ez(p.ease)}; }\n.reveal.in { opacity: 1; transform: none; }\n\nconst io = new IntersectionObserver(es => es.forEach(e => {\n  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }\n}), { threshold: ${p.th} });\ndocument.querySelectorAll('.reveal').forEach(el => io.observe(el));`,
 prompt:(p,t)=>`스크롤해서 ${t}이(가) 화면에 들어오면 나타나는 스크롤 리빌 효과를 만들어줘.\n- IntersectionObserver 사용, threshold ${p.th} (요소가 ${Math.round(p.th*100)}% 보이면 시작)\n- 초기: translateY(${p.dist}px), opacity 0 → .in 클래스가 붙으면 제자리, opacity 1\n- transition: ${p.dur}ms ${ez(p.ease)}\n- 한 번 나타나면 unobserve해서 다시 숨기지 않기\n- JS가 꺼져 있어도 내용이 보이도록 html에 .js 클래스가 있을 때만 숨김 스타일을 적용해줘.`},

{id:'parallax',cat:'ts',ko:'패럴랙스',en:'Parallax',mini:'up',target:'메인 히어로 섹션',hint:'박스 안을 직접 스크롤해보세요',
 icon:'<circle cx="17" cy="7" r="2.5"/><path d="M2 19l6-8 4 5 3-3 7 6z"/>',
 desc:'스크롤할 때 배경과 전경이 서로 다른 속도로 움직여 깊이감이 생깁니다. 히어로 섹션, 스토리텔링 페이지에 씁니다.',
 how:'스크롤 위치(scrollY)에 레이어별 계수를 곱해 translateY를 줍니다. 멀리 있는 레이어일수록 계수를 크게 해서 스크롤 방향으로 따라 내려가게 하면, 화면에서는 더 느리게 지나가는 것처럼 보입니다. 업데이트는 requestAnimationFrame으로 묶습니다.',
 params:[R('k','배경 속도 계수',.6,0,1,.05,''),R('mid','중경 속도 계수',.3,0,1,.05,'')],
 build(st,p){const box=mk('div','scroller',null,st);box.style.padding='0';const scene=mk('div','',null,box);scene.style.cssText='position:relative;height:900px;overflow:hidden';
   const moon=mk('div','',null,scene);moon.style.cssText='position:absolute;right:16%;top:40px;width:70px;height:70px;border-radius:50%;background:var(--metal);box-shadow:0 0 50px rgba(232,184,186,.35)';
   const mtn=mk('div','',null,scene);mtn.style.cssText='position:absolute;left:-10%;right:-10%;top:150px;height:160px;background:linear-gradient(#3a2c30,#1b1518);clip-path:polygon(0 100%,12% 40%,24% 70%,40% 15%,55% 60%,70% 30%,86% 65%,100% 35%,100% 100%)';
   const fg=mk('div','',null,scene);fg.style.cssText='position:absolute;left:0;right:0;top:280px;display:flex;flex-direction:column;gap:14px;padding:0 22px';
   for(let i=0;i<5;i++){mk('div','rv',`<i></i><span>전경 콘텐츠 ${i+1} · 스크롤 속도 1.0</span>`,fg);}
   let raf=0;box.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const y=box.scrollTop;moon.style.transform=`translateY(${y*p.k}px)`;mtn.style.transform=`translateY(${y*p.mid}px)`;});},{passive:true});
   return async c=>{box.scrollTop=0;await wait(300);await autoScroll(box,3200,c);await wait(300);};},
 code:p=>`let ticking = false;\nwindow.addEventListener('scroll', () => {\n  if (ticking) return;\n  ticking = true;\n  requestAnimationFrame(() => {\n    const y = window.scrollY;\n    bg.style.transform  = \`translateY(\${y * ${p.k}}px)\`;\n    mid.style.transform = \`translateY(\${y * ${p.mid}}px)\`;\n    ticking = false;\n  });\n}, { passive: true });`,
 prompt:(p,t)=>`${t}에 스크롤 패럴랙스 효과를 만들어줘.\n- 레이어 3개: 배경(달·하늘), 중경(산), 전경(콘텐츠)\n- 스크롤 위치 × 계수로 translateY: 배경 ${p.k}, 중경 ${p.mid}, 전경 0(일반 스크롤)\n- scroll 이벤트는 passive로 등록하고 requestAnimationFrame으로 한 프레임에 한 번만 갱신\n- 모바일에서 버벅이면 계수를 절반으로 줄이고, prefers-reduced-motion이면 패럴랙스를 끄고 정적 배경으로 보여줘.`},

{id:'marquee',cat:'ts',ko:'마퀴',en:'Marquee',mini:'slide',target:'파트너 로고 띠',hint:'마우스를 올리면 멈춥니다',
 icon:'<path d="M3 9h12M9 15h12"/><path d="M18 6l3 3-3 3M6 12l-3 3 3 3"/>',
 desc:'로고나 문구가 끊김 없이 한 방향으로 흘러갑니다. 파트너 로고 띠, 공지 배너, 키워드 띠에 씁니다.',
 how:'같은 콘텐츠를 두 번 이어 붙이고 전체 트랙을 translateX(0)에서 −50%로 linear 무한 반복합니다. 절반 지점이 시작 지점과 똑같이 생겼기 때문에 이음새 없이 반복됩니다. 마우스를 올리면 animation-play-state: paused로 멈춥니다.',
 params:[R('sec','한 바퀴 시간',14,3,40,1,'s'),R('gap','간격',36,8,100,1,'px'),SEL('dir','방향','left',[['left','왼쪽으로'],['right','오른쪽으로']])],
 build(st,p){const m=mk('div','mq',null,st);const t=mk('div','mq-t',null,m);t.style.setProperty('--gap',p.gap+'px');const words=['Rose','Silver','Motion','Atlas','Hover','Scroll','Spring'];
   for(let k=0;k<2;k++)words.forEach(w=>{const s=mk('span','metal-text',w,t);s.style.paddingRight=p.gap+'px';s.style.setProperty('--gap',p.gap+'px');});
   return()=>{const kf=p.dir==='left'?[{transform:'translateX(0)'},{transform:'translateX(-50%)'}]:[{transform:'translateX(-50%)'},{transform:'translateX(0)'}];const a=t.animate(kf,{duration:p.sec*1000,iterations:Infinity});m.onpointerenter=()=>a.pause();m.onpointerleave=()=>a.play();m.onpointerup=e=>{if(e.pointerType!=='mouse')a.play();};return null;};},
 code:p=>`.marquee { overflow: hidden; }\n.marquee-track {\n  display: flex; width: max-content; gap: ${p.gap}px;\n  animation: marquee ${p.sec}s linear infinite${p.dir==='right'?' reverse':''};\n}\n.marquee:hover .marquee-track { animation-play-state: paused; }\n@keyframes marquee { to { transform: translateX(-50%); } }\n/* 트랙 안에 같은 항목 목록을 2번 넣기 */`,
 prompt:(p,t)=>`${t}을(를) 끊김 없이 흐르는 무한 마퀴로 만들어줘.\n- 같은 항목 목록을 2번 이어 붙이고 트랙을 translateX(0 → -50%)로 반복\n- 방향: ${p.dir==='left'?'왼쪽':'오른쪽'}으로, 한 바퀴 ${p.sec}초, linear, infinite\n- 항목 간격: ${p.gap}px\n- 양 끝은 mask-image 그라데이션으로 페이드 처리\n- 마우스를 올리면 멈추고, 복제된 두 번째 목록에는 aria-hidden="true"를 넣어줘.`},

{id:'morph',cat:'ts',ko:'블롭 모핑',en:'Blob Morph',mini:'swing',target:'배경 장식',
 icon:'<path d="M12 4c4 0 8 2.5 7.5 7S16 20 11 19.5 4 15.5 4.5 11 8 4 12 4z"/>',
 desc:'유기적인 덩어리가 형태를 바꾸며 일렁입니다. 배경 장식, 아바타 프레임, 음성 인식 표시에 씁니다.',
 how:'border-radius에 8개 값(예: 60% 40% 30% 70% / 60% 30% 70% 40%)을 넣으면 비대칭 블롭이 됩니다. 이 값들을 키프레임마다 바꾸고 alternate로 반복하면 형태가 부드럽게 변합니다. 느린 회전을 겹치면 더 살아있는 느낌이 납니다.',
 params:[DUR(6000,1500,15000),R('rot','회전량',90,0,360,5,'°'),R('size','크기',150,80,200,1,'px')],
 build(st,p){const o=mk('div','',null,st);o.style.cssText=`width:${p.size}px;height:${p.size}px;background:var(--metal);box-shadow:0 0 60px rgba(232,184,186,.25),inset 0 -14px 30px rgba(120,70,76,.35)`;
   return()=>{o.animate([{borderRadius:'60% 40% 30% 70% / 60% 30% 70% 40%',transform:'rotate(0)'},{borderRadius:'30% 60% 70% 40% / 50% 60% 30% 60%',transform:`rotate(${p.rot/2}deg)`},{borderRadius:'50% 50% 40% 60% / 40% 50% 60% 50%',transform:`rotate(${p.rot}deg)`}],{duration:+p.dur,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});return null;};},
 code:p=>`.blob {\n  animation: morph ${p.dur}ms ease-in-out infinite alternate;\n}\n@keyframes morph {\n  0%   { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }\n  50%  { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;\n         transform: rotate(${p.rot/2}deg); }\n  100% { border-radius: 50% 50% 40% 60% / 40% 50% 60% 50%;\n         transform: rotate(${p.rot}deg); }\n}`,
 prompt:(p,t)=>`${t}으로 쓸 유기적인 블롭 모핑 애니메이션을 만들어줘.\n- 크기 ${p.size}px, 로즈실버 메탈 그라데이션 배경\n- border-radius 8개 값(가로/세로)을 키프레임 3단계로 바꿔 형태 변화\n- 동시에 0 → ${p.rot}deg 천천히 회전\n- ${p.dur}ms, ease-in-out, alternate, infinite\n- 배경 장식이므로 pointer-events: none, aria-hidden 처리해줘.`},

{id:'spring',cat:'ia',ko:'스프링 물리',en:'Spring',mini:'bounce',target:'바텀시트',hint:'박스 안 아무 곳이나 눌러 목표를 옮겨보세요',
 icon:'<path d="M12 2v3l-5 2 10 3-10 3 10 3-5 2v4"/>',
 desc:'목표 지점으로 이동할 때 용수철처럼 지나쳤다 돌아오며 멈춥니다. 시트 드래그, 카드 스와이프처럼 손으로 만지는 느낌이 필요한 곳에 씁니다.',
 how:'시간 기반 이징 대신 물리 계산을 씁니다. 매 프레임 힘 F = −강성 × (현재 위치 − 목표) − 감쇠 × 속도를 구해 속도와 위치를 갱신합니다. 강성이 크면 빠르고 탄력 있게, 감쇠가 크면 덜 출렁입니다. 움직이는 중에 목표가 바뀌어도 현재 속도를 이어받아 자연스럽습니다.',

 code:p=>`let x = 0, v = 0, target = 300;\nconst k = ${p.k}, c = ${p.c}, m = ${p.m};\nfunction step() {\n  const dt = 1 / 60;\n  const F = -k * (x - target) - c * v;\n  v += (F / m) * dt;\n  x += v * dt;\n  el.style.transform = \`translateX(\${x}px)\`;\n  if (Math.abs(v) > 0.1 || Math.abs(x - target) > 0.1)\n    requestAnimationFrame(step);\n}\nrequestAnimationFrame(step);`,

function loop(c,fn){const t0=performance.now();let last=t0;const f=now=>{if(!c.alive)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(fn((now-t0)/1000,dt)!==false)requestAnimationFrame(f);};requestAnimationFrame(f);}

   let drag=null;st.addEventListener('pointerdown',e=>{if(p.src!=='drag')return;const r=st.getBoundingClientRect();drag=1-(e.clientY-r.top)/r.height;});st.addEventListener('pointermove',e=>{if(p.src!=='drag'||drag===null)return;const r=st.getBoundingClientRect();drag=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));});st.addEventListener('pointerup',()=>{drag=null;});st.addEventListener('pointerleave',()=>{drag=null;});
   const vt=child.querySelector('.vt');let rec=0;

 code:p=>`// npm install voice-glow   (React 18+, 마이크는 https/localhost + 사용자 클릭에서 start)\nimport { VoiceBeam, useMicrophone } from 'voice-glow';\n\nconst mic = useMicrophone();\n\n<VoiceBeam\n  type="${p.type}"\n  ${p.src==='drag'?'level={() => meter.current}   // 0~1 직접 공급':'stream={mic.stream}'}\n  processing={thinking}          // 현재: ${p.processing}\n  colorVariant="${p.color}"\n  sensitivity={${p.sensitivity}} threshold={${p.threshold}}\n  attack={${p.attack}} release={${p.release}}\n  reach={${p.reach}} spread={${p.spread}} idle={${p.idle}}\n  strength={${p.strength}} theme="${p.theme}"\n>\n  <ChatInput />\n</VoiceBeam>\n\n<button onClick={mic.state === 'live' ? mic.stop : mic.start}>\n  {mic.state === 'live' ? 'Stop' : 'Listen'}\n</button>`,
 prompt:(p,t)=>`내 React 앱의 ${t}에 Libraries.dev의 Voice 효과를 추가해줘. 말하면 ${t} 아래 가장자리에서 소리에 반응하는 빛이 솟아오르는 효과야.\n\n설치: npm install voice-glow  (React 18 이상인지 먼저 확인)\n\n사용:\nimport { VoiceBeam, useMicrophone } from 'voice-glow';\nconst mic = useMicrophone();\n\n<VoiceBeam type="${p.type}" ${p.src==='drag'?'level={() => meter.current}':'stream={mic.stream}'} processing={thinking} colorVariant="${p.color}" sensitivity={${p.sensitivity}} threshold={${p.threshold}} attack={${p.attack}} release={${p.release}} reach={${p.reach}} spread={${p.spread}} idle={${p.idle}} strength={${p.strength}} theme="${p.theme}">\n  <${t.replace(/\s/g,'')} />\n</VoiceBeam>\n\n<button onClick={mic.state === 'live' ? mic.stop : mic.start}>{mic.state === 'live' ? 'Stop' : 'Listen'}</button>\n\nprops 정리:\n- type: "default"(~350px 채팅 입력창) | "pill"(~150×44 녹음 알약) | "mobile"(휴대폰 화면 하단)\n- stream(MediaStream, level보다 우선) 또는 level(0~1 숫자나 매 프레임 getter)\n- processing: 작업 중이면 빛이 한 줄기로 모여 범위를 오감\n- colorVariant: colorful | mono | ocean | sunset | forest | candy | ice | gold, 또는 colors(최대 7색), bandColors { core, above, mid, below }\n- 입력 처리: sensitivity, threshold, attack, release / 반응 모양: reach, spread, flow, bend, idle\n- theme: dark | light | auto, strength, active, paused, scale\n\n조건:\n- 마이크는 보안 컨텍스트(https 또는 localhost)에서만 동작하고 mic.start()는 반드시 버튼 클릭 같은 사용자 동작 안에서 호출\n- 마이크 권한을 거부하면 안내 문구를 보여주고 버튼을 원래 상태로\n- AI 응답을 기다리는 동안 processing={true}, 응답이 오기 시작하면 false\n- 자식의 border-radius는 자동 감지되니 그대로 두기\n- 적용한 파일과 사용한 prop 값을 마지막에 요약해줘.`},

   wrap.innerHTML=`<svg viewBox="-12 -34 124 150" width="160" height="190" style="overflow:visible;display:block">
     <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7dfdb"/><stop offset=".45" stop-color="#d9adb0"/><stop offset=".7" stop-color="#efe7ea"/><stop offset="1" stop-color="#b3878c"/></linearGradient>
     <radialGradient id="${id}h" cx=".32" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
     <radialGradient id="${id}s" cx=".6" cy=".8" r=".7"><stop offset=".4" stop-color="#5a3a40" stop-opacity="0"/><stop offset="1" stop-color="#5a3a40" stop-opacity=".45"/></radialGradient></defs>

       <g class="face"><g class="eyes"><ellipse class="e" cx="${fx-11}" cy="${fy}" rx="5" ry="7" fill="#2a1d20"/><ellipse class="e" cx="${fx+11}" cy="${fy}" rx="5" ry="7" fill="#2a1d20"/>
         <circle class="gl" cx="${fx-12.5}" cy="${fy-2.5}" r="1.6" fill="#fff" opacity=".85"/><circle class="gl" cx="${fx+9.5}" cy="${fy-2.5}" r="1.6" fill="#fff" opacity=".85"/>
         <path class="lid" d="M${fx-17} ${fy}q6 5 12 0M${fx+5} ${fy}q6 5 12 0" stroke="#2a1d20" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0"/></g>

   const q=s=>wrap.querySelector(s),all=q('.all'),spinG=q('.spin'),face=q('.face'),eyes=[...wrap.querySelectorAll('.e')],gls=[...wrap.querySelectorAll('.gl')],lid=q('.lid'),mouth=q('.mouth'),shd=q('.shd');
   const zz=mk('div','',null,st);zz.style.cssText='position:absolute;left:50%;top:50%;pointer-events:none';
   const ptr={x:null,y:null};st.addEventListener('pointermove',e=>{const r=wrap.getBoundingClientRect();ptr.x=(e.clientX-(r.left+r.width/2))/r.width;ptr.y=(e.clientY-(r.top+r.height*.45))/r.height;});st.addEventListener('pointerleave',()=>{ptr.x=ptr.y=null;});
   let jump=null,lastJump=0,laugh=0,lx=0,ly=0,lastZ=0,clock=0;

     let y=0,sx=1,sy=1,turn=0;

       else if(u<SQ+AIR){const e=(u-SQ)/AIR;y=-jump.h*4*e*(1-e);sx=.94;sy=1.07;turn=jump.spin?e:0;}

     if(s==='sleeping'){const br=Math.sin(k*1.3);sy=1+.03*br;sx=1-.012*br;}
